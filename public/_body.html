/* Layout: a gallery-house of photography. Paper ground, full-bleed images, hairlines, a gunmetal band for Tender Yacht. Colours taken from the hull, the leather and the SARE logo set. Deliberately single-theme. */
:root{
  --paper:#f5f3ef; --paper-2:#ece9e3; --stone:#dad6d0; --mist:#c8ccdb;
  --slate:#54677f; --slate-deep:#3f4f63; --hull:#25252c; --ink:#1d1d1b;
  --muted:#5b616b; --line:rgba(37,37,44,.14); --line-2:rgba(37,37,44,.26);
  --on-hull:#f1efea; --on-hull-muted:#a9adb8; --hull-line:rgba(241,239,234,.16);
  --teak:#9b7653; --ok:#3f7a58; --warn:#9a6a1c;
  --display:"Silk Serif","Didot","Bodoni 72",Georgia,serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:300;margin:0;line-height:1.08;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:40px}
@media (max-width:640px){.wrap{padding-inline:20px}}
.eyebrow{font-family:var(--display);font-size:19px;font-weight:300;letter-spacing:.01em;color:var(--slate);line-height:1.3}
.h2{font-size:clamp(30px,3.77vw,52px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:1px solid var(--slate);outline-offset:4px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* header */
.hdr{position:fixed;left:0;right:0;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background .4s,color .4s,border-color .4s;border-bottom:1px solid transparent;color:var(--ink);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hdr.clear{background:transparent;color:#fff;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hdr:not(.clear){border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:76px}
.brand{display:flex;align-items:center;text-decoration:none;color:inherit}
.brand svg{height:26px;width:auto;fill:currentColor}
.nav{display:flex;gap:26px;margin:0 0 0 auto;list-style:none;padding:0;flex:none}
.nav a{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap;opacity:.82;padding-block:6px;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s}
.nav a:hover,.nav a.on{opacity:1;border-bottom-color:currentColor}
.nav a.req{display:none}
.nav a.req.show{display:inline}
.lang{position:relative}
.lang.cur{margin-right:-16px}
.lang.cur ul{min-width:220px}
.fxnote{font-size:12px;color:var(--muted);margin-top:18px}.fxnote:empty{display:none}
.drawer .langs+.langs{margin-top:12px}
.lang button{font:inherit;font-size:11px;font-weight:500;letter-spacing:.18em;color:inherit;background:none;border:1px solid currentColor;border-radius:0;padding:7px 10px;cursor:pointer;opacity:.85}
.lang ul{position:absolute;right:0;top:calc(100% + 8px);list-style:none;margin:0;padding:8px 0;background:var(--paper);color:var(--ink);border:1px solid var(--line-2);min-width:190px;box-shadow:0 18px 40px rgba(37,37,44,.14)}
.lang li button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;padding:9px 16px;font-size:13px;letter-spacing:.02em;font-weight:400;opacity:1;text-align:left}
.lang li button:hover,.lang li button[aria-current="true"]{background:var(--paper-2)}
.lang li button span{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.menu-btn{display:none;font:inherit;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;background:none;border:0;color:inherit;cursor:pointer;padding:8px 0}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;padding:16px 28px;border:1px solid var(--hull);background:var(--hull);color:var(--on-hull);text-decoration:none;cursor:pointer;border-radius:0;transition:background .3s,color .3s,border-color .3s}
.cta:hover{background:var(--slate);border-color:var(--slate)}
.cta.line{background:transparent;color:inherit;border-color:currentColor}
.cta.line:hover{background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.cta.light{background:#fff;color:var(--hull);border-color:#fff}
.cta.light:hover{background:transparent;color:#fff}
.cta.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.cta.ghost-light:hover{background:#fff;color:var(--hull)}
.cta.sm{padding:11px 18px;font-size:10px}
.hdr .cta{padding:11px 18px;font-size:10px}
.hdr.clear .cta{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.hdr.compact .nav,.hdr.compact .cta{display:none}
.hdr.compact .lang.cur{margin-left:auto}
.hdr.compact .menu-btn{display:block;margin-left:18px}
@media (max-width:1180px){.nav,.hdr .cta{display:none}.lang.cur{margin-left:auto}.menu-btn{display:block;margin-left:18px}}
.drawer{position:fixed;inset:0;z-index:60;background:var(--hull);color:var(--on-hull);padding:calc(env(safe-area-inset-top,0px) + 24px) 28px 40px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.drawer .top svg{height:24px;fill:currentColor}
.drawer a{font-family:var(--display);font-weight:300;font-size:28px;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--hull-line)}
.drawer .langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.drawer .langs button{font:inherit;font-size:11px;letter-spacing:.18em;background:none;border:1px solid var(--hull-line);color:var(--on-hull);padding:9px 12px;cursor:pointer}
.drawer .langs button[aria-current="true"]{background:var(--on-hull);color:var(--hull)}

/* views */
.view{animation:fade .6s ease both}
@keyframes fade{from{opacity:.0001;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding-block:120px}
@media (max-width:760px){section{padding-block:80px}}

/* hero */
.hdr.dark{background:var(--hull);color:#fff;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hdr.dark .cta{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);margin-top:calc(env(safe-area-inset-top,0px) + 76px);height:min(calc(100vh - 76px),820px);min-height:560px;background:var(--hull);color:#fff;overflow:hidden}
.hero img{grid-column:2;grid-row:1;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
@keyframes slow{from{transform:scale(1.03)}to{transform:scale(1)}}
.hero .inner{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:flex-end;padding:48px clamp(28px,4vw,64px) 72px max(40px,calc((100vw - 1240px)/2 + 40px));max-width:none}
.hero .hero-eb{color:var(--mist)}
.hero .tag{font-family:var(--display);font-weight:300;font-size:clamp(33px,3.61vw,57px);line-height:1.08;margin-top:16px;color:#fff;text-wrap:balance}
.hero .unique{margin-top:22px;font-size:15px;color:var(--mist);max-width:36ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
@media (max-width:1100px){
  .hero{display:block;height:auto;min-height:0}
  .hero img{display:block;height:auto;aspect-ratio:auto}
  .hero .inner{padding:40px 24px 56px}
  .hdr.clear{background:var(--hull)}}
.hdr.clear .nav a,.hdr.clear .lang button,.hdr.clear .cta{text-shadow:0 1px 6px rgba(18,20,26,.35)}
.page-hero{position:relative;margin:0;aspect-ratio:var(--ar,16/9);width:100%;color:#fff;overflow:hidden;background:var(--hull);display:flex;align-items:flex-end}
.page-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,22,28,.38),rgba(20,22,28,0) 35%,rgba(20,22,28,.55))}
.page-hero figcaption{position:relative;z-index:1;width:100%;padding-block:0 56px}
.page-hero.top{align-items:flex-start}
.page-hero.top figcaption{padding-block:calc(env(safe-area-inset-top,0px) + 130px) 0}
.page-hero.top::after{background:linear-gradient(180deg,rgba(20,22,28,.45),rgba(20,22,28,0) 45%)}
@media (max-width:760px){.page-hero.top figcaption{padding-block:28px 36px}}
@media (max-width:760px){.page-hero{aspect-ratio:auto;display:block;padding-top:calc(env(safe-area-inset-top,0px) + 0px)}.page-hero img{position:relative;inset:auto;height:auto;aspect-ratio:var(--ar,16/9)}.page-hero::after{display:none}.page-hero figcaption{padding-block:28px 36px}}
.page-hero .eyebrow{color:#fff;opacity:.9}
.page-hero h1{font-size:clamp(36px,5.74vw,85px);margin-top:16px}
.page-head{padding-top:calc(env(safe-area-inset-top,0px) + 170px);padding-bottom:48px}
.page-head h1{font-size:clamp(36px,5.74vw,82px);margin-top:16px}

/* blocks */
.statement{font-family:var(--display);font-weight:300;font-size:clamp(21px,2.54vw,34px);line-height:1.3;max-width:28ch;color:var(--hull)}
.lead{font-size:17px;font-weight:300;line-height:1.75;max-width:60ch;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:end}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:28px}}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:end;margin-bottom:64px}
.head h2{font-size:clamp(30px,3.77vw,52px);margin-top:16px}
@media (max-width:900px){.head{grid-template-columns:1fr;gap:20px;margin-bottom:44px}}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:900px){.trio{grid-template-columns:1fr;gap:44px}}
.tile{display:flex;flex-direction:column;gap:18px;text-decoration:none;color:inherit}
.tile .ph{aspect-ratio:3/2;overflow:hidden;background:var(--stone)}
.tile .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tile:hover .ph img{transform:scale(1.04)}
.tile h3{font-size:28px}
.tile p{color:var(--muted)}
.tile .more{font-size:11px;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid currentColor;align-self:flex-start;padding-bottom:3px}

.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2)}
.figures div{padding:30px 28px 10px 0}
.figures b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(39px,4.92vw,69px);line-height:1;color:var(--hull)}
.figures span{display:block;margin-top:12px;font-size:13px;color:var(--muted);max-width:26ch}
@media (max-width:760px){.figures{grid-template-columns:1fr}.figures div{padding:24px 0;border-bottom:1px solid var(--line)}}

.isles{display:flex;justify-content:center;gap:clamp(24px,6vw,90px);flex-wrap:wrap;align-items:flex-end}
.isles figure{margin:0;display:grid;gap:12px;justify-items:center}
.isles svg{height:84px;width:auto;fill:var(--slate)}
.isles figcaption{font-family:var(--display);font-size:17px;color:var(--muted)}

.feature{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;background:var(--paper-2)}
.feature .ph{aspect-ratio:3/2;position:relative;overflow:hidden}
.feature .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature .tx{padding:clamp(40px,6vw,96px);display:flex;flex-direction:column;justify-content:center;gap:24px}
.feature h2{font-size:clamp(30px,3.61vw,49px)}
@media (max-width:900px){.feature{grid-template-columns:1fr}}

/* island explorer */
.exp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);border:1px solid var(--line-2);background:#fff}
@media (max-width:1000px){.exp{grid-template-columns:1fr}}
.exp-map{position:relative;background:#e6eaf1;min-width:0;min-height:620px;border-right:1px solid var(--line-2);overflow:hidden}
@media (max-width:1000px){.exp-map{min-height:0}}
@media (max-width:1000px){.exp-map{border-right:0;border-bottom:1px solid var(--line-2)}}
#xmap{position:absolute;inset:0;display:block;width:100%;height:100%;--z:1;touch-action:manipulation}
#xmap .land{fill:#d9d4cc;stroke:#c3bdb4;vector-effect:non-scaling-stroke;stroke-width:1}
#xmap .isl{fill:var(--stone);stroke:#a9a39a;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .3s}
#xmap .grp:hover .isl{fill:#cfd3de}
#xmap .grp.on .isl{fill:var(--slate);stroke:var(--slate-deep)}
#xmap .grp.home .isl{fill:#c9cbd4}
#xmap .grp.home.on .isl{fill:var(--slate)}
#xmap .hit{fill:transparent;cursor:pointer}
#xmap .grp:focus{outline:none}
#xmap .grp:focus-visible .isl{stroke:var(--hull);stroke-width:2}
#xmap .lbl{font-family:var(--body);font-weight:500;font-size:calc(var(--z) * 12.5px);letter-spacing:.04em;fill:var(--hull);paint-order:stroke;stroke:#e6eaf1;stroke-width:calc(var(--z) * 4px);stroke-linejoin:round;pointer-events:none}
#xmap .grp.on .lbl{fill:var(--slate-deep);font-size:calc(var(--z) * 14px)}
#xmap.far .lbl.minor{display:none}
#xmap.far.narrow .lbl{display:none}
#xmap.far.narrow .lbl.sel{display:inline}
#xmap .ctx{font-family:var(--display);font-size:calc(var(--z) * 20px);fill:#9aa0aa;pointer-events:none}
#xmap .grat{stroke:rgba(84,103,127,.16);vector-effect:non-scaling-stroke;stroke-width:1}
#xmap .base{fill:var(--hull)}
.exp-ctrl{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (max-width:1000px){.exp-map{display:flex;flex-direction:column;aspect-ratio:auto}.exp-map #xmap{position:relative;inset:auto;aspect-ratio:1/1;height:auto}.exp-ctrl{position:static;padding:14px 16px;border-top:1px solid var(--line)}}
.exp-hint{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6f7988}
.exp-card{padding:36px 34px;display:flex;flex-direction:column;gap:16px;min-width:0}
.exp-card h3{font-size:33px}
.exp-photo{margin:-36px -34px 8px;aspect-ratio:3/2;overflow:hidden;background:var(--stone)}
.exp-photo img{width:100%;height:100%;object-fit:cover}
.exp-card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);align-items:center}
.exp-card .pill{display:inline-block;font-family:var(--body);font-size:10px;font-weight:500;text-transform:uppercase;border:1px solid var(--slate);color:var(--slate);padding:4px 9px;letter-spacing:.18em}
.exp-card .pill.tv{border-color:var(--teak);color:var(--teak)}
.exp-card .tagline{font-family:var(--display);font-size:18px;line-height:1.35;color:var(--hull)}
.exp-card .must{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.exp-card .must li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.exp-card .must b{font-weight:500;font-size:15px}
.exp-card .must span{color:var(--muted);font-size:14px}
.exp-card .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.exp-index{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px;margin-top:40px}
@media (max-width:1000px){.exp-index{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.exp-index{grid-template-columns:1fr}}
.exp-index h4{font-family:var(--body);font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);margin-bottom:10px}
.exp-index button{all:unset;display:block;cursor:pointer;font-family:var(--display);font-size:19px;line-height:1.5;color:var(--muted);transition:color .2s}
.exp-index button:hover,.exp-index button.on{color:var(--hull)}
.exp-index button.on{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.exp-index button:focus-visible{outline:1px solid var(--slate);outline-offset:3px}

/* yacht */
.gallery{display:grid;gap:10px}
.grow{display:flex;gap:10px}
.gallery button{all:unset;cursor:zoom-in;position:relative;overflow:hidden;background:var(--stone);flex:var(--ar) 1 0;aspect-ratio:var(--ar);min-width:0}
.gallery button:focus-visible{outline:1px solid var(--slate);outline-offset:3px}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.gallery button:hover img{transform:scale(1.03)}
@media (max-width:760px){.grow{flex-direction:column}.gallery button{flex:none;width:100%}}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
.spec{padding:26px 20px 26px 0;border-bottom:1px solid var(--line)}
.spec .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.spec .v{font-family:var(--display);font-weight:300;font-size:31px;margin-top:8px;color:var(--hull);line-height:1.1}
.spec .u{font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:760px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px}
@media (max-width:900px){.pillars{grid-template-columns:1fr;gap:36px}}
.pillars h3{font-size:23px;margin-bottom:14px}
.pillars p{color:var(--muted)}
.onboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
.onboard li{list-style:none;padding:18px 16px 18px 0;border-bottom:1px solid var(--line);font-size:14px}
.onboard{padding:0;margin:0}
@media (max-width:760px){.onboard{grid-template-columns:1fr 1fr}}

.lightbox{position:fixed;inset:0;z-index:80;background:rgba(18,19,24,.96);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 60px) 16px calc(env(safe-area-inset-bottom,0px) + 70px)}
.lightbox img{max-height:100%;max-width:100%;object-fit:contain}
.lightbox .cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:var(--on-hull);font-family:var(--display);font-size:18px}
.lightbox button{position:absolute;background:none;border:0;color:var(--on-hull);font:inherit;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:14px}
.lightbox .x{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
.lightbox .p{left:8px;top:50%}.lightbox .n{right:8px;top:50%}

/* sub navigation */
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 77px);z-index:30;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;align-items:center;gap:28px;height:56px;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav .crumb{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:flex;gap:10px;align-items:center}
.subnav .crumb b{font-weight:500;color:var(--ink)}
.subnav .crumb::after{content:"";width:1px;height:18px;background:var(--line-2);margin-left:18px}
.subnav button{font:inherit;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);padding:8px 0;cursor:pointer;white-space:nowrap}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--ink);border-bottom-color:var(--hull)}
.subnav .go{margin-left:auto;font-size:10px;padding:10px 16px;white-space:nowrap}
@media (max-width:760px){.subnav .crumb{display:none}.subnav .wrap{gap:22px}.subnav .go{display:none}}
[data-sec]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}
.nextch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;background:var(--paper-2);text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.nextch .ph{aspect-ratio:3/2;overflow:hidden}
.nextch .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.nextch:hover .ph img{transform:scale(1.03)}
.nextch .tx{padding:clamp(32px,6vw,96px);display:grid;gap:16px}
.nextch h2{font-size:clamp(33px,4.1vw,59px)}
.nextch .arrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid currentColor;justify-self:start;padding-bottom:3px}
@media (max-width:760px){.nextch{grid-template-columns:1fr}}

/* faq, further, quotes, booking aside */
.faq-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:72px;align-items:start}
@media (max-width:900px){.faq-wrap{grid-template-columns:1fr;gap:32px}}
.faq-ph{margin:0;aspect-ratio:3/2;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
.faq-ph img{width:100%;height:100%;object-fit:cover}
.faq{border-top:1px solid var(--line-2)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:24px;align-items:baseline;padding:24px 0;font-family:var(--display);font-size:20px;line-height:1.3;color:var(--hull)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--body);font-weight:300;font-size:18px;color:var(--slate);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq summary:focus-visible{outline:1px solid var(--slate);outline-offset:4px}
.faq details p{padding:0 48px 26px 0;color:var(--muted);max-width:62ch}
.further{margin-top:72px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:48px;align-items:start;padding:40px;background:var(--paper-2)}
@media (max-width:1000px){.further{grid-template-columns:1fr;gap:24px}}
.further h3{font-size:25px;margin-bottom:12px}
.further p{color:var(--muted)}
.further ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.further li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.further li b{font-family:var(--display);font-weight:300;font-size:17px}
.further li span{font-size:13px;color:var(--muted)}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;margin-top:48px}
.quotes figure{margin:0}
.quotes blockquote{margin:0;font-family:var(--display);font-size:21px;line-height:1.35}
.quotes figcaption{margin-top:16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-hull-muted)}
.aside .from{font-family:var(--display);font-size:28px;color:var(--hull)}
.aside .from small{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aside .nx{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);margin-top:14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;border-top:1px solid var(--line)}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(st);grid-row:span 2;font-family:var(--display);font-size:18px;color:var(--slate);line-height:1}
.steps b{font-weight:500;font-size:14px}
.steps span{font-size:13px;color:var(--muted)}

/* quick booking */
.quick{display:grid;gap:0;border-top:1px solid var(--line-2)}
.quick .q{padding:28px 0;border-bottom:1px solid var(--line)}
.quick .ql{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);margin-bottom:14px}
.quick .ql i{font-style:normal;font-family:var(--display);font-size:16px;letter-spacing:0;color:var(--hull);width:22px}
.quick .qrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
@media (max-width:640px){.quick .qrow{grid-template-columns:1fr;gap:28px}}
.quick input[type=date],.quick #b_name,.quick #b_contact{font-size:18px}
.xp{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.opts.xp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.xp .opt{flex-direction:column;gap:6px;padding:18px 16px}
.xp .opt .box{display:none}
.xp .opt b{font-family:var(--display);font-weight:300;font-size:17px;line-height:1.2}
.xp .opt small{font-size:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2)}
.stp{font:inherit;font-size:18px;font-weight:300;width:48px;height:48px;background:none;border:0;cursor:pointer;color:var(--hull)}
.stp:hover{background:var(--paper-2)}
.stepper output{min-width:64px;text-align:center;font-family:var(--display);font-size:21px;color:var(--hull)}
.extras{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--line-2);cursor:pointer;font-size:14px}
.tog input{-webkit-appearance:checkbox;appearance:auto;width:16px;height:16px;margin:0;padding:0;border:0;accent-color:var(--hull)}
.tog:has(input:checked){border-color:var(--hull);background:#fff}
.note{flex-basis:100%;margin-top:6px}
.note summary{cursor:pointer;font-size:13px;color:var(--slate);text-decoration:underline;text-underline-offset:4px;list-style:none;display:inline-block}
.note summary::-webkit-details-marker{display:none}
.note textarea{margin-top:10px}
.send{padding-top:28px}
.chat{display:inline-block;margin-top:18px;font-size:14px;color:var(--slate);text-underline-offset:4px}

/* personalise & occasions */
.touches{margin-top:20px;font-size:14px;color:var(--muted)}
.touches b{font-weight:500;color:var(--ink)}
.pcats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 48px}
@media (max-width:900px){.pcats{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.pcats{grid-template-columns:1fr}}
.pcats div{padding:26px 0;border-top:1px solid var(--line-2)}
.pcats h3{font-size:21px;margin-bottom:12px}
.pcats ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:var(--muted);font-size:15px}
.pcats .or{display:block;margin-top:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.occ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.occ{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.occ{grid-template-columns:1fr}}
.occ a{display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid var(--hull-line);text-decoration:none;color:var(--on-hull);transition:background .3s,border-color .3s}
.occ a:hover{background:rgba(200,204,219,.08);border-color:var(--mist)}
.occ b{font-family:var(--display);font-weight:300;font-size:20px;line-height:1.2}
.occ span{font-size:14px;color:var(--on-hull-muted)}
.occ .go{margin-top:auto;padding-top:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chips2 label{display:inline-flex;align-items:center;padding:9px 14px;border:1px solid var(--line-2);cursor:pointer;font-size:13px}
.chips2 input{position:absolute;opacity:0;width:1px;pointer-events:none}
.chips2 label:has(input:checked){background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.chips2 label:has(input:focus-visible){outline:1px solid var(--slate);outline-offset:2px}
.quick .ql em{font-style:normal;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);font-weight:400}
.perso{flex-basis:100%}
.perso summary{cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--line-2);font-size:14px;list-style:none}
.perso summary::-webkit-details-marker{display:none}
.perso summary::after{content:"+";color:var(--slate)}
.perso[open] summary::after{content:"−"}
.perso .pgrp{margin-top:18px}
.perso .pgrp b{display:block;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);margin-bottom:8px}

/* tender hook, facts, handler */
.hook{font-family:var(--display);font-weight:300;font-size:clamp(23px,2.79vw,38px);line-height:1.25;max-width:30ch;color:var(--on-hull)}
.tfacts{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hull-line);border-bottom:1px solid var(--hull-line)}
.tfacts li{padding:20px 18px 20px 0;font-size:14px;color:var(--on-hull);border-right:1px solid var(--hull-line);padding-left:18px}
.tfacts li{transition:background .35s,color .35s,box-shadow .35s;cursor:default}
.tfacts li:first-child{padding-left:18px}.tfacts li:last-child{border-right:0;color:var(--mist)}
.tfacts li:hover{background:var(--slate);color:#fff;box-shadow:0 0 28px rgba(200,204,219,.28)}
@media (max-width:900px){.tfacts{grid-template-columns:1fr 1fr}.tfacts li{border-bottom:1px solid var(--hull-line)}}
.handler{display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:32px;align-items:center;padding:32px;border:1px solid var(--mist)}
.handler .eyebrow{font-size:23px;color:var(--on-hull)}
.handler p{color:var(--on-hull-muted);margin-top:8px;max-width:60ch}
.handler .hc{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.handler .hcs{display:flex;gap:32px;flex-wrap:wrap}
.handler .hc b{font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
.handler .hc span{font-family:var(--display);font-size:20px;color:var(--on-hull)}
@media (max-width:760px){.handler{grid-template-columns:1fr}}

/* charter */
.formulas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
@media (max-width:1000px){.formulas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.formulas{grid-template-columns:1fr}}
.formula{padding:34px 28px 34px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.formula .dur{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate)}
.formula h3{font-size:26px}
.formula p{color:var(--muted);font-size:15px}
.formula .price{margin-top:auto;padding-top:12px;font-family:var(--display);font-size:25px;color:var(--hull)}
.formula .routes{list-style:none;margin:auto 0 0;padding:12px 0 0;display:grid;gap:6px}
.formula .routes li{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.formula .routes b{font-weight:500;white-space:nowrap}
.formula .price small{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.incl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;margin-top:80px}
@media (max-width:900px){.incl{grid-template-columns:1fr;gap:40px}}
.incl h3{font-size:25px;margin-bottom:18px}
.ticks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.ticks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ticks small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ticks .p{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);text-align:right;white-space:nowrap}

.chart-shell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:1px solid var(--line-2);background:#fff}
@media (max-width:1000px){.chart-shell{grid-template-columns:1fr}}
.chart{position:relative;background:#e9ecf2;min-width:0;border-right:1px solid var(--line-2)}
@media (max-width:1000px){.chart{border-right:0;border-bottom:1px solid var(--line-2)}}
.chart svg{display:block;width:100%;height:100%;min-height:340px}
.grat{stroke:rgba(84,103,127,.16)}
.grat-t{font-family:var(--mono);fill:#7b8798}
.chart .grat-t{font-size:12px}
.isle{fill:var(--stone);stroke:#b9b3aa;stroke-width:1.2;cursor:pointer;transition:fill .3s}
.isle:hover,.isle.on{fill:var(--mist)}
.isle-label{font-family:var(--display);font-weight:300;font-size:22px;fill:var(--hull);pointer-events:none}
.isle-label.s{font-size:18px}
.pin{cursor:pointer}
.pin .dot{fill:#fff;stroke:var(--slate);stroke-width:2}
.pin.on .dot,.pin:hover .dot{fill:var(--slate)}
.pin.base .dot{fill:var(--hull);stroke:var(--hull)}
.pin text{font-family:var(--body);font-size:12.5px;font-weight:500;fill:var(--hull);paint-order:stroke;stroke:#e9ecf2;stroke-width:4px;letter-spacing:.02em}
.route{fill:none;stroke:var(--slate);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round}
.route.pos{stroke-dasharray:6 6;stroke-width:1.4;opacity:.7}
.border{stroke:#b9b3aa;stroke-dasharray:3 4}
.rose line{stroke:#8a95a6}.rose text{font-family:var(--display);fill:var(--slate)}
.chart .rose text{font-size:16px}
.scale line{stroke:var(--hull)}.scale text{font-family:var(--body);font-size:11px;fill:var(--muted);letter-spacing:.08em}
.chart-note{position:absolute;left:14px;bottom:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7b8798}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;border-radius:0}
.chip:hover{color:var(--ink);border-color:var(--hull)}
.chip.on{background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.fiche{padding:36px 32px;min-width:0;display:flex;flex-direction:column;gap:18px}
.fiche h3{font-size:36px}
.fiche .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fiche .blurb{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);padding:12px 12px 12px 0;margin-right:14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hull)}
.items{list-style:none;margin:0;padding:0}
.items li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.items b{font-weight:500;font-size:15px}
.items span{color:var(--muted);font-size:14px}
.anchor-note{font-size:13px;color:var(--muted);border-left:1px solid var(--slate);padding-left:14px}
.fiche .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:8px}
.plan{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:24px 28px;background:#fff;border:1px solid var(--line-2)}
@media (max-width:760px){.plan{grid-template-columns:1fr}}
.stops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.stop{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 6px 6px 12px;border:1px solid var(--slate)}
.stop.base{border-color:var(--hull);background:var(--hull);color:var(--on-hull);padding-right:12px}
.stop button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 6px}
.stats{display:flex;gap:32px;flex-wrap:wrap}
.stats div{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);max-width:14ch}
.stats b{display:block;font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:0;text-transform:none;color:var(--hull);line-height:1.1}

/* tender (gunmetal band) */
.hullband{background:var(--hull);color:var(--on-hull)}
.hullband .eyebrow{color:var(--mist)}
.hullband .muted,.hullband .lead{color:var(--on-hull-muted)}
.hullband h2,.hullband h3{color:var(--on-hull)}
.quote{font-family:var(--display);font-weight:300;font-size:clamp(23px,2.79vw,38px);line-height:1.25;max-width:30ch}
.season{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hull-line);border-bottom:1px solid var(--hull-line)}
.season button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:24px 18px 26px;border-right:1px solid var(--hull-line);transition:background .3s}
.season button:last-child{border-right:0}
.season button:hover{background:rgba(200,204,219,.07)}
.season button:focus-visible{outline:1px solid var(--mist);outline-offset:-4px}
.season .m{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-hull-muted)}
.season .t{font-family:var(--display);font-size:18px;line-height:1.25;color:var(--on-hull)}
.season .peak .m::after{content:" ★";color:var(--mist)}
.season button.on{background:var(--slate)}
.season button.on .m{color:var(--on-hull)}
@media (max-width:900px){.season{grid-template-columns:1fr 1fr}.season button{border-bottom:1px solid var(--hull-line)}}
.season-detail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding:28px 0 0}
.season-detail p{font-family:var(--display);font-size:20px;line-height:1.4;color:var(--on-hull);max-width:46ch}
@media (max-width:760px){.season-detail{grid-template-columns:1fr}}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 48px}
@media (max-width:900px){.missions{grid-template-columns:1fr}}
.mission{padding:30px 0 34px;border-top:1px solid var(--hull-line)}
.mission h3{font-size:22px;margin-bottom:12px}
.mission p{color:var(--on-hull-muted);font-size:15px}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.why{grid-template-columns:1fr}}
.why b{display:block;font-family:var(--display);font-weight:300;font-size:18px;margin-bottom:8px}
.thow{gap:0}
.thow div{padding:28px 24px 30px 0;border-top:1px solid var(--hull-line)}
.thow div.key{border-top-color:var(--mist)}
.thow b{font-size:21px}
.aside .ln.incl span:last-child{color:var(--mist)}
.why p{font-size:14px;color:var(--on-hull-muted)}
.formats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.formats{grid-template-columns:1fr 1fr}}
.formats div{padding:24px;border:1px solid var(--hull-line)}
.formats b{display:block;font-family:var(--display);font-weight:300;font-size:20px}
.formats span{font-size:13px;color:var(--on-hull-muted)}
.hullband input,.hullband select,.hullband textarea{color:var(--on-hull);border-bottom-color:var(--hull-line)}
.hullband select option{background:var(--hull);color:var(--on-hull)}
.hullband label.f,.hullband legend{color:var(--on-hull-muted)}
.hullband legend{color:var(--mist)}
.hullband .opt{border-color:var(--hull-line)}
.hullband .opt:has(input:checked){border-color:var(--mist);background:rgba(200,204,219,.08)}
.hullband .opt .box{border-color:var(--mist)}
.hullband .opt:has(input:checked) .box{background:var(--mist)}
.hullband .opt small{color:var(--on-hull-muted)}
.hullband .cta{background:var(--on-hull);color:var(--hull);border-color:var(--on-hull)}
.hullband .cta:hover{background:var(--mist);border-color:var(--mist)}
.hullband .aside{border-color:var(--hull-line);background:transparent}
.hullband .done{border-color:var(--mist)}
.hullband input::placeholder,.hullband textarea::placeholder{color:#7c808b}

/* voyages */
.voy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;border:1px solid var(--line-2);background:#fff}
@media (max-width:1000px){.voy{grid-template-columns:1fr}}
.voy-list{border-right:1px solid var(--line-2);display:flex;flex-direction:column}
@media (max-width:1000px){.voy-list{border-right:0;border-bottom:1px solid var(--line-2)}}
.voy-list button{all:unset;cursor:pointer;padding:24px 28px;border-bottom:1px solid var(--line);display:grid;gap:6px;transition:background .3s}
.voy-list button:last-child{border-bottom:0}
.voy-list button:hover{background:var(--paper)}
.voy-list button.on{background:var(--hull);color:var(--on-hull)}
.voy-list button.on .r,.voy-list button.on .k{color:var(--on-hull-muted)}
.voy-list button:focus-visible{outline:1px solid var(--slate);outline-offset:-4px}
.voy-list .n{font-family:var(--display);font-size:23px;line-height:1.15}
.voy-list .r{font-size:12px;color:var(--muted)}
.voy-list .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.arc{background:#e9ecf2;position:relative;min-width:0}
.arc svg{display:block;width:100%;height:auto;transition:opacity .35s}
.arc svg.fading{opacity:.25}
.arc .land{fill:var(--stone);stroke:#bdb7ae}
.arc .isl{fill:var(--stone);stroke:#a9a39a}
.arc .lbl{font-family:var(--body);fill:var(--muted);letter-spacing:.06em}
.arc .lbl.big{font-family:var(--display);fill:#8a8f99;letter-spacing:0}
.arc .vr{fill:none;stroke:var(--slate);stroke-linecap:round;stroke-linejoin:round}
.arc .stopdot{fill:#fff;stroke:var(--slate)}
.arc .stoplbl{font-family:var(--body);font-weight:500;fill:var(--hull);paint-order:stroke;stroke:#e9ecf2}
