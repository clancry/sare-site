/* Layout: a gallery-house of photography. Paper ground, full-bleed images, hairlines, a gunmetal band for Tender Yacht. Colours taken from the hull, the leather and the SARE logo set. Deliberately single-theme. */
:root{
  --paper:#f5f3ef; --paper-2:#ece9e3; --stone:#dad6d0; --mist:#c8ccdb;
  --slate:#54677f; --slate-deep:#3f4f63; --hull:#25252c; --ink:#1d1d1b;
  --muted:#5b616b; --line:rgba(37,37,44,.14); --line-2:rgba(37,37,44,.26);
  --on-hull:#f1efea; --on-hull-muted:#a9adb8; --hull-line:rgba(241,239,234,.16);
  --teak:#9b7653; --ok:#3f7a58; --warn:#9a6a1c;
  --display:"Silk Serif","Didot","Bodoni 72",Georgia,serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:300;margin:0;line-height:1.08;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:40px}
@media (max-width:640px){.wrap{padding-inline:20px}}
.eyebrow{font-family:var(--display);font-size:19px;font-weight:300;letter-spacing:.01em;color:var(--slate);line-height:1.3}
.h2{font-size:clamp(36px,4.6vw,64px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:1px solid var(--slate);outline-offset:4px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* header */
.hdr{position:fixed;left:0;right:0;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background .4s,color .4s,border-color .4s;border-bottom:1px solid transparent;color:var(--ink);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hdr.clear{background:transparent;color:#fff;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hdr:not(.clear){border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:76px}
.brand{display:flex;align-items:center;text-decoration:none;color:inherit}
.brand svg{height:26px;width:auto;fill:currentColor}
.nav{display:flex;gap:26px;margin:0 0 0 auto;list-style:none;padding:0;flex:none}
.nav a{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap;opacity:.82;padding-block:6px;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s}
.nav a:hover,.nav a.on{opacity:1;border-bottom-color:currentColor}
.nav a.req{display:none}
.nav a.req.show{display:inline}
.lang{position:relative}
.lang button{font:inherit;font-size:11px;font-weight:500;letter-spacing:.18em;color:inherit;background:none;border:1px solid currentColor;border-radius:0;padding:7px 10px;cursor:pointer;opacity:.85}
.lang ul{position:absolute;right:0;top:calc(100% + 8px);list-style:none;margin:0;padding:8px 0;background:var(--paper);color:var(--ink);border:1px solid var(--line-2);min-width:190px;box-shadow:0 18px 40px rgba(37,37,44,.14)}
.lang li button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;padding:9px 16px;font-size:13px;letter-spacing:.02em;font-weight:400;opacity:1;text-align:left}
.lang li button:hover,.lang li button[aria-current="true"]{background:var(--paper-2)}
.lang li button span{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.menu-btn{display:none;font:inherit;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;background:none;border:0;color:inherit;cursor:pointer;padding:8px 0}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;padding:16px 28px;border:1px solid var(--hull);background:var(--hull);color:var(--on-hull);text-decoration:none;cursor:pointer;border-radius:0;transition:background .3s,color .3s,border-color .3s}
.cta:hover{background:var(--slate);border-color:var(--slate)}
.cta.line{background:transparent;color:inherit;border-color:currentColor}
.cta.line:hover{background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.cta.light{background:#fff;color:var(--hull);border-color:#fff}
.cta.light:hover{background:transparent;color:#fff}
.cta.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.cta.ghost-light:hover{background:#fff;color:var(--hull)}
.cta.sm{padding:11px 18px;font-size:10px}
.hdr .cta{padding:11px 18px;font-size:10px}
.hdr.clear .cta{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.hdr.compact .nav,.hdr.compact .cta{display:none}
.hdr.compact .lang{margin-left:auto}
.hdr.compact .menu-btn{display:block;margin-left:18px}
@media (max-width:1180px){.nav,.hdr .cta{display:none}.lang{margin-left:auto}.menu-btn{display:block;margin-left:18px}}
.drawer{position:fixed;inset:0;z-index:60;background:var(--hull);color:var(--on-hull);padding:calc(env(safe-area-inset-top,0px) + 24px) 28px 40px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.drawer .top svg{height:24px;fill:currentColor}
.drawer a{font-family:var(--display);font-weight:300;font-size:34px;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--hull-line)}
.drawer .langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.drawer .langs button{font:inherit;font-size:11px;letter-spacing:.18em;background:none;border:1px solid var(--hull-line);color:var(--on-hull);padding:9px 12px;cursor:pointer}
.drawer .langs button[aria-current="true"]{background:var(--on-hull);color:var(--hull)}

/* views */
.view{animation:fade .6s ease both}
@keyframes fade{from{opacity:.0001;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding-block:120px}
@media (max-width:760px){section{padding-block:80px}}

/* hero */
.hdr.dark{background:var(--hull);color:#fff;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hdr.dark .cta{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);margin-top:calc(env(safe-area-inset-top,0px) + 76px);height:min(calc(100vh - 76px),820px);min-height:560px;background:var(--hull);color:#fff;overflow:hidden}
.hero img{grid-column:2;grid-row:1;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
@keyframes slow{from{transform:scale(1.03)}to{transform:scale(1)}}
.hero .inner{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:flex-end;padding:48px clamp(28px,4vw,64px) 72px max(40px,calc((100vw - 1240px)/2 + 40px));max-width:none}
.hero .hero-eb{color:var(--mist)}
.hero .tag{font-family:var(--display);font-weight:300;font-size:clamp(40px,4.4vw,70px);line-height:1.08;margin-top:16px;color:#fff;text-wrap:balance}
.hero .unique{margin-top:22px;font-size:15px;color:var(--mist);max-width:36ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
@media (max-width:1100px){
  .hero{display:block;height:auto;min-height:0}
  .hero img{display:block;height:auto;aspect-ratio:auto}
  .hero .inner{padding:40px 24px 56px}
  .hdr.clear{background:var(--hull)}}
.hdr.clear .nav a,.hdr.clear .lang button,.hdr.clear .cta{text-shadow:0 1px 6px rgba(18,20,26,.35)}
.page-hero{position:relative;margin:0;aspect-ratio:var(--ar,16/9);width:100%;color:#fff;overflow:hidden;background:var(--hull);display:flex;align-items:flex-end}
.page-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,22,28,.38),rgba(20,22,28,0) 35%,rgba(20,22,28,.55))}
.page-hero figcaption{position:relative;z-index:1;width:100%;padding-block:0 56px}
.page-hero.top{align-items:flex-start}

.hook{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.4vw,46px);line-height:1.25;max-width:30ch;color:var(--on-hull)}
.tfacts{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hull-line);border-bottom:1px solid var(--hull-line)}
.tfacts li{padding:20px 18px 20px 0;font-size:14px;color:var(--on-hull);border-right:1px solid var(--hull-line);padding-left:18px}
.tfacts li{transition:background .35s,color .35s,box-shadow .35s;cursor:default}
.tfacts li:first-child{padding-left:18px}.tfacts li:last-child{border-right:0;color:var(--mist)}
.tfacts li:hover{background:var(--slate);color:#fff;box-shadow:0 0 28px rgba(200,204,219,.28)}
@media (max-width:900px){.tfacts{grid-template-columns:1fr 1fr}.tfacts li{border-bottom:1px solid var(--hull-line)}}
.handler{display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:32px;align-items:center;padding:32px;border:1px solid var(--mist)}
.handler .eyebrow{font-size:28px;color:var(--on-hull)}
.handler p{color:var(--on-hull-muted);margin-top:8px;max-width:60ch}
.handler .hc{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.handler .hcs{display:flex;gap:32px;flex-wrap:wrap}
.handler .hc b{font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
.handler .hc span{font-family:var(--display);font-size:24px;color:var(--on-hull)}
@media (max-width:760px){.handler{grid-template-columns:1fr}}

/* charter */
.formulas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
@media (max-width:1000px){.formulas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.formulas{grid-template-columns:1fr}}
.formula{padding:34px 28px 34px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.formula .dur{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate)}
.formula h3{font-size:32px}
.formula p{color:var(--muted);font-size:15px}
.formula .price{margin-top:auto;padding-top:12px;font-family:var(--display);font-size:30px;color:var(--hull)}
.formula .routes{list-style:none;margin:auto 0 0;padding:12px 0 0;display:grid;gap:6px}
.formula .routes li{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.formula .routes b{font-weight:500;white-space:nowrap}
.formula .price small{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.incl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;margin-top:80px}
@media (max-width:900px){.incl{grid-template-columns:1fr;gap:40px}}
.incl h3{font-size:30px;margin-bottom:18px}
.ticks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.ticks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ticks small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ticks .p{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);text-align:right;white-space:nowrap}

.chart-shell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:1px solid var(--line-2);background:#fff}
@media (max-width:1000px){.chart-shell{grid-template-columns:1fr}}
.chart{position:relative;background:#e9ecf2;min-width:0;border-right:1px solid var(--line-2)}
@media (max-width:1000px){.chart{border-right:0;border-bottom:1px solid var(--line-2)}}
.chart svg{display:block;width:100%;height:100%;min-height:340px}
.grat{stroke:rgba(84,103,127,.16)}
.grat-t{font-family:var(--mono);fill:#7b8798}
.chart .grat-t{font-size:12px}
.isle{fill:var(--stone);stroke:#b9b3aa;stroke-width:1.2;cursor:pointer;transition:fill .3s}
.isle:hover,.isle.on{fill:var(--mist)}
.isle-label{font-family:var(--display);font-weight:300;font-size:27px;fill:var(--hull);pointer-events:none}
.isle-label.s{font-size:18px}
.pin{cursor:pointer}
.pin .dot{fill:#fff;stroke:var(--slate);stroke-width:2}
.pin.on .dot,.pin:hover .dot{fill:var(--slate)}
.pin.base .dot{fill:var(--hull);stroke:var(--hull)}
.pin text{font-family:var(--body);font-size:12.5px;font-weight:500;fill:var(--hull);paint-order:stroke;stroke:#e9ecf2;stroke-width:4px;letter-spacing:.02em}
.route{fill:none;stroke:var(--slate);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round}
.route.pos{stroke-dasharray:6 6;stroke-width:1.4;opacity:.7}
.border{stroke:#b9b3aa;stroke-dasharray:3 4}
.rose line{stroke:#8a95a6}.rose text{font-family:var(--display);fill:var(--slate)}
.chart .rose text{font-size:16px}
.scale line{stroke:var(--hull)}.scale text{font-family:var(--body);font-size:11px;fill:var(--muted);letter-spacing:.08em}
.chart-note{position:absolute;left:14px;bottom:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7b8798}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;border-radius:0}
.chip:hover{color:var(--ink);border-color:var(--hull)}
.chip.on{background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.fiche{padding:36px 32px;min-width:0;display:flex;flex-direction:column;gap:18px}
.fiche h3{font-size:44px}
.fiche .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fiche .blurb{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);padding:12px 12px 12px 0;margin-right:14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hull)}
.items{list-style:none;margin:0;padding:0}
.items li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.items b{font-weight:500;font-size:15px}
.items span{color:var(--muted);font-size:14px}
.anchor-note{font-size:13px;color:var(--muted);border-left:1px solid var(--slate);padding-left:14px}
.fiche .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:8px}
.plan{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:24px 28px;background:#fff;border:1px solid var(--line-2)}
@media (max-width:760px){.plan{grid-template-columns:1fr}}
.stops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.stop{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 6px 6px 12px;border:1px solid var(--slate)}
.stop.base{border-color:var(--hull);background:var(--hull);color:var(--on-hull);padding-right:12px}
.stop button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 6px}
.stats{display:flex;gap:32px;flex-wrap:wrap}
.stats div{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);max-width:14ch}
.stats b{display:block;font-family:var(--display);font-weight:300;font-size:34px;letter-spacing:0;text-transform:none;color:var(--hull);line-height:1.1}

/* tender (gunmetal band) */
.hullband{background:var(--hull);color:var(--on-hull)}
.hullband .eyebrow{color:var(--mist)}
.hullband .muted,.hullband .lead{color:var(--on-hull-muted)}
.hullband h2,.hullband h3{color:var(--on-hull)}
.quote{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.4vw,46px);line-height:1.25;max-width:30ch}
.season{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hull-line);border-bottom:1px solid var(--hull-line)}
.season button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:24px 18px 26px;border-right:1px solid var(--hull-line);transition:background .3s}
.season button:last-child{border-right:0}
.season button:hover{background:rgba(200,204,219,.07)}
.season button:focus-visible{outline:1px solid var(--mist);outline-offset:-4px}
.season .m{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-hull-muted)}
.season .t{font-family:var(--display);font-size:22px;line-height:1.25;color:var(--on-hull)}
.season .peak .m::after{content:" ★";color:var(--mist)}
.season button.on{background:var(--slate)}
.season button.on .m{color:var(--on-hull)}
@media (max-width:900px){.season{grid-template-columns:1fr 1fr}.season button{border-bottom:1px solid var(--hull-line)}}
.season-detail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;padding:28px 0 0}
.season-detail p{font-family:var(--display);font-size:24px;line-height:1.4;color:var(--on-hull);max-width:46ch}
@media (max-width:760px){.season-detail{grid-template-columns:1fr}}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 48px}
@media (max-width:900px){.missions{grid-template-columns:1fr}}
.mission{padding:30px 0 34px;border-top:1px solid var(--hull-line)}
.mission h3{font-size:27px;margin-bottom:12px}
.mission p{color:var(--on-hull-muted);font-size:15px}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.why{grid-template-columns:1fr}}
.why b{display:block;font-family:var(--display);font-weight:300;font-size:22px;margin-bottom:8px}
.thow{gap:0}
.thow div{padding:28px 24px 30px 0;border-top:1px solid var(--hull-line)}
.thow div.key{border-top-color:var(--mist)}
.thow b{font-size:26px}
.aside .ln.incl span:last-child{color:var(--mist)}
.why p{font-size:14px;color:var(--on-hull-muted)}
.formats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.formats{grid-template-columns:1fr 1fr}}
.formats div{padding:24px;border:1px solid var(--hull-line)}
.formats b{display:block;font-family:var(--display);font-weight:300;font-size:24px}
.formats span{font-size:13px;color:var(--on-hull-muted)}
.hullband input,.hullband select,.hullband textarea{color:var(--on-hull);border-bottom-color:var(--hull-line)}
.hullband select option{background:var(--hull);color:var(--on-hull)}
.hullband label.f,.hullband legend{color:var(--on-hull-muted)}
.hullband legend{color:var(--mist)}
.hullband .opt{border-color:var(--hull-line)}
.hullband .opt:has(input:checked){border-color:var(--mist);background:rgba(200,204,219,.08)}
.hullband .opt .box{border-color:var(--mist)}
.hullband .opt:has(input:checked) .box{background:var(--mist)}
.hullband .opt small{color:var(--on-hull-muted)}
.hullband .cta{background:var(--on-hull);color:var(--hull);border-color:var(--on-hull)}
.hullband .cta:hover{background:var(--mist);border-color:var(--mist)}
.hullband .aside{border-color:var(--hull-line);background:transparent}
.hullband .done{border-color:var(--mist)}
.hullband input::placeholder,.hullband textarea::placeholder{color:#7c808b}

/* voyages */
.voy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;border:1px solid var(--line-2);background:#fff}
@media (max-width:1000px){.voy{grid-template-columns:1fr}}
.voy-list{border-right:1px solid var(--line-2);display:flex;flex-direction:column}
@media (max-width:1000px){.voy-list{border-right:0;border-bottom:1px solid var(--line-2)}}
.voy-list button{all:unset;cursor:pointer;padding:24px 28px;border-bottom:1px solid var(--line);display:grid;gap:6px;transition:background .3s}
.voy-list button:last-child{border-bottom:0}
.voy-list button:hover{background:var(--paper)}
.voy-list button.on{background:var(--hull);color:var(--on-hull)}
.voy-list button.on .r,.voy-list button.on .k{color:var(--on-hull-muted)}
.voy-list button:focus-visible{outline:1px solid var(--slate);outline-offset:-4px}
.voy-list .n{font-family:var(--display);font-size:28px;line-height:1.15}
.voy-list .r{font-size:12px;color:var(--muted)}
.voy-list .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.arc{background:#e9ecf2;position:relative;min-width:0}
.arc svg{display:block;width:100%;height:auto;transition:opacity .35s}
.arc svg.fading{opacity:.25}
.arc .land{fill:var(--stone);stroke:#bdb7ae}
.arc .isl{fill:var(--stone);stroke:#a9a39a}
.arc .lbl{font-family:var(--body);fill:var(--muted);letter-spacing:.06em}
.arc .lbl.big{font-family:var(--display);fill:#8a8f99;letter-spacing:0}
.arc .vr{fill:none;stroke:var(--slate);stroke-linecap:round;stroke-linejoin:round}
.arc .stopdot{fill:#fff;stroke:var(--slate)}
.arc .stoplbl{font-family:var(--body);font-weight:500;fill:var(--hull);paint-order:stroke;stroke:#e9ecf2}
.arc .home circle{fill:var(--hull)}
.voy-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:72px;margin-top:80px}
@media (max-width:900px){.voy-detail{grid-template-columns:1fr;gap:32px}}
.voy-detail h3{font-size:clamp(38px,4.6vw,62px)}
.voy-detail .teaser{font-family:var(--display);font-size:24px;line-height:1.35;color:var(--slate);margin-top:20px}
.voy-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2);margin-top:32px}
.voy-facts div{padding:16px 12px 16px 0;border-bottom:1px solid var(--line)}
.voy-facts small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.voy-facts b{font-family:var(--display);font-weight:300;font-size:24px}
.days{list-style:none;margin:0;padding:0;counter-reset:d}
.days li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:24px;padding:26px 0;border-top:1px solid var(--line)}
.days li:last-child{border-bottom:1px solid var(--line)}
.days .dn{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);padding-top:8px}
.days h4{font-size:26px;margin-bottom:8px}
.days p{color:var(--muted)}
@media (max-width:560px){.days li{grid-template-columns:1fr;gap:6px}}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
@media (max-width:900px){.how{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.how b{display:block;font-family:var(--display);font-weight:300;font-size:24px;margin-bottom:10px;line-height:1.2}
.how p{font-size:14px;color:var(--muted)}
.dream{font-size:12px;color:var(--muted);margin-top:18px;font-style:italic}

/* crew */
.captain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:start}
@media (max-width:900px){.captain{grid-template-columns:1fr;gap:36px}}
.captain .ph{aspect-ratio:3/2;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
.captain .ph img{width:100%;height:100%;object-fit:cover}
.creds{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line-2)}
.creds li{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:14px;align-items:baseline}
.creds li::before{content:"";flex:none;width:6px;height:6px;background:var(--slate);transform:rotate(45deg) translateY(-2px)}
.standards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 56px}
@media (max-width:900px){.standards{grid-template-columns:1fr}}
.standards div{padding:30px 0;border-top:1px solid var(--line-2)}
.standards b{display:block;font-family:var(--display);font-weight:300;font-size:26px;margin-bottom:10px}
.standards p{color:var(--muted);font-size:15px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line-2)}
@media (max-width:900px){.timeline{grid-template-columns:1fr 1fr}}
.timeline li{padding:22px 18px 22px 0;border-bottom:1px solid var(--line)}
.timeline .tm{font-family:var(--display);font-size:30px;color:var(--hull)}
.timeline p{font-size:13px;color:var(--muted);margin-top:6px}

/* clearance */
.juris{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
@media (max-width:1000px){.juris{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.juris{grid-template-columns:1fr}}
.jc{padding:30px 28px 30px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;opacity:.5;transition:opacity .4s}
.jc.active{opacity:1}
.jc .fl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.jc h3{font-size:28px}
.jc ul{margin:0;padding-left:16px;color:var(--muted);font-size:14px;display:grid;gap:6px}
.jc .fee{margin-top:auto;font-size:12px;border-top:1px solid var(--line);padding-top:12px}
.checklist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
@media (max-width:900px){.checklist{grid-template-columns:1fr}}
.checklist b{display:block;font-family:var(--display);font-weight:300;font-size:26px;margin-bottom:10px}
.checklist p{color:var(--muted);font-size:15px}
.legal{font-size:12px;color:var(--muted);max-width:80ch}
.voy-note{padding:36px;background:var(--paper-2);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px}
@media (max-width:760px){.voy-note{grid-template-columns:1fr;gap:12px}}
.voy-note h3{font-size:30px}
.voy-note p{color:var(--muted)}

/* forms */
.form-shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:64px;align-items:start}
@media (max-width:1000px){.form-shell{grid-template-columns:1fr;gap:40px}}
form{display:grid;gap:36px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:18px;min-width:0}
legend{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--slate);margin-bottom:16px;padding:0}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.row,.row.three{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:10px 0;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 10px) 52%,calc(100% - 5px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--slate)}
textarea{min-height:96px;resize:vertical}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line-2);cursor:pointer;font-size:15px;line-height:1.4;transition:border-color .2s,background .2s}
.opt input{position:absolute;opacity:0;pointer-events:none;width:1px}
.opt .box{flex:none;width:10px;height:10px;border:1px solid var(--slate);transform:rotate(45deg);margin-top:5px}
.opt:has(input:checked){border-color:var(--hull);background:#fff}
.opt:has(input:checked) .box{background:var(--slate)}
.opt:has(input:focus-visible){outline:1px solid var(--slate);outline-offset:3px}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);border:1px solid var(--line-2);background:#fff;padding:32px;display:grid;gap:14px}
.aside h3{font-size:30px}
.ln{display:flex;justify-content:space-between;gap:16px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ln span:last-child{text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total b{font-family:var(--display);font-weight:300;font-size:44px;color:var(--hull)}
.badge{display:inline-block;font-size:10px;letter-spacing:.18em;padding:5px 10px;border:1px solid var(--teak);color:var(--teak)}
.err{color:#9a3b1c;font-size:14px;margin-left:12px}
.done{border:1px solid var(--slate);padding:36px;display:grid;gap:14px}
.done h3{font-size:34px}
.done pre{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;margin:0;max-height:280px;overflow:auto;border-top:1px solid var(--line);padding-top:14px;opacity:.85}
.hullband .done pre{border-top-color:var(--hull-line)}

/* owner */
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
@media (max-width:640px){.req{grid-template-columns:1fr}}
.req .t{font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line-2);white-space:nowrap}
.req .t.tender{background:var(--hull);color:var(--on-hull);border-color:var(--hull)}
.req .t.voyage{border-color:var(--slate);color:var(--slate)}
.req h4{font-family:var(--body);font-weight:500;font-size:16px}
.req p{color:var(--muted);font-size:14px}
.status{font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--warn);color:var(--warn);background:none;cursor:pointer}
.status.ok{border-color:var(--ok);color:var(--ok)}

footer{background:var(--hull);color:var(--on-hull);padding-block:88px 56px}
footer .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:48px}
@media (max-width:900px){footer .wrap{grid-template-columns:1fr}}
footer .logo{width:220px;fill:var(--on-hull)}
footer .tagline{font-family:var(--display);font-size:22px;margin-top:22px;color:var(--mist)}
footer h4{font-family:var(--body);font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--on-hull-muted);margin-bottom:14px}
footer p,footer a{font-size:14px;color:var(--on-hull)}
footer .copyable{user-select:all}
footer nav{display:grid;gap:6px}
footer nav a{text-decoration:none;opacity:.85}
footer nav a:hover{opacity:1}
footer .small{grid-column:1/-1;border-top:1px solid var(--hull-line);padding-top:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-hull-muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
</style>

xed lunch on the sand."], ["Coco Beach, Orient Bay", "Beach club with loungers and lunch."]], "sights": [["Fort Louis, Marigot", "Views over Marigot Bay and Anguilla."], ["Marigot market", "Spices, crafts and island fruit, best in the morning."], ["Sur la trace des Arawaks museum", "Pre-Columbian and colonial history."]], "activities": [["Snorkelling at Creole Rock", "Turtles and schools of fish off Grand Case."], ["Loterie Farm", "Zip lines and a pool in the Pic Paradis forest."], ["Paddle and kite", "Orient Bay and Cul-de-Sac."]]}, "sxm": {"name": "Sint Maarten", "side": "Dutch side · home port", "blurb": "The international airport, Simpson Bay lagoon and its superyacht marinas. The ideal arrival point for your guests.", "anchor": "Anchor off Simpson Bay, or inside the lagoon after the bridge opening.", "beaches": [["Maho Beach", "Airliners pass just above the swimmers."], ["Mullet Bay", "Calm turquoise water, a local favourite."], ["Cupecoy", "Small coves beneath limestone cliffs."], ["Simpson Bay Beach", "A long, quiet beach facing the anchorage."]], "dining": [["Sunset Bar & Grill, Maho", "Lunch while watching the landings."], ["Karakter, Simpson Bay", "Beach bar on the sand, easy-going."], ["Front Street, Philipsburg", "Restaurants and terraces along the boardwalk."]], "sights": [["Sint Maarten Museum", "The island's history, in Philipsburg."], ["Fort Amsterdam", "Fort ruins above Great Bay."], ["Guavaberry Emporium", "The island's traditional liqueur."]], "activities": [["Rainforest Adventures", "The Flying Dutchman zip line on Sentry Hill."], ["Duty-free shopping", "Jewellery and watches in Philipsburg."], ["Simpson Bay marinas", "Where the superyachts gather."]]}, "pinel": {"name": "Pinel Island", "side": "Nature reserve", "blurb": "A white-sand islet minutes from Cul-de-Sac. Shallow water and lunch beneath the palms, perfect for a half day.", "anchor": "Nature reserve moorings on the western side, sheltered water.", "beaches": [["Main beach", "Fine sand, shallow water, ideal for children."], ["North shore", "Wilder, with views over Orient Bay."]], "dining": [["Karibuni", "Grilled lobster and fish with your feet in the sand."], ["Yellow Beach", "Beach cuisine and loungers."]], "sights": [["Islet trail", "A short loop with views to Tintamarre."]], "activities": [["Underwater trail", "A marked snorkelling route."], ["Kayak and paddle", "Inside the sheltered lagoon."]]}, "tintamarre": {"name": "Tintamarre", "side": "Nature reserve", "blurb": "A flat, uninhabited island, the wildest in the area. A deserted beach, turtles and wrecks to snorkel.", "anchor": "Moorings off Baie Blanche. No services ashore: lunch on board or at Pinel.", "beaches": [["Baie Blanche", "A long white beach, often deserted."]], "dining": [["On board", "No restaurant on the island. Bring a picnic or continue to Pinel."]], "sights": [["Old airstrip", "A relic of the days when the island had its own airline."]], "activities": [["Sea turtles", "Often grazing on the bay's seagrass."], ["Tugboat wreck", "Easy, shallow snorkelling."]]}, "stbarth": {"name": "Saint-Barthélemy", "side": "Gustavia", "blurb": "The flagship destination. Arrive at Gustavia quay, lunch at Shell Beach or Saint-Jean, swim at Colombier, reachable only by sea or on foot.", "anchor": "Clearance mandatory in Gustavia. Colombier on marine reserve moorings.", "beaches": [["Anse du Colombier", "Reached by sea or a trail, turtles on the seagrass."], ["Shell Beach", "Steps from Gustavia, a beach of tiny shells."], ["Saline", "Wild beach and dunes, no buildings."], ["Gouverneur", "A cove framed by hills, superb at sunset."]], "dining": [["Shellona, Shell Beach", "Mediterranean cuisine on the sand."], ["Nikki Beach, Saint-Jean", "The island's iconic festive lunch."], ["Eden Rock, Saint-Jean", "The hotel's table on its famous rock."], ["Bonito, Gustavia", "Ceviches and harbour views."]], "sights": [["Wall House Museum", "The island's Swedish past."], ["Fort Gustav lighthouse", "Panorama over the harbour and islets."], ["Corossol", "Fishing village and shell museum."], ["Gustavia", "Rue de la République and its fine boutiques."]], "activities": [["Snorkelling at Colombier", "Turtles and rays in the bay."], ["Shopping in Gustavia", "Jewellery, fashion, fine groceries."], ["Diving", "Pain de Sucre and Les Gros Islets."], ["Kitesurfing", "Grand Cul-de-Sac lagoon."]]}, "fourchue": {"name": "Île Fourchue", "side": "Marine reserve", "blurb": "A volcanic horseshoe between Saint-Martin and Saint-Barth. A sheltered bay, crystal water, not a single building.", "anchor": "Marine reserve moorings in the bay. A perfect stop on the way to Gustavia.", "beaches": [["The bay", "A small beach of pebbles and sand at the head of the bay."]], "dining": [["On board", "No services on the island. A swim stop before or after Gustavia."]], "sights": [["Lunar landscape", "Bare hills and cacti, a trail to the ridges."]], "activities": [["Snorkelling", "Coral and tropical fish along the rocks."], ["Swimming", "Deep, calm water at the mooring."]]}, "anguilla": {"name": "Anguilla", "side": "Road Bay · Sandy Island · Prickly Pear", "blurb": "The whitest beaches in the region, twenty minutes from Saint-Martin. Sandy Island and Prickly Pear follow clearance at Road Bay.", "anchor": "Clearance at Road Bay required before Sandy Island and Prickly Pear.", "beaches": [["Sandy Island", "A sandbar and a few palms facing Road Bay."], ["Prickly Pear Cays", "Remote cays with crystal water."], ["Shoal Bay East", "One of the finest beaches in the Caribbean."], ["Meads Bay", "Powder sand in front of the great hotels."]], "dining": [["Sandy Island beach bar", "Grilled lobster on the sandbar."], ["Blanchards, Meads Bay", "The island's grand table."], ["Elvis' Beach Bar, Sandy Ground", "Rum punch at a boat-bar."], ["The Dune Preserve", "The driftwood bar of Rendezvous Bay."]], "sights": [["Heritage Collection Museum", "Anguilla's history and culture."], ["Sandy Ground", "Road Bay village and salt pond."], ["Wallblake House", "The island's oldest plantation house."]], "activities": [["Snorkelling at Prickly Pear", "Shallow reefs around the cays."], ["Wreck diving", "Road Bay marine park."], ["Shoal Bay walk", "Three kilometres of white sand."]]}}, "tender": {"eyebrow": "Tender Yacht · High Season", "title": "Your yacht's tender, around the clock", "intro": "For the length of your charter, SARE and its captain become your yacht's tender. Day and night, every journey by sea is ours: guest outings, runs to shore, transfers to the airport or another island, provisioning and errands.", "quote": "One boat, one captain, at your yacht's side twenty-four hours a day, seven days a week.", "seasonTitle": "The season at a glance", "season": [["Nov.", "Yachts arrive and position"], ["Dec. 1–20", "The season builds"], ["Dec. 20 – Jan. 5", "Christmas and New Year in Gustavia"], ["Jan. – Mar.", "Peak season and regattas"], ["April", "Les Voiles de Saint-Barth and the season's end"]], "missionsTitle": "Every journey by sea", "missions": [["Outings & excursions", "Lunch in Anguilla, a swim at Colombier, snorkelling at Tintamarre. The yacht keeps its anchorage, your guests keep their rhythm."], ["Runs to shore", "Yacht to Gustavia quay, beach clubs, restaurants and villas, from breakfast to the last ride home."], ["Airport transfers", "Guests met on arrival at Princess Juliana (SXM), Saint-Barth (SBH) or Anguilla (AXA) airport, a car to the nearest dock with their luggage, then the sea to the yacht, their villa or the next island. The fastest way from a long-haul flight to the yacht."], ["Provisioning & errands", "Groceries, flowers, wine, urgent parts: whatever the yacht needs, fetched from Saint-Martin or Saint-Barth."], ["Crew logistics", "Crew changes, laundry, shopping runs and appointments ashore."], ["Night and day", "On call by VHF or WhatsApp at any hour, waiting close to the yacht."]], "whyTitle": "Why yacht captains choose SARE", "why": [["Punctual to the minute", "Every run logged and confirmed the evening before."], ["Platform-trained", "Fendered approaches to swim platforms, guests stepped across hand in hand."], ["Dry at speed", "A deep-V offshore hull keeps guests and luggage dry, even in the channel."], ["Discreet", "No photos of guests, ever. NDAs signed on request."]], "formatsTitle": "Engagement", "formats": [["By the day", "24 hours at your disposal"], ["By the week", "Seven days at your yacht's side"], ["Festive season", "Dec. 20 – Jan. 5"], ["Personalized experience", "Event, regatta or a longer stay"]], "asideTitle": "Quoted within 12 hours", "asideText": "The rate depends on the length of the rental and your yacht's cruising area. Our concierge replies with a firm proposal.", "asideNote": "Festive season dates go from September. Early booking guarantees availability.", "howTitle": "How it works", "how": [["At your disposal, 24/7", "The captain lives to your yacht's rhythm, from the first coffee run to the last shuttle home after dinner."], ["Part of your yacht", "For the duration of the rental, SARE operates as your yacht's tender, under your yacht's insurance and alongside its crew."], ["Captain all-inclusive", "One rate covers the boat and a dedicated professional captain. Nothing else to book and nothing to add."], ["Running costs apart", "Fuel and all other charges, such as port dues and clearance, are not included in the rate and are settled separately."]], "terms": [["Boat & dedicated captain, 24/7", "included"], ["Fuel", "not included"], ["Port dues, clearance & other charges", "not included"], ["Insurance", "under your yacht's policy"]], "seasonHint": "Tap a period to see what it holds", "seasonCta": "Request this period", "seasonDetails": ["The superyachts arrive from their Atlantic crossing and take their places in Simpson Bay and Gustavia. The calmest weeks to secure a tender for the whole season.", "Owners and their first guests come aboard. Booking now secures your boat and crew before the festive rush.", "The busiest fortnight of the year: Gustavia's harbour is full and fireworks light the sky on New Year's Eve. Our tender is usually committed from September.", "Steady trade winds, clear skies and the regatta season, from the Heineken Regatta in early March to the St. Barths Bucket later in the month.", "Les Voiles de Saint-Barth and the last long days of the season, before the yachts head north."], "hook": "Many yachts cross the Atlantic without their tender: the cost and the logistics rarely make sense. Arrive in the islands and find yours waiting.", "facts": ["Up to 14 guests", "Removable cover against sea spray", "Spacious cabin for luggage", "35-knot cruise, dry deep-V ride", "The only Nor-Tech 450 Sport in the islands"], "handler": ["Meet your handlers", "One contact from the first message to the last ride home. Cédric and Rebecca answer captains, chief stewards, brokers and guests directly.", "WhatsApp {name}"]}, "voyages": {"eyebrow": "Caribbean Voyages", "title": "From Saint-Barth to the Virgin Islands", "intro": "Island-hopping journeys along the Caribbean arc. You sail by day at thirty-five knots and sleep ashore in the finest villas and hotels; we handle the route, fuel stops, clearances and every reservation.", "howTitle": "How a voyage works", "how": [["Sail by day, sleep ashore", "SARE has one cabin. Your nights are spent in hand-picked villas and hotels, booked by us."], ["A route read every morning", "Legs are planned around the weather, with fuel stops and alternative harbours prepared in advance."], ["Clearance handled", "Every new island means formalities. Your captain files them ahead so you simply step ashore."], ["Positioning", "For the most distant voyages, the boat is positioned beforehand. The cost is shown in your proposal."]], "mapTitle": "The arc", "dreamNote": "Experiences imagined to inspire; each voyage is tailored to the dates, weather and wishes of its guests.", "list": [{"id": "north", "name": "The Northern Isles", "region": "Saint-Barth · Saba · Statia · Nevis", "nights": "2", "nm": "≈ 120", "season": "Dec. – May", "teaser": "Three days, four flags, and the most secret islands of the Leewards.", "days": [["Gustavia by noon", "Breakfast on Simpson Bay, lunch on Shell Beach, an afternoon swim with the turtles of Colombier. Dinner in Gustavia, a suite on the hill above the harbour."], ["Saba, the unspoiled queen", "A green volcano rising from the sea. Drop into the marine park's pinnacles, then lunch in Windwardside. In the afternoon, Statia's Oranje Bay and the crater of The Quill. Night at a plantation inn on Nevis."], ["Brimstone Hill and home", "Morning at the great fortress of St Kitts, a last swim at Cockleshell Bay with the Narrows stretching to Nevis, then a long golden crossing back to Saint-Martin."]]}, {"id": "virgin", "name": "The Virgin Islands Run", "region": "Anegada · Virgin Gorda · Jost Van Dyke", "nights": "3", "nm": "≈ 200", "season": "Dec. – June", "teaser": "The Anegada Passage, where a deep-V hull shows what it was built for.", "days": [["Across the Anegada Passage", "Eighty miles of open Atlantic swell, crossed at speed and in comfort. Land on Anegada's endless flats for lobster grilled in half-barrels on Loblolly Bay."], ["The Baths", "Morning among the granite boulders and turquoise pools of Virgin Gorda, before the day-trippers arrive. Lunch in North Sound, sunset over the reefs."], ["Jost Van Dyke", "White Bay at its most beautiful: swim ashore to the bar that invented the Painkiller, then lose an afternoon on Sandy Spit, a sand islet with a single palm."], ["Norman Island and back", "Snorkel the caves of Norman Island, said to have hidden pirate treasure, then fly home across the Passage."]]}, {"id": "antigua", "name": "Antigua & Barbuda", "region": "English Harbour · Barbuda · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "Dec. – May", "teaser": "Nelson's harbour, a pink beach that runs for seventeen miles, and Sunday at Shirley Heights.", "days": [["English Harbour", "Arrive in the Georgian dockyard where Nelson's fleet was careened. Superyachts alongside, dinner in a stone boathouse by candlelight."], ["Barbuda's pink sands", "A beach of pink-tinted sand without a footprint, and the frigate birds of Codrington Lagoon puffing out their scarlet throats."], ["Shirley Heights", "A slow morning in Carlisle Bay, then sunset above English Harbour as the steel band plays and the whole island seems to arrive."], ["Return by Montserrat", "Pass beneath the smoking volcano of Montserrat and its buried capital, a sight you will not forget, then home."]]}, {"id": "south", "name": "French Antilles to the Grenadines", "region": "Guadeloupe · Dominica · Martinique · Saint Lucia · Grenadines", "nights": "8", "nm": "≈ 480", "season": "Jan. – May", "teaser": "Eight nights down the volcanic spine of the Caribbean, to the turtles of the Tobago Cays.", "days": [["Les Saintes", "Guadeloupe's tiny archipelago, one of the world's most beautiful bays. Bicycles, red roofs and the Fort Napoléon at sunset."], ["Dominica, the nature island", "Rivers through the rainforest, hot springs and, offshore, sperm whales that live here all year."], ["Martinique", "The Anses d'Arlet, Diamond Rock rising from the sea, and an evening at a rum distillery among the sugar cane."], ["The Pitons", "Anchor between the twin peaks of Saint Lucia, a UNESCO site. Dinner looking up at the Gros Piton under the stars."], ["Bequia and Mustique", "The boatbuilders of Bequia, then lunch at a legendary bar on Mustique, the island of discreet celebrities."], ["Tobago Cays", "Swim with green turtles in the most perfect lagoon of the Grenadines, then a lobster barbecue on the beach of Petit Bateau."]]}, {"id": "bahamas", "name": "The Exumas, Bahamas", "region": "Nassau · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 on site", "season": "Mar. – June", "teaser": "Three hundred and sixty-five cays, sandbars that appear at low tide, and water in colours you did not know existed.", "days": [["Into the Exumas", "From Nassau to Allan's Cay and its prehistoric iguanas. The water turns from sapphire to the palest jade as the banks rise beneath the hull."], ["Thunderball Grotto", "Swim into the domed cave where a James Bond film was shot, light falling through the roof onto the fish."], ["The swimming pigs", "The famous pigs of Big Major Cay paddle out to greet you, then lunch at the Staniel Cay Yacht Club."], ["The sandbars", "A private sandbar that exists only at low tide: a table set in the middle of the sea, just for you."], ["Harbour Island", "Pink sand, pastel cottages and golf carts. Dinner at one of the most elegant small hotels in the Caribbean."]]}], "formTitle": "Design your voyage", "formIntro": "Tell us the islands that make you dream, your dates and your party. We reply with a route, a schedule of nights ashore and a complete proposal.", "further": {"title": "Further afield, on request", "intro": "With the boat positioned beforehand, we also design escapes to the Grenadines, to Martinique and Saint Lucia, and to the Exumas.", "cta": "Ask about a personalized voyage"}}, "crew": {"eyebrow": "Captains & Crew", "title": "A fleet of professionals, one standard", "intro": "SARE is a concierge house. Behind every outing stands a pool of licensed captains, hostesses and bartenders, chosen for your day, your language and your occasion, and held to one standard of safety and discretion.", "captainTitle": "Our captains", "captainText": "Commercially licensed and trained in safety and first aid, our captains run these waters every day of the season. For each booking we assign the crew best suited to it: the route, the languages spoken aboard, the occasion. Cédric and Rebecca remain your single point of contact from the first message to the last ride home.", "credentials": ["Commercial skipper licences", "STCW basic safety training", "First aid certified", "Marine VHF radio operators", "Crews matched to your language"], "standardsTitle": "Our standards", "standards": [["Safety briefing", "Life jackets, emergency procedures and swimming rules explained at boarding, in your language."], ["Weather routing", "Forecast and sea state checked at dawn. If the channel is too rough, we propose a calmer plan before you leave home."], ["Impeccable maintenance", "Engine hours logged, a service before every season, a boat cleaned and prepared before each outing."], ["Insured and compliant", "Commercial charter insurance, licensed vessel and safety equipment inspected."], ["Absolute discretion", "No photos of guests on social media. Confidentiality agreements signed on request."], ["Hospitality", "Chilled towels, cold drinks, reservations confirmed: the details that make a day effortless."]], "dayTitle": "A day with SARE", "day": [["08:00", "Weather check and a call to confirm your plan"], ["09:30", "Welcome aboard, safety briefing, chilled towels"], ["10:15", "Crossing and first swim stop"], ["13:00", "Lunch ashore, table reserved by your captain"], ["15:30", "Snorkelling, paddle or a siesta under the canopy"], ["17:30", "Return in the golden hour"]], "testimonialsTitle": "In our guests' words"}, "clearance": {"eyebrow": "Clearance & local fees", "title": "Several nations in a single day", "intro": "Saint-Martin, Sint Maarten, Saint-Barthélemy and Anguilla belong to three different countries. Every border crossing goes through customs. Your captain handles it; here is what concerns you. The territories on your plan are highlighted.", "juris": {"fr": {"flag": "FR · Collectivity of Saint-Martin", "name": "Saint-Martin", "ports": "Marigot, Anse Marcel", "items": ["Departures and returns within the French side need no formalities.", "Declarations are filed online or at a kiosk before changing territory.", "Nature reserve at Pinel and Tintamarre: moorings only, no anchoring on seagrass."], "fee": "Low administrative fees"}, "nl": {"flag": "NL · Sint Maarten", "name": "Sint Maarten", "ports": "Simpson ystal water and shallow reefs to snorkel."], ["Shoal Bay East", "Two miles of powder sand, often called one of the world's finest beaches."], ["The Dune Preserve", "The driftwood bar of reggae legend Bankie Banx on Rendezvous Bay."], ["Boat racing", "The national sport: locally built sloops racing in summer regattas."]]}, "saba": {"name": "Saba", "country": "Caribbean Netherlands", "tagline": "A green volcano rising straight from the sea, the unspoiled queen of the Caribbean.", "must": [["Mount Scenery", "Climb through cloud forest to the highest point of the Kingdom of the Netherlands."], ["Saba Marine Park", "Dive the pinnacles, seamounts covered in coral and pelagic life."], ["The Road", "A single road built by hand over decades, winding from the sea to the villages."], ["Windwardside", "White cottages with green shutters and red roofs, lunch with a view."], ["Saba lace", "A delicate needlework tradition kept alive by the island's women."]]}, "statia": {"name": "Sint Eustatius · Statia", "country": "Caribbean Netherlands", "tagline": "A quiet island with a great past and a perfect volcanic crater.", "must": [["The Quill", "Hike into the crater of a dormant volcano, filled with rainforest."], ["Fort Oranje", "Where the first salute to the American flag was fired in 1776."], ["Lower Town ruins", "Dive the submerged warehouses of the once-busiest port in the Caribbean."], ["Oranje Bay", "A dark-sand bay beneath the cliffs of Oranjestad."], ["Statia Museum", "The island's history in an eighteenth-century merchant's house."]]}, "stkitts": {"name": "St Kitts & Nevis", "country": "Federation of St Kitts and Nevis", "tagline": "Two volcanic islands, a great fortress and the old plantation inns of Nevis.", "must": [["Brimstone Hill Fortress", "A UNESCO World Heritage fortress with views across to Saba and Statia."], ["The Scenic Railway", "The old sugar train circling St Kitts, with a drink on the open deck."], ["Cockleshell Bay", "A calm beach facing The Narrows and the cone of Nevis Peak."], ["Pinney's Beach, Nevis", "Long golden sand, palm trees and a famous beach bar."], ["Charlestown", "Birthplace of Alexander Hamilton, now a small museum."]]}, "antigua": {"name": "Antigua & Barbuda", "country": "Antigua and Barbuda", "tagline": "Nelson's harbour, three hundred and sixty-five beaches and a pink island next door.", "must": [["Nelson's Dockyard", "The Georgian naval dockyard at English Harbour, a UNESCO site."], ["Shirley Heights on Sunday", "Steel band and sunset above English Harbour."], ["Half Moon Bay", "A protected crescent of sand on the wild Atlantic coast."], ["Barbuda's pink beaches", "Seventeen miles of pink-tinted sand without a footprint."], ["Frigate bird sanctuary", "Thousands of frigate birds in Codrington Lagoon, males puffing scarlet throats."]]}, "montserrat": {"name": "Montserrat", "country": "British Overseas Territory", "tagline": "The emerald isle of the Caribbean, shaped by its living volcano.", "must": [["Soufrière Hills volcano", "Watch the steaming dome from a safe viewpoint."], ["Plymouth from the sea", "The former capital, buried in ash, seen from the boat."], ["Volcano Observatory", "Scientists explain the eruptions that reshaped the island."], ["Rendezvous Bay", "The island's only white-sand beach, reached by sea."], ["Irish heritage", "Shamrocks on passports and a St Patrick's festival unique in the Caribbean."]]}, "guadeloupe": {"name": "Guadeloupe", "country": "France", "tagline": "A butterfly of two islands, with Les Saintes and Marie-Galante as its jewels.", "must": [["Les Saintes", "One of the world's most beautiful bays, red roofs and Fort Napoléon."], ["Cousteau Reserve", "Diving and snorkelling around the Pigeon Islets."], ["Marie-Galante", "Ox carts, white beaches and some of the finest agricultural rums in the world."], ["Chutes du Carbet", "Waterfalls tumbling from the slopes of La Soufrière."], ["Pointe des Châteaux", "Cliffs at the eastern tip where the Atlantic meets the Caribbean Sea."]]}, "dominica": {"name": "Dominica", "country": "Commonwealth of Dominica", "tagline": "The nature island: rainforest, rivers and whales that live here all year.", "must": [["Sperm whales", "A resident family of sperm whales just off the west coast."], ["Champagne Reef", "Snorkel through curtains of warm volcanic bubbles."], ["Trafalgar Falls", "Twin waterfalls with hot springs at their foot."], ["Indian River", "A silent rowing-boat trip beneath mangroves and swamp bloodwood."], ["Boiling Lake", "A long rainforest hike to a flooded fumarole, for the adventurous."]]}, "martinique": {"name": "Martinique", "country": "France", "tagline": "The island of flowers, of rum and of the Diamond Rock.", "must": [["Les Anses d'Arlet", "A fishing village, a white church on the beach and turtles in the bay."], ["Diamond Rock", "A rock that served as a Royal Navy ship, an extraordinary dive."], ["Habitation Clément", "Rum cellars, a Creole mansion and a contemporary art park."], ["Saint-Pierre and Mount Pelée", "The old capital destroyed in 1902, beneath its volcano."], ["Josephine's bath", "Waist-deep white sand among the islets of Le François, with a planter's punch."]]}, "stlucia": {"name": "Saint Lucia", "country": "Saint Lucia", "tagline": "Two volcanic spires rising from the sea and the most romantic bays in the Caribbean.", "must": [["The Pitons", "Anchor between Gros Piton and Petit Piton, a UNESCO site."], ["Sulphur Springs", "A drive-in volcano with warm mineral mud baths."], ["Marigot Bay", "A hurricane hole fringed with palms, one of the loveliest anchorages anywhere."], ["Anse Chastanet", "Snorkelling on a reef that starts at the water's edge."], ["Pigeon Island", "Fort ruins and views over Rodney Bay."]]}, "grenadines": {"name": "The Grenadines", "country": "Saint Vincent and the Grenadines", "tagline": "A string of small islands, each more beautiful than the last.", "must": [["Tobago Cays", "Swim with green turtles in a lagoon of impossible blues."], ["Mustique", "The island of discreet celebrities, and a sundowner at Basil's Bar."], ["Bequia", "Admiralty Bay, Princess Margaret Beach and the island's model boat builders."], ["Salt Whistle Bay, Mayreau", "A perfect crescent of sand and palms."], ["Petit St Vincent", "A private-island resort with flags to call for room service."]]}, "grenada": {"name": "Grenada", "country": "Grenada", "tagline": "The spice island: nutmeg, rainforest and a harbour of painted houses.", "must": [["Underwater Sculpture Park", "Statues on the seabed of Molinere Bay, slowly turning to coral."], ["Grand Anse Beach", "Two miles of white sand facing St George's."], ["A spice estate", "Nutmeg, cocoa and cinnamon, and chocolate made on the spot."], ["River Antoine distillery", "A rum distillery still driven by a water wheel."], ["The Carenage", "St George's horseshoe harbour, one of the prettiest in the Caribbean."]]}, "barbados": {"name": "Barbados", "country": "Barbados", "tagline": "English elegance in the Caribbean, alone in the Atlantic to the east.", "must": [["Carlisle Bay", "Snorkel over shipwrecks with turtles in Bridgetown's bay."], ["Bathsheba", "The wild Atlantic coast and its giant rocks."], ["Mount Gay", "A rum tasting with one of the world's oldest rum houses."], ["Oistins on Friday", "The island's fish fry, music and dancing by the sea."], ["Historic Bridgetown", "The old town and the Garrison, a UNESCO site."]]}, "bvi": {"name": "British Virgin Islands", "country": "British Overseas Territory", "tagline": "Sixty islands and cays, the most famous sailing waters in the world.", "must": [["The Baths", "Giant granite boulders and turquoise pools on Virgin Gorda."], ["White Bay, Jost Van Dyke", "Swim ashore to the bar that invented the Painkiller."], ["Anegada", "Endless flats, flamingos and lobster on Loblolly Bay."], ["Sandy Spit", "A sand islet with a single palm tree."], ["The RMS Rhone", "A Victorian steamship wreck, one of the Caribbean's great dives."]]}, "usvi": {"name": "US Virgin Islands", "country": "United States", "tagline": "National park beaches on St John, and the reefs of St Croix.", "must": [["Trunk Bay, St John", "An underwater snorkelling trail in a national park bay."], ["Virgin Islands National Park", "Most of St John is protected forest and coves."], ["Magens Bay, St Thomas", "A sheltered heart-shaped bay."], ["Buck Island Reef", "A national monument reef off St Croix."], ["Charlotte Amalie", "Danish colonial streets and duty-free shopping."]]}, "puertorico": {"name": "Puerto Rico · Culebra & Vieques", "country": "United States", "tagline": "Spanish islands of the east, wild beaches and a glowing bay.", "must": [["Flamenco Beach, Culebra", "A horseshoe of white sand regularly ranked among the world's best."], ["Mosquito Bay, Vieques", "A bioluminescent bay that glows blue with every movement."], ["Old San Juan", "Colourful streets and the fortress of El Morro, a UNESCO site."], ["El Yunque", "The only tropical rainforest in the US national forest system."], ["Icacos cay", "A sandy cay off Fajardo with clear, shallow water."]]}, "turks": {"name": "Turks & Caicos", "country": "British Overseas Territory", "tagline": "Water so clear it seems to vanish, and one of the world's great beaches.", "must": [["Grace Bay", "Twelve miles of soft white sand on Providenciales."], ["Chalk Sound", "A lagoon of an almost unreal turquoise, dotted with tiny islets."], ["Iguana Island", "Little Water Cay and its protected rock iguanas."], ["The Grand Turk wall", "A drop-off plunging thousands of feet just offshore."], ["Humpback whales", "From January to April the whales pass through to calve."]]}, "bahamas": {"name": "The Bahamas · Exumas", "country": "Commonwealth of The Bahamas", "tagline": "Three hundred and sixty-five cays and water in colours you did not know existed.", "must": [["The swimming pigs", "The famous pigs of Big Major Cay paddle out to greet you."], ["Thunderball Grotto", "Swim into the domed cave where a James Bond film was shot."], ["The sandbars", "Private sandbars that appear only at low tide."], ["Harbour Island", "Pink sand beaches and pastel cottages."], ["Allan's Cay iguanas", "Prehistoric-looking rock iguanas on a tiny cay."]]}}}, "faq": {"eyebrow": "Good to know", "title": "Before you come aboard", "items": [["What is included in a day charter?", "Your captain and his service, fuel for the agreed programme, soft drinks and snacks, with boarding and return at Porto Cupecoy marina. Another pick-up point can be arranged."], ["Do my guests need passports?", "Yes. Saint-Martin, Sint Maarten, Saint-Barth and Anguilla belong to three different countries, so every guest, children included, needs a valid passport for most itineraries."], ["Who takes care of customs and clearance?", "Our concierge. We ask for the guest list 48 hours ahead and file every declaration. Port dues and clearance fees are re-invoiced at cost, with receipts."], ["What if the weather turns?", "Your captain checks the forecast and the sea at dawn. If conditions are not right, we propose a calmer route or another date."], ["Can children come aboard?", "Of course. Child life jackets are on board. Simply tell us their ages when you book."], ["What should we bring?", "Swimwear, reef-safe sunscreen, a hat and passports. Towels, snorkelling gear and cold drinks are waiting on board."], ["How do I pay?", "Once we confirm the date, you receive a secure payment link. Nothing is charged before that."], ["How does the tender service work?", "For superyachts only: the boat and a dedicated captain at your yacht's disposal around the clock, under your yacht's insurance. Fuel and other charges are not included."]], "more": "All questions"}}, "fr": {"lang": {"code": "fr", "name": "Français", "short": "FR"}, "nav": {"home": "Accueil", "yacht": "Le Yacht", "charter": "Day Charter", "tender": "Tender Yacht", "voyages": "Voyages Caraïbes", "crew": "Capitaines & équipage", "clearance": "Bon à savoir", "book": "Réserver", "requests": "Demandes", "menu": "Menu", "close": "Fermer"}, "common": {"from": "à partir de", "included": "inclus", "atCost": "au réel", "onQuote": "sur devis", "offered": "offert", "nm": "milles", "min": "min", "h": "h", "nights": "nuits", "days": "jours", "day": "Jour", "discover": "Découvrir", "reserve": "Réserver", "requestQuote": "Demander une proposition", "viewGallery": "Voir la galerie", "addToDay": "Ajouter à ma journée", "removeFromDay": "Retirer de ma journée", "homePort": "Port d'attache", "fromBase": "depuis {base}", "indicative": "Projection simplifiée · distances indicatives", "copy": "Copier le récapitulatif", "copied": "Copié", "selected": "Texte sélectionné", "prev": "Précédent", "next": "Suivant", "season": "Meilleure saison", "distance": "Distance", "duration": "Durée", "onRequest": "sur demande"}, "home": {"eyebrow": "Saint-Martin · Saint-Barthélemy · Anguilla", "tagline": "Where performance embraces elegance.", "lede": "Un Nor-Tech 450 Sport privé, quatre Mercury Racing 400R et un équipage professionnel. Sorties à la journée, service de tender pour superyachts et voyages à travers l'arc antillais.", "ctaBook": "Réserver votre journée", "ctaTender": "Service tender", "statement": "Un confort raffiné, une coque de pur-sang et la mer comme privilège. SARE est né pour le canal entre Saint-Martin et Saint-Barth, là où les alizés lèvent une mer courte et creuse, et où un grand bateau fait toute la différence.", "s1Title": "Day Charter", "s1Text": "Déjeuner à Gustavia, baignade à Colombier, retour à l'heure dorée. Les îles à votre rythme.", "s2Title": "Tender Yacht", "s2Text": "La navette rapide, sèche et discrète que mérite votre superyacht en haute saison.", "s3Title": "Voyages Caraïbes", "s3Text": "Des escapades d'île en île, de Saint-Barth aux Îles Vierges, pensées pour vous.", "crewTitle": "Un capitaine, pas un chauffeur", "crewText": "Diplômés, multilingues et chez eux sur ces eaux. Nos capitaines lisent la météo dès l'aube, réservent votre table et savent quelle baie sera calme à midi.", "crewCta": "Rencontrer l'équipage", "islands": "Trois îles, trois nations, une journée", "figures": [["45", "pieds de carbone et de cuir surpiqué main"], ["1 600", "ch · quatre Mercury Racing 400R"], ["≈ 30", "minutes de Saint-Martin à Gustavia"]], "unique": "Le seul Nor-Tech 450 Sport à Saint-Martin, Anguilla et Saint-Barth."}, "yacht": {"eyebrow": "Le Yacht", "title": "Nor-Tech 450 Sport", "intro": "Construit sur commande dans le Minnesota par l'un des chantiers offshore les plus réputés des États-Unis, le 450 Sport associe une coque de course en V profond aux finitions d'une grande routière : cuir matelassé, pont façon teck, console en carbone et taud de soleil électrique.", "specs": [["Longueur", "13,72 m", "45 pieds"], ["Largeur", "3,66 m", "12 pieds"], ["Moteurs", "4 × 400R", "Mercury Racing"], ["Puissance", "1 600", "ch"], ["Passagers", "14", "maximum"], ["Cabine", "1", "avec toilettes privées"], ["Croisière", "35", "nœuds, en tout confort"], ["Coque", "V profond", "offshore"]], "pillarsTitle": "Pensé pour trois façons de vivre la journée", "pillars": [["La traversée sportive", "Quand le canal de Saint-Barth se creuse sous les alizés, le V profond tranche le clapot et garde les passagers au sec derrière la console."], ["La journée en famille", "Bain de soleil avant, banquettes arrière, ombre du hardtop, porte de bain et échelle, toilettes privées en cabine. Les enfants se baignent pendant que le capitaine réserve le déjeuner."], ["L'arrivée", "Accoster au quai de Gustavia ou devant un beach club avec 45 pieds de coque gris acier et quatre hors-bords blancs fait partie de l'expérience."]], "onboardTitle": "À bord", "onboard": ["Taud de soleil coulissant électrique", "Système audio marin haut de gamme", "Poste de pilotage Garmin et radar", "Porte de plongée latérale et échelle de bain", "Bain de soleil avant et doubles banquettes arrière", "Cabine spacieuse avec toilettes, place pour les bagages", "Douche d'eau douce", "Capote amovible
