["Baie Blanche", "Uma longa praia branca, muitas vezes deserta."]], "dining": [["A bordo", "Não há restaurante na ilha. Leve um piquenique ou siga para Pinel."]], "sights": [["Antiga pista de pouso", "Uma relíquia da época em que a ilha tinha sua própria companhia aérea."]], "activities": [["Tartarugas marinhas", "Costumam pastar nas algas da baía."], ["Naufrágio do rebocador", "Snorkel fácil, em águas rasas."]]}, "stbarth": {"name": "Saint-Barthélemy", "side": "Gustavia", "blurb": "O destino emblemático. Chegada ao cais de Gustavia, almoço em Shell Beach ou Saint-Jean, mergulho em Colombier, acessível apenas pelo mar ou a pé.", "anchor": "Formalidades obrigatórias em Gustavia. Colombier com boias da reserva marinha.", "beaches": [["Anse du Colombier", "Acesso pelo mar ou por trilha, tartarugas nas algas."], ["Shell Beach", "A poucos passos de Gustavia, uma praia de conchinhas."], ["Saline", "Praia selvagem e dunas, sem construções."], ["Gouverneur", "Uma enseada emoldurada por colinas, deslumbrante ao pôr do sol."]], "dining": [["Shellona, Shell Beach", "Cozinha mediterrânea na areia."], ["Nikki Beach, Saint-Jean", "O icônico almoço festivo da ilha."], ["Eden Rock, Saint-Jean", "A mesa do hotel sobre seu famoso rochedo."], ["Bonito, Gustavia", "Ceviches com vista para o porto."]], "sights": [["Wall House Museum", "O passado sueco da ilha."], ["Farol do Fort Gustav", "Panorama sobre o porto e as ilhotas."], ["Corossol", "Vila de pescadores e museu de conchas."], ["Gustavia", "A Rue de la République e suas boutiques refinadas."]], "activities": [["Snorkel em Colombier", "Tartarugas e raias na baía."], ["Compras em Gustavia", "Joias, moda, mercearia fina."], ["Mergulho", "Pain de Sucre e Les Gros Islets."], ["Kitesurf", "Lagoa do Grand Cul-de-Sac."]]}, "fourchue": {"name": "Île Fourchue", "side": "Reserva marinha", "blurb": "Uma ferradura vulcânica entre Saint-Martin e St. Barth. Baía abrigada, água cristalina, nenhuma construção.", "anchor": "Boias da reserva marinha na baía. Uma parada perfeita a caminho de Gustavia.", "beaches": [["A baía", "Uma pequena praia de seixos e areia no fundo da baía."]], "dining": [["A bordo", "Sem serviços na ilha. Uma parada para nadar antes ou depois de Gustavia."]], "sights": [["Paisagem lunar", "Colinas nuas e cactos, uma trilha até as cristas."]], "activities": [["Snorkel", "Corais e peixes tropicais junto às pedras."], ["Natação", "Água profunda e calma na boia."]]}, "anguilla": {"name": "Anguilla", "side": "Road Bay · Sandy Island · Prickly Pear", "blurb": "As praias mais brancas da região, a vinte minutos de Saint-Martin. Sandy Island e Prickly Pear vêm depois das formalidades em Road Bay.", "anchor": "Formalidades em Road Bay obrigatórias antes de Sandy Island e Prickly Pear.", "beaches": [["Sandy Island", "Um banco de areia e algumas palmeiras de frente para Road Bay."], ["Prickly Pear Cays", "Ilhotas remotas de água cristalina."], ["Shoal Bay East", "Uma das praias mais belas do Caribe."], ["Meads Bay", "Areia fina como talco diante dos grandes hotéis."]], "dining": [["Sandy Island beach bar", "Lagosta grelhada no banco de areia."], ["Blanchards, Meads Bay", "A grande mesa da ilha."], ["Elvis' Beach Bar, Sandy Ground", "Rum punch em um barco-bar."], ["The Dune Preserve", "O bar de madeira flutuante de Rendezvous Bay."]], "sights": [["Heritage Collection Museum", "A história e a cultura de Anguilla."], ["Sandy Ground", "A vila de Road Bay e sua salina."], ["Wallblake House", "A casa de plantação mais antiga da ilha."]], "activities": [["Snorkel em Prickly Pear", "Recifes rasos ao redor das ilhotas."], ["Mergulho em naufrágios", "Parque marinho de Road Bay."], ["Caminhada em Shoal Bay", "Três quilômetros de areia branca."]]}}, "tender": {"eyebrow": "Tender Yacht · Alta temporada", "title": "O tender do seu iate, dia e noite", "intro": "Durante toda a sua locação, a SARE e o seu capitão se tornam o tender do seu iate. De dia e de noite, cada trajeto pelo mar fica por nossa conta: passeios dos convidados, idas à terra, transfers para o aeroporto ou outra ilha, abastecimento e pequenas tarefas.", "quote": "Um barco, um capitão, ao lado do seu iate vinte e quatro horas por dia, sete dias por semana.", "seasonTitle": "A temporada em resumo", "season": [["Nov.", "Os iates chegam e se posicionam"], ["1–20 dez.", "A temporada ganha ritmo"], ["20 dez. – 5 jan.", "Natal e Ano-Novo em Gustavia"], ["Jan. – mar.", "Alta temporada e regatas"], ["Abril", "Les Voiles de Saint-Barth e o fim da temporada"]], "missionsTitle": "Cada trajeto pelo mar", "missions": [["Passeios e excursões", "Almoço em Anguilla, um mergulho em Colombier, snorkel em Tintamarre. O iate mantém a ancoragem, os convidados mantêm o seu ritmo."], ["Idas à terra", "Do iate ao cais de Gustavia, beach clubs, restaurantes e villas, do café da manhã à última volta."], ["Transfers do aeroporto", "Recebemos seus convidados na chegada a Princess Juliana (SXM), ao aeroporto de St. Barth (SBH) ou a Anguilla (AXA); um carro os leva com a bagagem até o píer mais próximo e depois o mar, até o iate, a villa ou a próxima ilha. O caminho mais rápido entre um voo de longa distância e o iate."], ["Abastecimento e tarefas", "Mantimentos, flores, vinhos, peças urgentes: tudo o que o iate precisar, buscado em Saint-Martin ou Saint-Barth."], ["Logística da tripulação", "Troca de tripulação, lavanderia, compras e compromissos em terra."], ["Dia e noite", "Disponível por VHF ou WhatsApp a qualquer hora, de prontidão perto do iate."]], "whyTitle": "Por que os capitães de iate escolhem o SARE", "why": [["Pontualidade ao minuto", "Cada trajeto registrado e confirmado na véspera."], ["Experiência em plataformas", "Aproximações com defensas às plataformas de banho, convidados conduzidos pela mão."], ["Seco em alta velocidade", "Um casco offshore em V profundo mantém convidados e bagagens secos, mesmo no canal."], ["Discrição", "Nenhuma foto de convidados, jamais. Acordos de confidencialidade assinados sob pedido."]], "formatsTitle": "Contratação", "formats": [["Por dia", "24 horas à sua disposição"], ["Por semana", "Sete dias ao lado do seu iate"], ["Temporada de festas", "20 dez. – 5 jan."], ["Sob medida", "Evento, regata ou estadia mais longa"]], "asideTitle": "Orçamento em até 12 horas", "asideText": "A tarifa depende da duração da locação e da área de navegação do seu iate. Nosso concierge responde com uma proposta firme.", "asideNote": "As datas da temporada de festas são reservadas a partir de setembro. Reservar cedo garante a disponibilidade.", "howTitle": "Como funciona", "how": [["À sua disposição, 24/7", "O capitão vive no ritmo do seu iate, do primeiro café ao último traslado depois do jantar."], ["Parte do seu iate", "Durante toda a locação, a SARE opera como o tender do seu iate, sob o seguro do seu iate e ao lado da tripulação."], ["Capitão tudo incluído", "Uma única tarifa cobre o barco e um capitão profissional dedicado. Nada mais a reservar, nada a acrescentar."], ["Custos operacionais à parte", "Combustível e todas as demais despesas, como taxas portuárias e desembaraço (clearance), não estão incluídos na tarifa e são pagos separadamente."]], "terms": [["Barco e capitão dedicado, 24/7", "incluído"], ["Combustível", "não incluído"], ["Taxas portuárias, clearance e outras despesas", "não incluído"], ["Seguro", "apólice do seu iate"]], "seasonHint": "Toque em um período para ver o que ele reserva", "seasonCta": "Solicitar este período", "seasonDetails": ["Os superiates chegam da travessia do Atlântico e se instalam em Simpson Bay e Gustavia. As semanas mais tranquilas para garantir um tender para toda a temporada.", "Os proprietários e seus primeiros convidados embarcam. Reservando agora, você garante seu barco e sua tripulação antes da agitação das festas.", "A quinzena mais movimentada do ano: o porto de Gustavia fica lotado e os fogos iluminam o céu no Réveillon. Nosso tender costuma estar reservado desde setembro.", "Ventos alísios constantes, céu limpo e a temporada de regatas, da Heineken Regatta no início de março ao St. Barths Bucket no fim do mês.", "Les Voiles de Saint-Barth e os últimos dias longos da temporada, antes de os iates seguirem para o norte."], "hook": "Muitos iates cruzam o Atlântico sem o seu tender: o custo e a logística raramente compensam. Chegue às ilhas e encontre o seu à espera.", "facts": ["Até 14 convidados", "Capota removível contra os respingos", "Cabine espaçosa para a bagagem", "35 nós de cruzeiro, casco Deep-V seco", "O único Nor-Tech 450 Sport das ilhas"], "handler": ["Seus contatos dedicados", "Um único contato, da primeira mensagem ao último retorno. Cédric e Rebecca respondem diretamente a capitães, chief stewards, brokers e convidados.", "WhatsApp de {name}"]}, "voyages": {"eyebrow": "Viagens pelo Caribe", "title": "De St. Barth às Ilhas Virgens", "intro": "Roteiros entre ilhas ao longo do arco do Caribe. Você navega de dia a trinta e cinco nós e dorme em terra, nas melhores villas e hotéis. Nós cuidamos da rota, das paradas para abastecimento, das formalidades e de cada reserva.", "howTitle": "Como funciona uma viagem", "how": [["Navegar de dia, dormir em terra", "O SARE tem uma cabine. Suas noites são em villas e hotéis escolhidos a dedo, reservados por nós."], ["Uma rota lida a cada manhã", "As etapas são planejadas conforme o tempo, com paradas para abastecimento e portos alternativos preparados com antecedência."], ["Formalidades resolvidas", "Cada nova ilha implica formalidades. Seu capitão as prepara com antecedência para que você simplesmente desembarque."], ["Posicionamento", "Para as viagens mais distantes, o barco é posicionado com antecedência. O custo aparece na sua proposta."]], "mapTitle": "O arco", "dreamNote": "Experiências imaginadas para inspirar. Cada viagem é feita sob medida conforme as datas, o tempo e os desejos dos convidados.", "list": [{"id": "north", "name": "As Ilhas do Norte", "region": "St. Barth · Saba · Statia · Nevis", "nights": "2", "nm": "≈ 120", "season": "Dez. – maio", "teaser": "Três dias, quatro bandeiras e as ilhas mais secretas das Ilhas de Sotavento.", "days": [["Gustavia ao meio-dia", "Café da manhã em Simpson Bay, almoço em Shell Beach, um mergulho à tarde com as tartarugas de Colombier. Jantar em Gustavia, uma suíte na colina acima do porto."], ["Saba, a rainha intocada", "Um vulcão verde que se ergue do mar. Mergulhe nos pináculos do parque marinho e almoce em Windwardside. À tarde, Oranje Bay em Statia e a cratera de The Quill. Noite em uma pousada de plantação em Nevis."], ["Brimstone Hill e o retorno", "Manhã na grande fortaleza de St. Kitts, um último mergulho em Cockleshell Bay com The Narrows se estendendo até Nevis, depois uma longa travessia dourada de volta a Saint-Martin."]]}, {"id": "virgin", "name": "Rota das Ilhas Virgens", "region": "Anegada · Virgin Gorda · Jost Van Dyke", "nights": "3", "nm": "≈ 200", "season": "Dez. – jun.", "teaser": "A Passagem de Anegada, onde um casco em V profundo mostra para que foi construído.", "days": [["Pela Passagem de Anegada", "Oitenta milhas de ondulação aberta do Atlântico, cruzadas em velocidade e com conforto. Chegada às planícies sem fim de Anegada para uma lagosta grelhada em meio barril em Loblolly Bay."], ["The Baths", "Manhã entre os rochedos de granito e as piscinas turquesa de Virgin Gorda, antes da chegada dos turistas. Almoço em North Sound, pôr do sol sobre os recifes."], ["Jost Van Dyke", "White Bay em sua forma mais bela: nade até o bar que inventou o Painkiller e perca uma tarde em Sandy Spit, uma ilhota de areia com uma única palmeira."], ["Norman Island e o retorno", "Snorkel nas grutas de Norman Island, onde dizem que piratas esconderam um tesouro, e depois o voo de volta pela Passagem."]]}, {"id": "antigua", "name": "Antígua e Barbuda", "region": "English Harbour · Barbuda · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "Dez. – maio", "teaser": "O porto de Nelson, uma praia rosa de dezessete milhas e o domingo em Shirley Heights.", "days": [["English Harbour", "Chegada ao estaleiro georgiano onde a frota de Nelson era reparada. Superiates atracados, jantar à luz de velas em um antigo galpão de barcos em pedra."], ["As areias rosadas de Barbuda", "Uma praia de areia rosada sem uma pegada sequer, e as fragatas da Codrington Lagoon inflando seus papos escarlates."], ["Shirley Heights", "Uma manhã tranquila em Carlisle Bay, depois o pôr do sol acima de English Harbour ao som da steel band, enquanto a ilha inteira parece chegar."], ["Retorno por Montserrat", "Passagem sob o vulcão fumegante de Montserrat e sua capital soterrada, uma visão inesquecível, e depois o caminho de casa."]]}, {"id": "south", "name": "Das Antilhas Francesas às Granadinas", "region": "Guadalupe · Dominica · Martinica · Santa Lúcia · Granadinas", "nights": "8", "nm": "≈ 480", "season": "Jan. – maio", "teaser": "Oito noites descendo a espinha vulcânica do Caribe, até as tartarugas de Tobago Cays.", "days": [["Les Saintes", "O pequeno arquipélago de Guadalupe, uma das baías mais belas do mundo. Bicicletas, telhados vermelhos e o Fort Napoléon ao pôr do sol."], ["Dominica, a ilha da natureza", "Rios pela floresta tropical, fontes termais e, ao largo, cachalotes que vivem ali o ano inteiro."], ["Martinica", "As Anses d'Arlet, o Diamond Rock erguendo-se do mar e uma noite em uma destilaria de rum entre os canaviais."], ["Os Pitons", "Ancoragem entre os picos gêmeos de Santa Lúcia, Patrimônio da UNESCO. Jantar contemplando o Gros Piton sob as estrelas."], ["Bequia e Mustique", "Os construtores de barcos de Bequia, depois almoço em um bar lendário de Mustique, a ilha das celebridades discretas."], ["Tobago Cays", "Nade com tartarugas-verdes na lagoa mais perfeita das Granadinas, depois um churrasco de lagosta na praia de Petit Bateau."]]}, {"id": "bahamas", "name": "Exumas, Bahamas", "region": "Nassau · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 no local", "season": "Mar. – jun.", "teaser": "Trezen sagem até o último retorno ao porto.", "credentials": ["Habilitações de capitão profissional", "Treinamento básico de segurança STCW", "Certificação em primeiros socorros", "Operadores de rádio VHF marítimo", "Tripulações no seu idioma"], "standardsTitle": "Nossos padrões", "standards": [["Briefing de segurança", "Coletes salva-vidas, procedimentos de emergência e regras de natação explicados no embarque, no seu idioma."], ["Roteamento meteorológico", "Previsão e estado do mar verificados ao amanhecer. Se o canal estiver agitado demais, propomos um programa mais calmo antes de você sair de casa."], ["Manutenção impecável", "Horas de motor registradas, revisão antes de cada temporada, barco limpo e preparado antes de cada saída."], ["Seguro e regularizado", "Seguro de fretamento comercial, embarcação licenciada e equipamentos de segurança inspecionados."], ["Discrição absoluta", "Nenhuma foto de convidados nas redes sociais. Acordos de confidencialidade assinados sob pedido."], ["Hospitalidade", "Toalhas geladas, bebidas frescas, reservas confirmadas: os detalhes que tornam o dia leve."]], "dayTitle": "Um dia com o SARE", "day": [["08:00", "Checagem do tempo e uma ligação para confirmar o seu programa"], ["09:30", "Boas-vindas a bordo, briefing de segurança, toalhas geladas"], ["10:15", "Travessia e primeira parada para nadar"], ["13:00", "Almoço em terra, mesa reservada pelo seu capitão"], ["15:30", "Snorkel, stand-up paddle ou uma sesta sob o toldo"], ["17:30", "Retorno na hora dourada"]], "testimonialsTitle": "Nas palavras dos nossos convidados"}, "clearance": {"eyebrow": "Formalidades e taxas locais", "title": "Várias nações em um só dia", "intro": "Saint-Martin, Sint Maarten, Saint-Barthélemy e Anguilla pertencem a três países diferentes. Cada travessia de fronteira passa pela alfândega. Seu capitão cuida de tudo. Veja aqui o que diz respeito a você. Os territórios do seu programa aparecem em destaque.", "juris": {"fr": {"flag": "FR · Coletividade de Saint-Marti e Allan's Cay", "Iguanas-de-rocha de aparência pré-histórica numa minúscula ilhota."]]}}}, "faq": {"eyebrow": "Bom saber", "title": "Antes de embarcar", "items": [["O que está incluído em um day charter?", "Seu capitão e o serviço dele, combustível para o roteiro combinado, bebidas não alcoólicas e petiscos, com embarque e retorno na marina de Porto Cupecoy. Outro ponto de embarque pode ser combinado."], ["Meus convidados precisam de passaporte?", "Sim. Saint-Martin, Sint Maarten, St. Barth e Anguilla pertencem a três países diferentes, então cada convidado, inclusive crianças, precisa de passaporte válido para a maioria dos roteiros."], ["Quem cuida da alfândega e da imigração?", "Nosso concierge. Pedimos a lista de convidados com 48 horas de antecedência e cuidamos de todas as declarações. Taxas portuárias e de despacho são repassadas pelo custo real, com recibos."], ["E se o tempo mudar?", "Seu capitão confere a previsão e o mar ao amanhecer. Se as condições não forem ideais, propomos uma rota mais tranquila ou outra data."], ["Crianças podem embarcar?", "Claro. Há coletes salva-vidas infantis a bordo. Basta informar as idades na reserva."], ["O que devemos levar?", "Roupa de banho, protetor solar seguro para recifes, chapéu e passaportes. Toalhas, equipamento de snorkel e bebidas geladas esperam por você a bordo."], ["Como faço o pagamento?", "Assim que confirmamos a data, você recebe um link de pagamento seguro. Nada é cobrado antes disso."], ["Como funciona o serviço de tender?", "Somente para superiates: o barco e um capitão dedicado à disposição do seu iate 24 horas por dia, sob o seguro do seu iate. Combustível e demais despesas não incluídos."]], "more": "Todas as perguntas"}}, "nl": {"lang": {"code": "nl", "name": "Nederlands", "short": "NL"}, "nav": {"home": "Home", "yacht": "Het jacht", "charter": "Dagcharter", "tender": "Tender Yacht", "voyages": "Caribische reizen", "crew": "Kapiteins & crew", "clearance": "Goed om te weten", "book": "Reserveren", "re "Sandy Island", "Een zandbank en een paar palmen tegenover Road Bay."], ["Prickly Pear Cays", "Afgelegen eilandjes met kristalhelder water."], ["Shoal Bay East", "Een van de mooiste stranden van de Caraïben."], ["Meads Bay", "Poederzacht zand voor de grote hotels."]], "dining": [["Strandbar van Sandy Island", "Gegrilde kreeft op de zandbank."], ["Blanchards, Meads Bay", "De grote tafel van het eiland."], ["Elvis' Beach Bar, Sandy Ground", "Rumpunch aan een bar in een boot."], ["The Dune Preserve", "De drijfhoutbar van Rendezvous Bay."]], "sights": [["Heritage Collection Museum", "Geschiedenis en cultuur van Anguilla."], ["Sandy Ground", "Het dorp van Road Bay en de zoutvijver."], ["Wallblake House", "Het oudste plantagehuis van het eiland."]], "activities": [["Snorkelen bij Prickly Pear", "Ondiepe riffen rond de eilandjes."], ["Wrakduiken", "Het zeepark van Road Bay."], ["Wandeling over Shoal Bay", "Drie kilometer wit zand."]]}}, "tender": {"eyebrow": "Tender Yacht · Hoogseizoen", "title": "De tender van uw jacht, dag en nacht", "intro": "Gedurende uw hele charter worden SARE en haar kapitein de tender van uw jacht. Dag en nacht nemen wij elke verplaatsing over zee voor onze rekening: uitstapjes van uw gasten, ritten naar de wal, transfers naar de luchthaven of een ander eiland, bevoorrading en boodschappen.", "quote": "Eén boot, één kapitein, vierentwintig uur per dag, zeven dagen per week aan de zijde van uw jacht.", "seasonTitle": "Het seizoen in één oogopslag", "season": [["Nov.", "De jachten komen aan en nemen positie in"], ["1–20 dec.", "Het seizoen komt op gang"], ["20 dec. – 5 jan.", "Kerst en Oud en Nieuw in Gustavia"], ["Jan. – mrt.", "Hoogseizoen en regatta's"], ["April", "Les Voiles de Saint-Barth en het einde van het seizoen"]], "missionsTitle": "Elke verplaatsing over zee", "missions": [["Uitstapjes & excursies", "Lunch op Anguilla, een duik bij Colombier, snorkelen bij Tintamarre. Het jacht blijft voor anker, uw gasten houden hun eigen ritme."], ["Ritten naar de wal", "Van het jacht naar de kade van Gustavia, beachclubs, restaurants en villa's, van het ontbijt tot de laatste rit terug."], ["Luchthaventransfers", "Wij ontvangen uw gasten bij aankomst op Princess Juliana (SXM), de luchthaven van Saint-Barth (SBH) of Anguilla (AXA), een auto brengt hen met bagage naar de dichtstbijzijnde steiger en daarna gaat het over zee naar het jacht, hun villa of het volgende eiland. De snelste weg van een langeafstandsvlucht naar het jacht."], ["Bevoorrading & boodschappen", "Levensmiddelen, bloemen, wijn, dringende onderdelen: alles wat het jacht nodig heeft, opgehaald op Saint-Martin of Saint-Barth."], ["Logistiek voor de bemanning", "Bemanningswissels, was, boodschappen en afspraken aan wal."], ["Dag en nacht", "Op elk uur bereikbaar via VHF of WhatsApp, stand-by vlak bij het jacht."]], "whyTitle": "Waarom jachtkapiteins voor SARE kiezen", "why": [["Op de minuut stipt", "Elke rit vastgelegd en de avond ervoor bevestigd."], ["Getraind op platforms", "Benaderingen met stootkussens aan zwemplatforms, gasten hand in hand overgeholpen."], ["Droog op snelheid", "Een diepe V-offshoreromp houdt gasten en bagage droog, zelfs in het kanaal."], ["Discreet", "Nooit foto's van gasten. Geheimhoudingsverklaringen op verzoek."]], "formatsTitle": "Inzet", "formats": [["Per dag", "24 uur tot uw beschikking"], ["Per week", "Zeven dagen aan de zijde van uw jacht"], ["Feestdagen", "20 dec. – 5 jan."], ["Op maat", "Evenement, regatta of een langer verblijf"]], "asideTitle": "Offerte binnen 12 uur", "asideText": "Het tarief hangt af van de duur van de huur en het vaargebied van uw jacht. Onze conciërge antwoordt met een vast voorstel.", "asideNote": "De data rond de feestdagen worden vanaf september vergeven. Vroeg boeken garandeert beschikbaarheid.", "howTitle": "Hoe het werkt", "how": [["Tot uw beschikking, 24/7", "De kapitein leeft mee op het ritme van uw jacht, van de eerste koffierit tot de laatste shuttle na het diner."], ["Onderdeel van uw jacht", "Gedurende de hele huurperiode fungeert SARE als tender van uw jacht, onder de verzekering van uw jacht en samen met de bemanning."], ["Kapitein all-inclusive", "Eén tarief dekt de boot en een vaste professionele kapitein. Verder niets te boeken, niets toe te voegen."], ["Gebruikskosten apart", "Brandstof en alle overige kosten, zoals havengelden en clearance, zijn niet in het tarief inbegrepen en worden apart verrekend."]], "terms": [["Boot & vaste kapitein, 24/7", "inbegrepen"], ["Brandstof", "niet inbegrepen"], ["Havengelden, clearance & overige kosten", "niet inbegrepen"], ["Verzekering", "via de polis van uw jacht"]], "seasonHint": "Tik op een periode om te zien wat die biedt", "seasonCta": "Deze periode aanvragen", "seasonDetails": ["De superjachten komen aan na hun oversteek van de Atlantische Oceaan en nemen hun plaats in in Simpson Bay en Gustavia. De rustigste weken om een tender voor het hele seizoen vast te leggen.", "Eigenaren en hun eerste gasten komen aan boord. Als u nu boekt, legt u uw boot en bemanning vast vóór de drukte van de feestdagen.", "De drukste twee weken van het jaar: de haven van Gustavia ligt vol en op oudejaarsavond kleurt vuurwerk de lucht. Onze tender is meestal al vanaf september vergeven.", "Constante passaatwinden, heldere luchten en het regattaseizoen, van de Heineken Regatta begin maart tot de St. Barths Bucket later in de maand.", "Les Voiles de Saint-Barth en de laatste lange dagen van het seizoen, voordat de jachten naar het noorden vertrekken."], "hook": "Veel jachten steken de Atlantische Oceaan over zonder hun tender: de kosten en de logistiek wegen zelden op. Kom aan op de eilanden en vind de uwe al wachtend.", "facts": ["Tot 14 gasten", "Afneembare kap tegen buiswater", "Ruime kajuit voor bagage", "35 knopen kruissnelheid, droge Deep-V-romp", "De enige Nor-Tech 450 Sport op de eilanden"], "handler": ["Uw vaste contactpersonen", "Eén aanspreekpunt, van het eerste bericht tot de laatste rit naar huis. Cédric en Rebecca antwoorden kapiteins, chief stewards, brokers en gasten rechtstreeks.", "WhatsApp {name}"]}, "voyages": {"eyebrow": "Caribische reizen", "title": "Van Saint-Barth tot de Maagdeneilanden", "intro": "Eilandhoppen langs de Caribische boog. Overdag vaart u met vijfendertig knopen, 's nachts slaapt u aan wal in de mooiste villa's en hotels. Wij regelen de route, tankstops, inklaringen en elke reservering.", "howTitle": "Zo verloopt een reis", "how": [["Overdag varen, aan wal slapen", "SARE heeft één kajuit. Uw nachten brengt u door in zorgvuldig geselecteerde villa's en hotels, door ons geboekt."], ["Elke ochtend een nieuwe route", "De etappes worden rond het weer gepland, met tankstops en uitwijkhavens vooraf voorbereid."], ["Inklaring geregeld", "Elk nieuw eiland betekent formaliteiten. Uw kapitein regelt ze vooraf, zodat u gewoon aan wal stapt."], ["Positionering", "Voor de verste reizen wordt de boot vooraf gepositioneerd. De kosten staan in uw voorstel."]], "mapTitle": "De boog", "dreamNote": "Belevenissen bedacht om te inspireren. Elke reis wordt afgestemd op de data, het weer en de wensen van de gasten.", "list": [{"id": "north", "name": "De noordelijke eilanden", "region": "Saint-Barth · Saba · Sint-Eustatius · Nevis", "nights": "2", "nm": "≈ 120", "season": "Dec. – mei", "teaser": "Drie dagen, vier vlaggen en de meest verborgen eilanden van de Bovenwindse Eilanden.", "days": [["Gustavia rond het middaguur", "Ontbijt in Simpson Bay, lunch op Shell Beach, 's middags zwemmen met de schildpadden van Colombier. Diner in Gustavia, een suite op de heuvel boven de haven."], ["Saba, de ongerepte koningin", "Een groene vulkaan die uit zee oprijst. Duik bij de pinakels van het zeepark en lunch daarna in Windwardside. 's Middags Oranje Bay op Sint-Eustatius en de krater van The Quill. Overnachting in een plantagehotel op Nevis."], ["Brimstone Hill en terug", "Ochtend bij de grote vesting van Saint Kitts, een laatste duik in Cockleshell Bay met The Narrows die zich uitstrekken naar Nevis, daarna een lange, gouden oversteek terug naar Saint-Martin."]]}, {"id": "virgin", "name": "De Maagdeneilanden", "region": "Anegada · Virgin Gorda · Jost Van Dyke", "nights": "3", "nm": "≈ 200", "season": "Dec. – juni", "teaser": "De Anegada Passage, waar een diepe V-romp laat zien waarvoor hij gebouwd is.", "days": [["Over de Anegada Passage", "Tachtig mijl open Atlantische deining, met snelheid en comfort overgestoken. Aankomst op de eindeloze vlakten van Anegada voor kreeft, gegrild in halve tonnen aan Loblolly Bay."], ["The Baths", "Een ochtend tussen de granieten rotsblokken en turquoise poelen van Virgin Gorda, vóór de dagjesmensen. Lunch in North Sound, zonsondergang boven de riffen."], ["Jost Van Dyke", "White Bay op zijn mooist: zwem naar de bar waar de Painkiller werd uitgevonden en verlies een middag op Sandy Spit, een zandeilandje met één enkele palm."], ["Norman Island en terug", "Snorkel in de grotten van Norman Island, waar ooit piratenschatten verborgen zouden zijn, en vlieg dan terug over de Passage."]]}, {"id": "antigua", "name": "Antigua en Barbuda", "region": "English Harbour · Barbuda · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "Dec. – mei", "teaser": "De haven van Nelson, een roze strand van zeventien mijl en de zondag op Shirley Heights.", "days": [["English Harbour", "Aankomst in de Georgiaanse scheepswerf waar de vloot van Nelson werd gekield. Superjachten langszij, diner bij kaarslicht in een stenen botenhuis."], ["Het roze zand van Barbuda", "Een strand van roze getint zand zonder één voetafdruk, en de fregatvogels van Codrington Lagoon die hun scharlakenrode keel opblazen."], ["Shirley Heights", "Een rustige ochtend in Carlisle Bay, daarna zonsondergang boven English Harbour terwijl de steelband speelt en het hele eiland lijkt toe te stromen."], ["Terug via Montserrat", "Vaar langs de rokende vulkaan van Montserrat en zijn bedolven hoofdstad, een aanblik die u niet vergeet, en dan naar huis."]]}, {"id": "south", "name": "Van de Franse Antillen naar de Grenadines", "region": "Guadeloupe · Dominica · Martinique · Saint Lucia · Grenadines", "nights": "8", "nm": "≈ 480", "season": "Jan. – mei", "teaser": "Acht nachten langs de vulkanische ruggengraat van de Caraïben, tot de schildpadden van de Tobago Cays.", "days": [["Les Saintes", "De kleine archipel van Guadeloupe, een van de mooiste baaien ter wereld. Fietsen, rode daken en Fort Napoléon bij zonsondergang."], ["Dominica, het natuureiland", "Rivieren door het regenwoud, warmwaterbronnen en, voor de kust, potvissen die hier het hele jaar leven."], ["Martinique", "De Anses d'Arlet, de Diamond Rock die uit zee oprijst, en een avond bij een rumstokerij tussen het suikerriet."], ["De Pitons", "Ankeren tussen de twee toppen van Saint Lucia, UNESCO-werelderfgoed. Diner onder de sterren met zicht op de Gros Piton."], ["Bequia en Mustique", "De botenbouwers van Bequia, daarna lunch in een legendarische bar op Mustique, het eiland van discrete beroemdheden."], ["Tobago Cays", "Zwemmen met groene zeeschildpadden in de volmaaktste lagune van de Grenadines, daarna een kreeftenbarbecue op het strand van Petit Bateau."]]}, {"id": "bahamas", "name": "De Exuma's, Bahama's", "region": "Nassau · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 ter plaatse", "season": "Mrt. – juni", "teaser": "Driehonderdvijfenzestig eilandjes, zandbanken die bij eb verschijnen en water in kleuren waarvan u het bestaan niet kende.", "days": [["De Exuma's in", "Van Nassau naar Allan's Cay en zijn prehistorische leguanen. Het water kleurt van saffier naar het bleekste jade terwijl de banken onder de romp oprijzen."], ["Thunderball Grotto", "Zwem de koepelgrot in waar een James Bond-film werd opgenomen, met licht dat door het dak op de vissen valt."], ["De zwemmende varkens", "De beroemde varkens van Big Major Cay zwemmen u tegemoet, daarna lunch in de Staniel Cay Yacht Club."], ["De zandbanken", "Een privézandbank die alleen bij eb bestaat: een gedekte tafel midden in zee, alleen voor u."], ["Harbour Island", "Roze zand, pastelkleurige huisjes en golfkarretjes. Diner in een van de elegantste kleine hotels van de Caraïben."]]}], "formTitle": "Ontwerp uw reis", "formIntro": "Vertel ons over de eilanden waarvan u droomt, uw data en uw gezelschap. Wij antwoorden met een route, een schema van overnachtingen aan wal en een volledig voorstel.", "further": {"title": "Verder weg, op aanvraag", "intro": "Met de boot vooraf ter plaatse ontwerpen wij ook reizen naar de Grenadines, naar Martinique en Saint Lucia, en naar de Exuma's.", "cta": "Vraag naar een reis op maat"}}, "crew": {"eyebrow": "Kapiteins & crew", "title": "Een vloot van professionals, één standaard", "intro": "SARE is een conciërgehuis. Achter elke tocht staat een team van gediplomeerde kapiteins, hostesses en bartenders, gekozen voor uw dag, uw taal en uw gelegenheid. Zij delen één standaard van veiligheid en discretie.", "captainTitle": "Onze kapiteins", "captainText": "Onze kapiteins zijn beroepsmatig gediplomeerd en opgeleid in veiligheid en EHBO. Zij varen elke dag van het seizoen op deze wateren. Voor elke boeking kiezen wij de crew die er het best bij past: de route, de talen aan boord, de gelegenheid. Cédric en Rebecca blijven uw vaste aanspreekpunt, van het eerste bericht tot de laatste rit naar huis.", "credentials": ["Beroepsvaarbewijzen", "STCW basisveiligheidstraining", "EHBO-gecertificeerd", "Bevoegde VHF-marifonisten", "Crew in uw taal"], "standardsTitle": "Onze normen", "standards": [["Veiligheidsinstructie", "Zwemvesten, noodprocedures en zwemregels bij het aan boord gaan uitgelegd, in uw taal."], ["Weerroutering", "Weersverwachting en zeegang bij zonsopgang gecontroleerd. Is het kanaal te ruw, dan stellen wij een rustiger plan voor voordat u van huis vertrekt."], ["Onberispelijk onderhoud", "Motoruren bijgehouden, een servicebeurt vóór elk seizoen, een boot die vóór elke tocht wordt schoongemaakt en voorbereid."], ["Verzekerd en conform", "Verzekering voor commerciële charter, vergund vaartuig en gekeurde veiligheidsuitrusting."], ["Absolute discretie", "Geen foto's van gasten op sociale media. Geheimhoudingsverklaringen op verzoek."], ["Gastvrijheid", "Gekoelde handdoeken, koude dranken, bevestigde reserveringen: de details die een dag moeiteloos maken."]], "dayTitle": "Een dag met SARE", "day": [["08:00", "Weercheck en een telefoontje om uw plan te bevestigen"], ["09:30", "Welkom aan boord, veiligheidsinstructie, gekoelde handdoeken"], ["10:15", "Oversteek en eerste zwemstop"], ["13:00", "Lunch aan wal, tafel gereserveerd door uw kapitein"], ["15:30", "Snorkelen, suppen of een siësta onder de zonnekap"], ["17:30", "Terugkeer in het gouden uur"]], "testimonialsTitle": "Wat onze gasten zeggen"}, "clearance": {"eyebrow": "Inklaring & lokale kosten", "title": "Meerdere naties op één dag", "intro": "Saint-Martin, Sint Maarten, Saint-Barthélemy en Anguilla behoren tot drie verschillende landen. Elke grensovergang verloopt via de douane. Uw kapitein regelt het. Hier leest u wat u aangaat. De gebieden op uw plan zijn gemarkeerd.", "juris": {"fr": {"flag": "FR · Collectiviteit Saint-Martin", "name": "Saint-Martin", "ports": "Marigot, Anse Marcel", "items": ["Vertrek en terugkeer binnen de Franse zijde vereisen geen formaliteiten.", "Aangiften worden online of bij een kiosk gedaan voordat u van gebied wisselt.", "Natuurreservaat bij Pinel en Tintamarre: alleen meerboeien, niet ankeren op zeegras."], "fee": "Lage administratiekosten"}, "nl": {"flag": "NL · Sint Maarten", "name": "Sint Maarten", "ports": "Simpson Bay, Philipsburg", "items": ["In- en uitklaren in Simpson Bay of Great Bay op dezelfde dag.", "Haven- en brugkosten voor de lagune, afhankelijk van de ankerplaats.", "Inschepen aan de Nederlandse zijde is ideaal bij aankomst op luchthaven SXM."], "fee": "Haven- en brugkosten afhankelijk van de route"}, "bl": {"flag": "FR · Saint-Barthélemy", "name": "Saint-Barthélemy", "ports": "A anden", "fromBase": "vanaf Porto Cupecoy", "dayTrip": "Dagtocht", "voyage": "Op reis", "mustDo": "Niet te missen", "reserve": "Reserveer een dag", "guide": "Open de eilandgids", "design": "Stel deze reis samen", "hint": "Tik op een eiland", "regions": {"home": "Onze thuiswateren", "leeward": "Noordelijke Kleine Antillen", "windward": "Zuidelijke Kleine Antillen", "virgin": "Maagdeneilanden en Puerto Rico", "north": "Turks- en Caicoseilanden en Bahama's"}, "islands": {"stmartin": {"name": "Saint-Martin · Sint Maarten", "country": "Frankrijk · Koninkrijk der Nederlanden", "tagline": "Eén eiland, twee naties en onze thuishaven: Franse tafels aan de ene kant, superjachthavens aan de andere.", "must": [["Dineren in Grand Case", "De gastronomische straat van het eiland, met tafels vlak boven het water."], ["Orient Bay", "Het grote strand in het noordoosten, met beachclubs en een turquoise lagune."], ["Pinel en Tintamarre", "Twee beschermde eilandjes: lunch onder de palmen, daarna schildpadden boven het zeegras."], ["Maho Beach", "Lijnvliegtuigen scheren over de zwemmers in hun landing op SXM."], ["De markt van Marigot", "Specerijen, rum en eilandfruit, op zijn mooist op woensdag- of zaterdagochtend."]]}, "stbarth": {"name": "Saint-Barthélemy", "country": "Frankrijk", "tagline": "Het meest elegante eiland van de Caraïben, op dertig minuten van onze steiger.", "must": [["Aankomst in Gustavia", "Leg aan op de kade tussen de superjachten en slenter langs de boetieks van de Rue de la République."], ["Anse du Colombier", "Een baai die alleen over zee of te voet bereikbaar is, waar schildpadden onder de romp grazen."], ["Lunch op Shell Beach", "Met de voeten in het zand op een strand van piepkleine schelpjes, op een steenworp van de haven."], ["Saline", "Wilde duinen en geen gebouw te zien, het eiland op zijn puurst."], ["Oudejaarsavond in Gustavia", "Vuurwerk boven een haven vol met de mooiste jachten ter wereld."]]}, "anguilla": {"name": "Anguilla", "country": "Brits overzees (async()=>{
  if(!(window.claude&&window.claude.use))return;

  if(!user||!(await user.isOwner().catch(()=>false)))return;
  const db=await getDb();if(!db)return;

  db.collection("requests").onSnapshot(snap=>{
    const all=[];for(const d of snap.docs){const items=(d.data()||{}).items||[];items.forEach((r,i)=>all.push({r,i,docId:d.id,items,db}))}
    all.sort((a,b)=>String(b.r.createdAt).localeCompare(String(a.r.createdAt)));reqCache=all;renderOwner();
  },()=>{});
