ion phare. Arrivée au quai de Gustavia, déjeuner à Shell Beach ou à Saint-Jean, baignade à Colombier, accessible uniquement par la mer ou à pied.", "anchor": "Clearance obligatoire à Gustavia. Colombier sur bouées de la réserve marine.", "beaches": [["Anse du Colombier", "Accessible par la mer ou par un sentier, des tortues sur les herbiers."], ["Shell Beach", "À deux pas de Gustavia, une plage de minuscules coquillages."], ["Saline", "Plage sauvage et dunes, sans aucune construction."], ["Gouverneur", "Une anse encadrée de collines, superbe au coucher du soleil."]], "dining": [["Shellona, Shell Beach", "Cuisine méditerranéenne sur le sable."], ["Nikki Beach, Saint-Jean", "L'incontournable déjeuner festif de l'île."], ["Eden Rock, Saint-Jean", "La table de l'hôtel sur son célèbre rocher."], ["Bonito, Gustavia", "Ceviches et vue sur le port."]], "sights": [["Musée du Wall House", "Le passé suédois de l'île."], ["Phare du Fort Gustave", "Panorama sur le port et les îlets."], ["Corossol", "Village de pêcheurs et musée des coquillages."], ["Gustavia", "La rue de la République et ses belles boutiques."]], "activities": [["Snorkeling à Colombier", "Tortues et raies dans la baie."], ["Shopping à Gustavia", "Joaillerie, mode, épicerie fine."], ["Plongée", "Pain de Sucre et Les Gros Islets."], ["Kitesurf", "Lagon de Grand Cul-de-Sac."]]}, "fourchue": {"name": "Île Fourchue", "side": "Réserve marine", "blurb": "Un fer à cheval volcanique entre Saint-Martin et Saint-Barth. Une baie abritée, une eau cristalline, pas une seule construction.", "anchor": "Bouées de la réserve marine dans la baie. Une escale parfaite en route vers Gustavia.", "beaches": [["La baie", "Une petite plage de galets et de sable au fond de la baie."]], "dining": [["À bord", "Aucun service sur l'île. Une escale baignade avant ou après Gustavia."]], "sights": [["Paysage lunaire", "Collines nues et cactus, un sentier jusqu'aux crêtes."]], "activities": [["Snorkeling", "Coraux et poissons tropicaux le long des rochers."], ["Baignade", "Eau profonde et calme au mouillage."]]}, "anguilla": {"name": "Anguilla", "side": "Road Bay · Sandy Island · Prickly Pear", "blurb": "Les plages les plus blanches de la région, à vingt minutes de Saint-Martin. Sandy Island et Prickly Pear se découvrent après la clearance à Road Bay.", "anchor": "Clearance à Road Bay obligatoire avant Sandy Island et Prickly Pear.", "beaches": [["Sandy Island", "Un banc de sable et quelques palmiers face à Road Bay."], ["Prickly Pear Cays", "Des cayes isolées à l'eau cristalline."], ["Shoal Bay East", "L'une des plus belles plages des Caraïbes."], ["Meads Bay", "Un sable poudreux devant les grands hôtels."]], "dining": [["Sandy Island beach bar", "Langouste grillée sur le banc de sable."], ["Blanchards, Meads Bay", "La grande table de l'île."], ["Elvis' Beach Bar, Sandy Ground", "Rum punch dans un bateau-bar."], ["The Dune Preserve", "Le bar en bois flotté de Rendezvous Bay."]], "sights": [["Heritage Collection Museum", "Histoire et culture d'Anguilla."], ["Sandy Ground", "Le village de Road Bay et son étang salé."], ["Wallblake House", "La plus ancienne maison de plantation de l'île."]], "activities": [["Snorkeling à Prickly Pear", "Récifs peu profonds autour des cayes."], ["Plongée sur épaves", "Parc marin de Road Bay."], ["Balade à Shoal Bay", "Trois kilomètres de sable blanc."]]}}, "tender": {"eyebrow": "Tender Yacht · Haute saison", "title": "Le tender de votre yacht, jour et nuit", "intro": "Pendant toute la durée de votre location, SARE et son capitaine deviennent le tender de votre yacht. De jour comme de nuit, chaque trajet en mer nous revient : sorties de vos invités, navettes vers la terre, transferts vers l'aéroport ou une autre île, avitaillement et courses.", "quote": "Un bateau, un capitaine, aux côtés de votre yacht vingt-quatre heures sur vingt-quatre, sept jours sur sept.", "seasonTitle": "La saison en un coup d'œil", "season": [["Nov.", "Les yachts arrivent et prennent position"], ["1er–20 déc.", "La saison monte en puissance"], ["20 déc. – 5 janv.", "Noël et Nouvel An à Gustavia"], ["Janv. – mars", "Pleine saison et régates"], ["Avril", "Les Voiles de Saint-Barth et la fin de saison"]], "missionsTitle": "Chaque trajet en mer", "missions": [["Sorties & excursions", "Déjeuner à Anguilla, baignade à Colombier, snorkeling à Tintamarre. Le yacht garde son mouillage, vos invités gardent leur rythme."], ["Navettes vers la terre", "Du yacht au quai de Gustavia, aux beach clubs, aux restaurants et aux villas, du petit-déjeuner au dernier retour."], ["Transferts aéroport", "Vos invités accueillis à leur arrivée à Princess Juliana (SXM), à l'aéroport de Saint-Barth (SBH) ou à Anguilla (AXA), une voiture jusqu'au ponton le plus proche avec leurs bagages, puis la mer jusqu'au yacht, à leur villa ou sur l'île suivante. Le chemin le plus rapide entre un vol long-courrier et le yacht."], ["Avitaillement & courses", "Épicerie, fleurs, vins, pièces urgentes : tout ce dont le yacht a besoin, rapporté de Saint-Martin ou de Saint-Barth."], ["Logistique équipage", "Relèves d'équipage, blanchisserie, courses et rendez-vous à terre."], ["De jour comme de nuit", "Joignable par VHF ou WhatsApp à toute heure, en attente à proximité du yacht."]], "whyTitle": "Pourquoi les capitaines de yacht choisissent SARE", "why": [["Ponctuel à la minute", "Chaque rotation consignée et confirmée la veille au soir."], ["Rodé aux plateformes", "Approches défendues aux plateformes de bain, invités accompagnés main dans la main."], ["Au sec à pleine vitesse", "Une coque offshore en V profond garde invités et bagages au sec, même dans le canal."], ["Discret", "Jamais de photos des invités. Accords de confidentialité signés sur demande."]], "formatsTitle": "Formules", "formats": [["À la journée", "24 heures à votre disposition"], ["À la semaine", "Sept jours aux côtés de votre yacht"], ["Fêtes de fin d'année", "20 déc. – 5 janv."], ["Sur mesure", "Événement, régate ou séjour prolongé"]], "asideTitle": "Devis sous 12 heures", "asideText": "Le tarif dépend de la durée de la location et de la zone de navigation de votre yacht. Notre conciergerie vous répond avec une proposition ferme.", "asideNote": "Les dates des fêtes partent dès septembre. Une réservation anticipée garantit la disponibilité.", "howTitle": "Le principe", "how": [["À votre disposition, 24h/24 et 7j/7", "Le capitaine vit au rythme de votre yacht, du premier café à rapporter à la dernière navette après le dîner."], ["Une extension de votre yacht", "Pendant toute la location, SARE opère comme le tender de votre yacht, sous l'assurance de votre yacht et aux côtés de son équipage."], ["Capitaine tout compris", "Un seul tarif couvre le bateau et un capitaine professionnel dédié. Rien d'autre à réserver, rien à ajouter."], ["Frais de fonctionnement à part", "Le carburant et tous les autres frais, comme les droits de port et la clearance, ne sont pas inclus dans le tarif et sont réglés séparément."]], "terms": [["Bateau & capitaine dédié, 24h/24", "inclus"], ["Carburant", "non inclus"], ["Droits de port, clearance & autres frais", "non inclus"], ["Assurance", "celle de votre yacht"]], "seasonHint": "Touchez une période pour la découvrir", "seasonCta": "Réserver cette période", "seasonDetails": ["Les superyachts arrivent de leur traversée de l'Atlantique et prennent place à Simpson Bay et à Gustavia. Les semaines les plus calmes pour réserver un tender pour toute la saison.", "Les propriétaires et leurs premiers invités embarquent. En réservant maintenant, vous vous assurez votre bateau et votre équipage avant l'effervescence des fêtes.", "La quinzaine la plus animée de l'année : le port de Gustavia affiche complet et les feux d'artifice illuminent le ciel du Nouvel An. Notre tender est généralement réservé dès septembre.", "Alizés réguliers, ciel limpide et saison des régates, de la Heineken Regatta début mars au St. Barths Bucket plus tard dans le mois.", "Les Voiles de Saint-Barth et les dernières longues journées de la saison, avant que les yachts ne remontent vers le nord."], "hook": "Beaucoup de yachts traversent l'Atlantique sans leur tender : le coût et la logistique n'en valent que rarement la peine. Arrivez dans les îles, le vôtre vous attend.", "facts": ["Jusqu'à 14 invités", "Capote amovible contre les embruns", "Cabine spacieuse pour les bagages", "35 nœuds en croisière, coque Deep-V au sec", "Le seul Nor-Tech 450 Sport des îles"], "handler": ["Vos interlocuteurs dédiés", "Un seul contact, du premier message au dernier retour. Cédric et Rebecca répondent directement aux capitaines, chief stewards, brokers et invités.", "WhatsApp {name}"]}, "voyages": {"eyebrow": "Voyages Caraïbes", "title": "De Saint-Barth aux Îles Vierges", "intro": "Des croisières d'île en île le long de l'arc antillais. Vous naviguez de jour à trente-cinq nœuds et dormez à terre dans les plus belles villas et hôtels ; nous nous occupons de la route, des escales carburant, des clearances et de chaque réservation.", "howTitle": "Le déroulé d'un voyage", "how": [["Naviguer le jour, dormir à terre", "SARE dispose d'une cabine. Vos nuits se passent dans des villas et hôtels choisis avec soin, réservés par nos soins."], ["Une route relue chaque matin", "Les étapes sont planifiées selon la météo, avec escales carburant et ports de repli préparés à l'avance."], ["Clearance prise en charge", "Chaque nouvelle île implique des formalités. Votre capitaine les dépose à l'avance, vous n'avez plus qu'à poser le pied à terre."], ["Convoyage", "Pour les voyages les plus lointains, le bateau est convoyé au préalable. Le coût figure dans votre proposition."]], "mapTitle": "L'arc antillais", "dreamNote": "Des expériences imaginées pour inspirer ; chaque voyage est adapté aux dates, à la météo et aux envies de ses invités.", "list": [{"id": "north", "name": "Les îles du Nord", "region": "Saint-Barth · Saba · Saint-Eustache (Statia) · Niévès", "nights": "2", "nm": "≈ 120", "season": "Déc. – mai", "teaser": "Trois jours, quatre pavillons et les îles les plus secrètes des îles Sous-le-Vent.", "days": [["Gustavia à midi", "Petit-déjeuner à Simpson Bay, déjeuner à Shell Beach, baignade l'après-midi avec les tortues de Colombier. Dîner à Gustavia, une suite sur la colline au-dessus du port."], ["Saba, la reine préservée", "Un volcan vert surgi de la mer. Plongée sur les pinacles du parc marin, puis déjeuner à Windwardside. L'après-midi, Oranje Bay à Saint-Eustache et le cratère du Quill. Nuit dans une auberge de plantation à Niévès."], ["Brimstone Hill et retour", "Matinée à la grande forteresse de Saint-Christophe (St Kitts), dernière baignade à Cockleshell Bay face aux Narrows qui s'étirent jusqu'à Niévès, puis une longue traversée dorée jusqu'à Saint-Martin."]]}, {"id": "virgin", "name": "Cap sur les Îles Vierges", "region": "Anegada · Virgin Gorda · Jost Van Dyke", "nights": "3", "nm": "≈ 200", "season": "Déc. – juin", "teaser": "Le passage d'Anegada, là où une coque en V profond montre ce pour quoi elle a été conçue.", "days": [["La traversée du passage d'Anegada", "Quatre-vingts milles de houle atlantique, franchis vite et en tout confort. Arrivée sur les étendues sans fin d'Anegada pour une langouste grillée en demi-fût à Loblolly Bay."], ["The Baths", "Matinée parmi les blocs de granit et les bassins turquoise de Virgin Gorda, avant l'arrivée des excursionnistes. Déjeuner à North Sound, coucher de soleil sur les récifs."], ["Jost Van Dyke", "White Bay dans toute sa beauté : rejoignez à la nage le bar qui a inventé le Painkiller, puis laissez filer l'après-midi sur Sandy Spit, un îlet de sable et son unique palmier."], ["Norman Island et retour", "Snorkeling dans les grottes de Norman Island, qui auraient caché un trésor de pirates, puis retour à pleine vitesse à travers le passage."]]}, {"id": "antigua", "name": "Antigua-et-Barbuda", "region": "English Harbour · Barbuda · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "Déc. – mai", "teaser": "Le port de Nelson, une plage rose de dix-sept milles et le dimanche à Shirley Heights.", "days": [["English Harbour", "Arrivée dans l'arsenal géorgien où la flotte de Nelson venait caréner. Superyachts à quai, dîner aux chandelles dans un ancien hangar à bateaux en pierre."], ["Les sables roses de Barbuda", "Une plage au sable teinté de rose, vierge de toute empreinte, et les frégates du lagon de Codrington qui gonflent leur gorge écarlate."], ["Shirley Heights", "Une matinée tranquille à Carlisle Bay, puis le coucher de soleil au-dessus d'English Harbour, au son du steel band, quand l'île entière semble s'y retrouver."], ["Retour par Montserrat", "Passage au pied du volcan fumant de Montserrat et de sa capitale ensevelie, une vision inoubliable, puis retour."]]}, {"id": "south", "name": "Des Antilles françaises aux Grenadines", "region": "Guadeloupe · Dominique · Martinique · Sainte-Lucie · Grenadines", "nights": "8", "nm": "≈ 480", "season": "Janv. – mai", "teaser": "Huit nuits le long de l'échine volcanique des Caraïbes, jusqu'aux tortues des Tobago Cays.", "days": [["Les Saintes", "Le petit archipel de la Guadeloupe, l'une des plus belles baies du monde. Vélos, toits rouges et le Fort Napoléon au coucher du soleil."], ["La Dominique, l'île nature", "Des rivières à travers la forêt tropicale, des sources chaudes et, au large, des cachalots présents toute l'année."], ["Martinique", "Les Anses d'Arlet, le Rocher du Diamant surgi de la mer, et une soirée dans une distillerie de rhum au milieu des cannes."], ["Les Pitons", "Mouillage entre les deux pics de Sainte-Lucie, classés à l'UNESCO. Dîner sous les étoiles, face au Gros Piton."], ["Bequia et Moustique", "Les charpentiers de marine de Bequia, puis déjeuner dans un bar légendaire de Moustique, l'île des célébrités discrètes."], ["Tobago Cays", "Baignade avec les tortues vertes dans le plus parfait lagon des Grenadines, puis barbecue de langouste sur la plage de Petit Bateau."]]}, {"id": "bahamas", "name": "Les Exumas, Bahamas", "region": "Nassau · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 sur place", "season": "Mars – juin", "teaser": "Trois cent soixante-cinq cayes, des bancs de sable qui apparaissent à marée basse et une eau aux couleurs que vous ne soupçonniez pas.", "days": [["Entrée dans les Exumas", "De Nassau à Allan's Cay et ses iguanes préhistoriques. L'eau passe du saphir au jade le plus pâle à mesure que les bancs remontent sous la coque."], ["Thunderball Grotto", "Entrez à la nage dans la grotte en dôme où fut tourné un James Bond, la lumière tombant de la voûte sur les poissons."], ["Les cochons nageurs", "Les célèbres cochons de Big Major Cay viennent à votre rencontre à la nage, puis déjeuner au Staniel Cay Yacht Club."], ["Les bancs de sable", "Un banc de sable privé qui n'existe qu'à marée basse : une table dressée au milieu de la mer, rien que pour vous."], ["Harbour Island", "Sable rose, cottages pastel et voiturettes de golf. Dîner dans l'un des petits hôtels les plus élégants des Caraïbes."]]}], "formTitle": "Imaginez votre voyage", "formIntro": "Dites-nous les îles qui vous font rêver, vos dates et le nombre d'invités. Nous vous répondons avec un itinéraire, un planning des nuits à terre et une proposition complète.", "further": {"title": "Plus loin, sur demande", "intro": "Avec un positionnement préalable du bateau, nous imaginons aussi des escapades vers les Grenadines, la Martinique et Sainte-Lucie, ou les Exumas.", "cta": "Demander un voyage sur mesure"}}, "crew": {"eyebrow": "Capitaines & équipage", "title": "Une flotte de professionnels, une seule exigence", "intro": "SARE est une maison de conciergerie. Derrière chaque sortie se tient une équipe de capitaines diplômés, d'hôtesses et de barmen, choisis pour votre journée, votre langue et votre occasion. Tous partagent une même exigence de sécurité et de discrétion.", "captainTitle": "Nos capitaines", "captainText": "Titulaires d'un brevet professionnel et formés à la sécurité comme aux premiers secours, nos capitaines naviguent ces eaux chaque jour de la saison. Pour chaque réservation, nous choisissons l'équipage le mieux adapté : l'itinéraire, les langues parlées à bord, l'occasion. Cédric et Rebecca restent votre unique interlocuteur, du premier message jusqu'au dernier retour à quai.", "credentials": ["Brevets de capitaine professionnel", "Formation sécurité de base STCW", "Certifiés premiers secours", "Opérateurs radio VHF marine", "Équipages parlant votre langue"], "standardsTitle": "Nos exigences", "standards": [["Briefing sécurité", "Gilets de sauvetage, procédures d'urgence et règles de baignade expliqués à l'embarquement, dans votre langue."], ["Routage météo", "Prévisions et état de la mer vérifiés à l'aube. Si le canal est trop agité, nous vous proposons un programme plus calme avant même votre départ."], ["Entretien irréprochable", "Heures moteur consignées, révision avant chaque saison, bateau nettoyé et préparé avant chaque sortie."], ["Assuré et conforme", "Assurance charter professionnelle, navire agréé et équipement de sécurité contrôlé."], ["Discrétion absolue", "Aucune photo des invités sur les réseaux sociaux. Accords de confidentialité signés sur demande."], ["Art de recevoir", "Serviettes rafraîchies, boissons fraîches, réservations confirmées : les détails qui rendent une journée facile."]], "dayTitle": "Une journée avec SARE", "day": [["08:00", "Point météo et appel pour confirmer votre programme"], ["09:30", "Accueil à bord, briefing sécurité, serviettes rafraîchies"], ["10:15", "Traversée et première escale baignade"], ["13:00", "Déjeuner à terre, table réservée par votre capitaine"], ["15:30", "Snorkeling, paddle ou sieste sous le taud"], ["17:30", "Retour à l'heure dorée"]], "testimonialsTitle": "Ils ont navigué avec nous"}, "clearance": {"eyebrow": "Clearance & frais sur place", "title": "Plusieurs nations en une seule journée", "intro": "Saint-Martin, Sint Maarten, Saint-Barthélemy et Anguilla relèvent de trois pays différents. Chaque passage de frontière implique la douane. Votre capitaine s'en charge ; voici ce qui vous concerne. Les territoires de votre programme sont mis en évidence.", "juris": {"fr": {"flag": "FR · Collectivité de Saint-Martin", "name": "Saint-Martin", "ports": "Marigot, Anse Marcel", "items": ["Les départs et retours au sein de la partie française ne nécessitent aucune formalité.", "Les déclarations se font en ligne ou sur borne avant de changer de territoire.", "Réserve naturelle à Pinel et Tintamarre : bouées uniquement, mouillage interdit sur les herbiers."], "fee": "Frais administratifs modestes"}, "nl": {"flag": "NL · Sint Maarten", "name": "Sint Maarten", "ports": "Simpson Bay, Philipsburg", "items": ["Entrée et sortie à Simpson Bay ou Great Bay le jour même.", "Droits de port et de pont du lagon selon le mouillage.", "L'embarquement côté néerlandais est idéal pour les arrivées à l'aéroport SXM."], "fee": "Droits de port et de pont selon l'itinéraire"}, "bl": {"flag": "FR · Saint-Barthélemy", "name": "Saint-Barthélemy", "ports": "Gustavia uniquement", "items": ["Gustavia est l'unique port d'entrée de l'île.", "Formulaire de douane et formulaire du port remplis en ligne avant l'arrivée.", "Droits de port selon la longueur du bateau et l'emplacement : quai ou mouillage.", "Réserve marine : Colombier et Île Fourchue sur bouées."], "fee": "Frais de clearance 3 à 5 € + droits de port"}, "ai": {"flag": "UK · Anguilla", "name": "Anguilla", "ports": "Road Bay, Blowing Point", "items": ["Clearance d'entrée à Road Bay avant toute escale à Sandy Island ou Prickly Pear.", "Les bateaux de charter étrangers s'acquittent de droits d'entrée et de taxes par passager.", "Devis précis envoyé 48 heures à l'avance, selon le nombre d'invités."], "fee": "Droits de charter + taxes passagers, sur devis"}}, "onPlan": "dans votre programme", "entry": "Entrée", "voyagesTitle": "En voyage", "voyagesText": "Chaque nouvelle île ou nation implique une entrée et une sortie, et certains pays comme les Bahamas exigent un permis de croisière. Votre capitaine prépare chaque formalité à l'avance et les frais figurent dans votre proposition.", "checklist": [["Passeports", "Un passeport valide pour chaque invité, enfants compris, dès que la journée quitte la partie française de Saint-Martin."], ["Liste des invités 48 h avant", "Noms, dates de naissance, nationalités et numéros de passeport nous permettent de déposer les déclarations en ligne avant le départ."], ["Frais au réel", "Droits de port, frais de clearance et droits d'entrée sont avancés par le capitaine et refacturés sans marge, justificatifs à l'appui."]], "legal": "Les procédures et montants évoluent selon les autorités portuaires et la saison. Ces informations sont indicatives et confirmées par le capitaine lors de votre réservation."}, "book": {"eyebrow": "Réservation", "title": "Réservez en quelques gestes", "intro": "Choisissez une expérience et une date. Notre conciergerie confirme la disponibilité et la météo, puis vous envoie un lien de paiement sécurisé.", "lFormula": "Expérience", "lDateGuests": "Date & invités", "lDate": "Date", "lDeparture": "Départ", "lGuests": "Invités", "guestOne": "invité", "guestMany": "invités", "lBoarding": "Embarquement", "boarding": ["Simpson Bay, Sint Maarten", "Marigot, Saint-Martin", "Anse Marcel, Saint-Martin", "Gustavia, Saint-Barth", "Depuis votre villa ou votre yacht (à préciser)"], "lOptions": "Options", "lContact": "Vos coordonnées", "lName": "Nom", "lEmail": "E-mail", "lPhone": "Téléphone / WhatsApp", "lNotes": "Occasion, enfants à bord, préférences alimentaires", "submit": "Envoyer ma demande", "errRequired": "Merci d'indiquer une date, votre nom et un e-mail valide.", "summary": "Récapitulatif", "toChoose": "à choisir", "stops": "Escales", "free": "libre", "estimate": "Estimation", "inclLine": "Capitaine, carburant, boissons sans alcool", "highSeason": "HAUTE SAISON · réservez tôt", "jurisNote": "Votre journée traverse {n} juridictions : passeports obligatoires, frais de clearance au réel.", "priceNote": "Tarifs confirmés par notre conciergerie selon la date et la météo. Aucun paiement à ce stade.", "doneTitle": "Demande envoyée. À bientôt à bord.", "doneSaved": "Votre demande est enregistrée. Notre conciergerie vous répondra sous 12 heures avec la confirmation et le lien de paiement.", "doneManual": "Envoyez ce récapitulatif à {email}. Notre conciergerie vous répondra sous 12 heures.", "reference": "Référence", "sumFormula": "Expérience", "sumDate": "Date", "sumBoarding": "Embarquement", "sumOptions": "Options", "sumNone": "aucune", "sumContact": "Contact", "sumNotes": "Remarques", "sumAtCost": "clearance au réel", "next": {"title": "La suite", "steps": [["Sous 12 heures", "Notre conciergerie confirme la disponibilité et vous propose le meilleur itinéraire pour votre journée."], ["La veille", "Un point météo et un appel pour fixer l'heure et le lieu d'embarquement."], ["Paiement", "Un lien de paiement sécurisé une fois tout validé. Aucun paiement à ce stade."]]}, "q_qExperience": "Votre expérience", "q_qWhen": "Quand", "q_qGuests": "Invités", "q_qYou": "Votre nom", "q_qReach": "E-mail ou WhatsApp", "q_pickup": "Prise en charge à ma villa ou à mon yacht", "q_addNote": "Ajouter une note", "q_notePh": "Occasion, enfants à bord, préférences alimentaires…", "q_err": "Merci de choisir une date et d'indiquer votre nom ainsi qu'un moyen de vous joindre.", "q_chat": "Envie d'en parler ? Écrivez-nous sur WhatsApp", "q_less": "moins", "q_more": "plus", "oc_occasion": "Occasion", "oc_optional": "facultatif", "oc_personalise": "Personnaliser ma journée", "oc_none": "Aucune"}, "forms": {"yacht": "Le yacht", "yachtName": "Nom du yacht", "length": "Longueur (m)", "anchorage": "Mouillage prévu", "anchorages": ["Gustavia, Saint-Barth", "Anse du Colombier", "Grand Cul-de-Sac", "Simpson Bay, Sint Maarten", "Marigot, Saint-Martin", "Road Bay, Anguilla", "Autre"], "period": "La période", "from": "Du", "to": "Au", "guestsAboard": "Invités à bord", "services": "Utilisation prévue", "serviceList": ["Sorties & excursions des invités", "Navettes vers la terre", "Transferts aéroport (SXM · SBH · AXA)", "Transferts inter-îles", "Avitaillement & courses", "Logistique équipage", "Navettes de nuit"], "contact": "Contact", "role": "Fonction", "roles": ["Capitaine", "Chef steward / commissaire de bord", "Broker / agent", "Propriétaire / invité", "Concierge"], "emailOrWa": "E-mail ou WhatsApp", "requests": "Demandes particulières", "requestsPh": "Heures d'arrivée des invités, programme du yacht, trajets réguliers…", "submitTender": "Envoyer la demande de tender", "errTender": "Merci d'indiquer le yacht, une date de début, votre nom et un contact.", "doneTender": "Demande de tender reçue", "voyage": "Voyage", "voyageChoice": "Inspiration", "custom": "Un itinéraire sur mesure", "dates": "Dates souhaitées", "party": "Invités", "islandsWish": "Les îles qui vous font rêver", "stay": "Séjours à terre", "stayList": ["Hôtels de charme", "Villas privées", "Resorts mythiques", "Laissez-nous vous conseiller"], "submitVoyage": "Envoyer ma demande de voyage", "errVoyage": "Merci d'indiquer votre nom, un contact et vos dates souhaitées.", "doneVoyage": "Demande de voyage reçue", "sumYacht": "Yacht", "sumAnchorage": "Mouillage", "sumPeriod": "Période", "sumFormat": "Formule", "sumGuests": "Invités", "sumServices": "Prestations", "sumVoyage": "Voyage", "sumStay": "Séjours", "sumIslands": "Îles", "tbd": "à préciser"}, "owner": {"eyebrow": "Bureau de la conciergerie · visible par vous seul", "title": "Demandes reçues", "intro": "Les demandes de day charter, de tender et de voyage envoyées depuis le site arrivent ici en direct. Marquez-les comme traitées une fois votre proposition envoyée.", "empty": "Aucune demande pour le moment. Les réservations envoyées depuis le site apparaîtront ici.", "todo": "à traiter", "done": "traitée", "received": "reçue", "charter": "Charter", "tender": "Tender", "voyage": "Voyage"}, "footer": {"line": "Nor-Tech 450 Sport privé · Saint-Martin, Saint-Barthélemy, Anguilla", "contact": "Réservations", "rights": "SARE Yacht Club & Boats"}, "ui": {"sub": {"yacht": ["Galerie", "Caractéristiques", "Trois façons de naviguer", "À bord"], "charter": ["Expériences", "Inclus", "Personnaliser", "Occasions", "Bon à savoir"], "tender": ["Le principe", "La saison", "Services", "Pourquoi SARE", "Demander un tender"], "voyages": ["Itinéraires", "Comment ça se passe", "Composez le vôtre"], "crew": ["Nos capitaines", "Nos standards", "Une journée à bord"], "clearance": ["Juridictions", "Check-list", "En croisière"], "book": ["Votre réservation"]}, "next": "Chapitre suivant", "onThisPage": "Sur cette page", "goodTitle": "Bon à savoir avant d'embarquer", "goodLink": "Toutes les questions", "chapters": {"home": "Accueil", "yacht": "Le Yacht", "charter": "Day Charter", "tender": "Tender Yacht", "voyages": "Voyages Caraïbes", "crew": "Capitaines & équipage", "clearance": "Bon à savoir", "book": "Réserver"}}, "explore": {"eyebrow": "L'explorateur des îles", "title": "Trois îles à notre porte, toute une mer au-delà", "intro": "Commencez par les trois îles où nous naviguons chaque jour, puis élargissez à toute la Caraïbe. Touchez une île pour découvrir l'essentiel.", "whole": "Voir toute la Caraïbe", "three": "Retour à nos trois îles", "fromBase": "depuis Porto Cupecoy", "dayTrip": "À la journée", "voyage": "En croisière", "mustDo": "À ne pas manquer", "reserve": "Réserver une journée", "guide": "Ouvrir le guide de l'île", "design": "Imaginer cette croisière", "hint": "Touchez une île", "regions": {"home": "Nos eaux", "leeward": "Îles Sous-le-Vent", "windward": "Îles du Vent", "virgin": "Îles Vierges et Porto Rico", "north": "Îles Turques-et-Caïques et Bahamas"}, "islands": {"stmartin": {"name": "Saint-Martin · Sint Maarten", "country": "France · Royaume des Pays-Bas", "tagline": "Une île, deux nations et notre port d'attache : tables françaises d'un côté, marinas de superyachts de l'autre.", "must": [["Dîner à Grand-Case", "La rue gastronomique de l'île, des tables juste au-dessus de l'eau."], ["Baie Orientale", "La grande plage du nord-est, ses beach clubs et son lagon turquoise."], ["Pinel et Tintamarre", "Deux îlots protégés : déjeuner sous les palmiers, puis tortues au-dessus des herbiers."], ["Maho Beach", "Les avions de ligne frôlent les baigneurs en finale vers SXM."], ["Le marché de Marigot", "Épices, rhum et fruits de l'île, idéalement le mercredi ou le samedi matin."]]}, "stbarth": {"name": "Saint-Barthélemy", "country": "France", "tagline": "L'île la plus élégante de la Caraïbe, à trente minutes de notre ponton.", "must": [["Arriver à Gustavia", "Accostez au quai parmi les superyachts, puis flânez dans les boutiques de la rue de la République."], ["Anse du Colombier", "Une anse accessible uniquement par la mer ou à pied, où les tortues broutent sous la coque."], ["Déjeuner à Shell Beach", "Les pieds dans le sable, sur une plage de minuscules coquillages, à deux pas du port."], ["Saline", "Des dunes sauvages et pas une construction à l'horizon, l'île dans sa plus pure expression."], ["Le Nouvel An à Gustavia", "Un feu d'artifice sur un port rempli des plus beaux yachts du monde."]]}, "anguilla": {"name": "Anguilla", "country": "Territoire britannique d'outre-mer", "tagline": "Le sable le plus blanc de la région et un luxe calme, sans hâte, à vingt minutes.", "must": [["Sandy Island", "Un banc de sable, quelques palmiers et de la langouste grillée, face à Road Bay."], ["Prickly Pear Cays", "Des cayes isolées, une eau cristalline et des récifs peu profonds à explorer en snorkeling."], ["Shoal Bay East", "Trois kilomètres de sable poudreux, souvent cités parmi les plus belles plages du monde."], ["The Dune Preserve", "Le bar en bois flotté de Bankie Banx, légende du reggae, sur Rendezvous Bay."], ["Les courses de bateaux", "Le sport national : des sloops construits sur l'île s'affrontent lors des régates d'été."]]}, "saba": {"name": "Saba", "country": "Pays-Bas caribéens", "tagline": "Un volcan verdoyant surgi de la mer, la reine préservée de la Caraïbe.", "must": [["Mount Scenery", "Montez à travers la forêt de nuages jusqu'au point culminant du Royaume des Pays-Bas."], ["Saba Marine Park", "Plongez sur les pinacles, des monts sous-marins couverts de corail et de vie pélagique."], ["The Road", "Une route unique bâtie à la main pendant des décennies, qui serpente de la mer aux villages."], ["Windwardside", "Maisonnettes blanches aux volets verts et toits rouges, déjeuner avec vue."], ["La dentelle de Saba", "Un délicat travail d'aiguille, une tradition que font vivre les femmes de l'île."]]}, "statia": {"name": "Saint-Eustache · Statia", "country": "Pays-Bas caribéens", "tagline": "Une île paisible au grand passé, avec un cratère volcanique parfait.", "must": [["The Quill", "Randonnée dans le cratère d'un volcan endormi, tapissé de forêt tropicale."], ["Fort Oranje", "Là où fut tiré, en 1776, le premier salut au drapeau américain."], ["Les ruines de Lower Town", "Plongez parmi les entrepôts engloutis de ce qui fut le port le plus actif de la Caraïbe."], ["Oranje Bay", "Une baie de sable sombre au pied des falaises d'Oranjestad."], ["Statia Museum", "L'histoire de l'île dans une maison de négociant du XVIIIe siècle."]]}, "stkitts": {"name": "Saint-Kitts-et-Nevis", "country": "Fédération de Saint-Kitts-et-Nevis", "tagline": "Deux îles volcaniques, une grande forteresse et les anciennes plantations devenues auberges à Nevis.", "must": [["Brimstone Hill Fortress", "Une forteresse classée au patrimoine mondial de l'UNESCO, avec vue sur Saba et Statia."], ["The Scenic Railway", "L'ancien train de la canne qui fait le tour de Saint-Kitts, un verre à la main sur le pont ouvert."], ["Cockleshell Bay", "Une plage calme face aux Narrows et au cône du Nevis Peak."], ["Pinney's Beach, Nevis", "Une longue plage de sable doré, des palmiers et un beach bar réputé."], ["Charlestown", "Ville natale d'Alexander Hamilton, aujourd'hui un petit musée."]]}, "antigua": {"name": "Antigua-et-Barbuda", "country": "Antigua-et-Barbuda", "tagline": "Le port de Nelson, trois cent soixante-cinq plages et une île rose pour voisine.", "must": [["Nelson's Dockyard", "L'arsenal naval géorgien d'English Harbour, site de l'UNESCO."], ["Shirley Heights le dimanche", "Steel band et coucher de soleil au-dessus d'English Harbour."], ["Half Moon Bay", "Un croissant de sable abrité sur la sauvage côte atlantique."], ["Les plages roses de Barbuda", "Près de trente kilomètres de sable rosé, sans une empreinte de pas."], ["Le sanctuaire des frégates", "Des milliers de frégates dans le lagon de Codrington, les mâles gonflant leur gorge écarlate."]]}, "montserrat": {"name": "Montserrat", "country": "Territoire britannique d'outre-mer", "tagline": "L'île émeraude de la Caraïbe, façonnée par son volcan toujours actif.", "must": [["Le volcan de la Soufrière Hills", "Observez le dôme fumant depuis un point de vue sécurisé."], ["Plymouth depuis la mer", "L'ancienne capitale, ensevelie sous la cendre, vue depuis le bateau."], ["L'observatoire du volcan", "Des scientifiques racontent les éruptions qui ont redessiné l'île."], ["Rendezvous Bay", "La seule plage de sable blanc de l'île, accessible par la mer."], ["L'héritage irlandais", "Un trèfle sur les passeports et une fête de la Saint-Patrick unique dans la Caraïbe."]]}, "guadeloupe": {"name": "Guadeloupe", "country": "France", "tagline": "Un papillon de deux îles, avec Les Saintes et Marie-Galante pour joyaux.", "must": [["Les Saintes", "L'une des plus belles baies du monde, des toits rouges et le Fort Napoléon."], ["La Réserve Cousteau", "Plongée et snorkeling autour des îlets Pigeon."], ["Marie-Galante", "Charrettes à bœufs, plages blanches et quelques-uns des meilleurs rhums agricoles du monde."], ["Les Chutes du Carbet", "Des cascades qui dévalent les pentes de la Soufrière."], ["La Pointe des Châteaux", "Des falaises à la pointe est, là où l'Atlantique rencontre la mer des Caraïbes."]]}, "dominica": {"name": "La Dominique", "country": "Commonwealth de la Dominique", "tagline": "L'île nature : forêt tropicale, rivières et baleines présentes toute l'année.", "must": [["Les cachalots", "Une famille de cachalots résidente, tout près de la côte ouest."], ["Champagne Reef", "Snorkeling à travers des rideaux de bulles volcaniques tièdes."], ["Trafalgar Falls", "Deux cascades jumelles, avec des sources chaudes à leur pied."], ["Indian River", "Une balade silencieuse en barque à rames, sous les mangroves et les mangles médailles."], ["Boiling Lake", "Une longue randonnée en forêt tropicale jusqu'à une fumerolle inondée, pour les plus aventureux."]]}, "martinique": {"name": "Martinique", "country": "France", "tagline": "L'île aux fleurs, l'île du rhum et du Rocher du Diamant.", "must": [["Les Anses d'Arlet", "Un village de pêcheurs, une église blanche sur la plage et des tortues dans la baie."], ["Le Rocher du Diamant", "Un rocher qui servit de navire à la Royal Navy, une plongée extraordinaire."], ["Habitation Clément", "Chais de rhum, maison de maître créole et parc d'art contemporain."], ["Saint-Pierre et la Montagne Pelée", "L'ancienne capitale détruite en 1902, au pied de son volcan."], ["La Baignoire de Joséphine", "Du sable blanc à hauteur de taille parmi les îlets du François, un planteur à la main."]]}, "stlucia": {"name": "Sainte-Lucie", "country": "Sainte-Lucie", "tagline": "Deux pitons volcaniques jaillis de la mer et les baies les plus romantiques de la Caraïbe.", "must": [["Les Pitons", "Mouillez entre le Gros Piton et le Petit Piton, site de l'UNESCO."], ["Sulphur Springs", "Un volcan où l'on entre en voiture, avec des bains de boue minérale tiède."], ["Marigot Bay", "Un abri anticyclonique bordé de palmiers, l'un des plus beaux mouillages qui soient."], ["Anse Chastanet", "Snorkeling sur un récif qui commence au bord de l'eau."], ["Pigeon Island", "Les ruines d'un fort et la vue sur Rodney Bay."]]}, "grenadines": {"name": "Les Grenadines", "country": "Saint-Vincent-et-les-Grenadines", "tagline": "Un chapelet de petites îles, chacune plus belle que la précédente.", "must": [["Tobago Cays", "Nagez avec les tortues vertes dans un lagon aux bleus irréels."], ["Mustique", "L'île des célébrités discrètes, et un verre au coucher du soleil au Basil's Bar."], ["Bequia", "Admiralty Bay, Princess Margaret Beach et les maquettistes de bateaux de l'île."], ["Salt Whistle Bay, Mayreau", "Un croissant parfait de sable et de palmiers."], ["Petit St Vincent", "Un resort sur île privée, où l'on hisse un drapeau pour appeler le room service."]]}, "grenada": {"name": "La Grenade", "country": "La Grenade", "tagline": "L'île aux épices : muscade, forêt tropicale et un port aux maisons colorées.", "must": [["Le parc de sculptures sous-marines", "Des statues posées au fond de Molinere Bay, que le corail recouvre peu à peu."], ["Grand Anse Beach", "Trois kilomètres de sable blanc face à St George's."], ["Un domaine d'épices", "Muscade, cacao et cannelle, et du chocolat fabriqué sur place."], ["La distillerie River Antoine", "Une distillerie de rhum toujours mue par une roue à aubes."], ["The Carenage", "Le port en fer à cheval de St George's, l'un des plus jolis de la Caraïbe."]]}, "barbados": {"name": "La Barbade", "country": "La Barbade", "tagline": "L'élégance anglaise dans la Caraïbe, seule en Atlantique, plus à l'est.", "must": [["Carlisle Bay", "Snorkeling au-dessus d'épaves, avec les tortues, dans la baie de Bridgetown."], ["Bathsheba", "La côte atlantique sauvage et ses rochers géants."], ["Mount Gay", "Une dégustation chez l'une des plus anciennes maisons de rhum au monde."], ["Oistins le vendredi", "La grande fête du poisson de l'île, musique et danse au bord de la mer."], ["Le Bridgetown historique", "La vieille ville et la Garrison, site de l'UNESCO."]]}, "bvi": {"name": "Îles Vierges britanniques", "country": "Territoire britannique d'outre-mer", "tagline": "Soixante îles et cayes, le plan d'eau le plus célèbre au monde pour la voile.", "must": [["The Baths", "Des blocs de granit géants et des piscines turquoise à Virgin Gorda."], ["White Bay, Jost Van Dyke", "Rejoignez à la nage le bar qui a inventé le Painkiller."], ["Anegada", "Des platiers à perte de vue, des flamants roses et de la langouste à Loblolly Bay."], ["Sandy Spit", "Un îlot de sable et un unique palmier."], ["Le RMS Rhone", "L'épave d'un vapeur victorien, l'une des grandes plongées de la Caraïbe."]]}, "usvi": {"name": "Îles Vierges américaines", "country": "États-Unis", "tagline": "Les plages du parc national de St John et les récifs de St Croix.", "must": [["Trunk Bay, St John", "Un sentier sous-marin de snorkeling dans une baie du parc national."], ["Virgin Islands National Park", "L'essentiel de St John est un sanctuaire de forêts et de criques."], ["Magens Bay, St Thomas", "Une baie abritée en forme de cœur."], ["Buck Island Reef", "Un récif classé monument national, au large de St Croix."], ["Charlotte Amalie", "Des rues coloniales danoises et du shopping en duty free."]]}, "puertorico": {"name": "Porto Rico · Culebra et Vieques", "country": "États-Unis", "tagline": "Les îles espagnoles de l'est, des plages sauvages et une baie lumineuse.", "must": [["Flamenco Beach, Culebra", "Un fer à cheval de sable blanc, régulièrement classé parmi les plus belles plages du monde."], ["Mosquito Bay, Vieques", "Une baie bioluminescente qui s'illumine de bleu au moindre mouvement."], ["Le Vieux San Juan", "Des rues colorées et la forteresse d'El Morro, site de l'UNESCO."], ["El Yunque", "La seule forêt tropicale du réseau des forêts nationales américaines."], ["La caye d'Icacos", "Une caye de sable au large de Fajardo, à l'eau claire et peu profonde."]]}, "turks": {"name": "Îles Turques-et-Caïques", "country": "Territoire britannique d'outre-mer", "tagline": "Une eau si claire qu'elle semble disparaître, et l'une des plus belles plages du monde.", "must": [["Grace Bay", "Près de vingt kilomètres de sable blanc et doux à Providenciales."], ["Chalk Sound", "Un lagon d'un turquoise presque irréel, parsemé de minuscules îlots."], ["Iguana Island", "Little Water Cay et ses iguanes terrestres protégés."], ["Le tombant de Grand Turk", "Une paroi qui plonge à des centaines de mètres, tout près du rivage."], ["Les baleines à bosse", "De janvier à avril, les baleines passent ici pour mettre bas."]]}, "bahamas": {"name": "Les Bahamas · Exumas", "country": "Commonwealth des Bahamas", "tagline": "Trois cent soixante-cinq cayes et une eau aux couleurs que vous ne soupçonniez pas.", "must": [["Les cochons nageurs", "Les célèbres cochons de Big Major Cay nagent à votre rencontre."], ["Thunderball Grotto", "Entrez à la nage dans la grotte en dôme où fut tourné un James Bond."], ["Les bancs de sable", "Des bancs de sable privés qui n'apparaissent qu'à marée basse."], ["Harbour Island", "Plages de sable rose et maisonnettes aux couleurs pastel."], ["Les iguanes d'Allan's Cay", "Des iguanes terrestres à l'allure préhistorique sur une caye minuscule."]]}}}, "faq": {"eyebrow": "Bon à savoir", "title": "Avant de monter à bord", "items": [["Qu'est-ce qui est inclus dans un Day Charter ?", "Votre capitaine et son service, le carburant pour le programme convenu, les softs et les encas, avec départ et retour à la marina de Porto Cupecoy. Un autre point d'embarquement peut être organisé."], ["Mes invités ont-ils besoin d'un passeport ?", "Oui. Saint-Martin, Sint Maarten, Saint-Barth et Anguilla relèvent de trois pays différents : chaque invité, enfants compris, doit avoir un passeport valide pour la plupart des itinéraires."], ["Qui s'occupe de la douane et de la clearance ?", "Notre conciergerie. Nous vous demandons la liste des invités 48 heures à l'avance et nous effectuons toutes les déclarations. Les droits de port et frais de clearance sont refacturés au réel, justificatifs à l'appui."], ["Et si la météo change ?", "Votre capitaine vérifie les prévisions et l'état de la mer dès l'aube. Si les conditions ne sont pas réunies, nous vous proposons un itinéraire plus abrité ou une autre date."], ["Les enfants peuvent-ils venir à bord ?", "Bien sûr. Des gilets de sauvetage enfants sont à bord. Indiquez-nous simplement leur âge lors de la réservation."], ["Que faut-il apporter ?", "Maillots de bain, crème solaire respectueuse des récifs, un chapeau et les passeports. Serviettes, équipement de snorkeling et boissons fraîches vous attendent à bord."], ["Comment se passe le paiement ?", "Dès que nous confirmons la date, vous recevez un lien de paiement sécurisé. Rien n'est débité avant."], ["Comment fonctionne le service Tender Yacht ?", "Réservé aux superyachts : le bateau et un capitaine dédié à la disposition de votre yacht jour et nuit, sous l'assurance de votre yacht. Carburant et autres frais non inclus."]], "more": "Toutes les questions"}}, "es": {"lang": {"code": "es", "name": "Español", "short": "ES"}, "nav": {"home": "Inicio", "yacht": "El yate", "charter": "Charter de día", "tender": "Tender Yacht", "voyages": "Travesías por el Caribe", "crew": "Capitanes y tripulación", "clearance": "Bueno saber", "book": "Reservar", "requests": "Solicitudes", "menu": "Menú", "close": "Cerrar"}, "common": {"from": "desde", "included": "incluido", "atCost": "a precio de coste", "onQuote": "bajo presupuesto", "offered": "cortesía de la casa", "nm": "millas", "min": "min", "h": "h", "nights": "noches", "days": "días", "day": "Día", "discover": "Descubrir", "reserve": "Reservar", "requestQuote": "Solicitar una propuesta", "viewGallery": "Ver la galería", "addToDay": "Añadir a mi día", "removeFromDay": "Quitar de mi día", "homePort": "Puerto base", "fromBase": "desde {base}", "indicative": "Proyección simplificada · distancias orientativas", "copy": "Copiar resumen", "copied": "Copiado", "selected": "Texto seleccionado", "prev": "Anterior", "next": "Siguiente", "season": "Mejor temporada", "distance": "Distancia", "duration": "Duración", "onRequest": "bajo petición"}, "home": {"eyebrow": "San Martín · San Bartolomé · Anguila", "tagline": "Where performance embraces elegance.", "lede": "Un Nor-Tech 450 Sport privado, cuatro Mercury Racing 400R y una tripulación profesional. Charters de día, servicio de tender para superyates y travesías por el arco caribeño.", "ctaBook": "Reserve su día", "ctaTender": "Servicio de tender", "statement": "Confort refinado, un casco de pura raza y el mar como privilegio. SARE nació para el canal entre San Martín y San Bartolomé, donde los alisios levantan una mar corta y empinada y un gran barco marca toda la diferencia.", "s1Title": "Charter de día", "s1Text": "Almuerzo en Gustavia, un baño en Colombier y regreso con la luz dorada. Las islas a su propio ritmo.", "s2Title": "Tender Yacht", "s2Text": "La lancha rápida, seca y discreta que su superyate merece en temporada alta.", "s3Title": "Travesías por el Caribe", "s3Text": "Escapadas de isla en isla, de San Bartolomé a las Islas Vírgenes, diseñadas para usted.", "crewTitle": "Un capitán, no un conductor", "crewText": "Titulados, políglotas y como en casa en estas aguas. Nuestros capitanes leen el tiempo al amanecer, reservan su mesa y saben qué bahía estará en calma al mediodía.", "crewCta": "Conozca a la tripulación", "islands": "Tres islas, tres naciones, un solo día", "figures": [["45", "pies de carbono y cuero cosido a mano"], ["1.600", "hp · cuatro Mercury Racing 400R"], ["≈ 30", "minutos de San Martín a Gustavia"]], "unique": "El único Nor-Tech 450 Sport en San Martín, Anguila y San Bartolomé."}, "yacht": {"eyebrow": "El yate", "title": "Nor-Tech 450 Sport", "intro": "Construido a medida en Minnesota por uno de los astilleros offshore más célebres de Estados Unidos, el 450 Sport une un casco de competición en V profunda con los acabados de un gran turismo: cuero capitoneado, cubierta efecto teca, consola de carbono y toldo solar eléctrico.", "specs": [["Eslora", "13,72 m", "45 pies"], ["Manga", "3, ila."], ["Sandy Ground", "El pueblo de Road Bay y su salina."], ["Wallblake House", "La casa de plantación más antigua de la isla."]], "activities": [["Snorkel en Prickly Pear", "Arrecifes poco profundos alrededor de los cayos."], ["Buceo en pecios", "Parque marino de Road Bay."], ["Paseo por Shoal Bay", "Tres kilómetros de arena blanca."]]}}, "tender": {"eyebrow": "Tender Yacht · Temporada alta", "title": "El tender de su yate, día y noche", "intro": "Durante todo su alquiler, SARE y su capitán se convierten en el tender de su yate. De día y de noche, cada trayecto por mar es cosa nuestra: salidas de sus invitados, traslados a tierra, transfers al aeropuerto o a otra isla, aprovisionamiento y recados.", "quote": "Un barco, un capitán, junto a su yate las veinticuatro horas, los siete días de la semana.", "seasonTitle": "La temporada de un vistazo", "season": [["Nov.", "Los yates llegan y se posicionan"], ["1–20 dic.", "La temporada toma impulso"], ["20 dic. – 5 ene.", "Navidad y Año Nuevo en Gustavia"], ["Ene. – mar.", "Temporada alta y regatas"], ["Abril", "Les Voiles de Saint-Barth y el final de la temporada"]], "missionsTitle": "Cada trayecto por mar", "missions": [["Salidas y excursiones", "Almuerzo en Anguilla, un baño en Colombier, snorkel en Tintamarre. El yate conserva su fondeo, sus invitados conservan su ritmo."], ["Traslados a tierra", "Del yate al muelle de Gustavia, a beach clubs, restaurantes y villas, del desayuno al último regreso."], ["Traslados al aeropuerto", "Recibimos a sus invitados a su llegada a Princess Juliana (SXM), al aeropuerto de San Bartolomé (SBH) o a Anguila (AXA); un coche los lleva con su equipaje hasta el muelle más cercano y luego el mar, hasta el yate, su villa o la isla siguiente. El camino más rápido entre un vuelo de largo recorrido y el yate."], ["Aprovisionamiento y recados", "Víveres, flores, vino, repuestos urgentes: todo lo que el yate necesite, traído desde Saint-Martin o Saint-Barth."], ["Logística de tripulación", "Cambios de tripulación, lavandería, compras y citas en tierra."], ["Día y noche", "Localizable por VHF o WhatsApp a cualquier hora, en espera cerca del yate."]], "whyTitle": "Por qué los capitanes de yate eligen SARE", "why": [["Puntualidad al minuto", "Cada trayecto registrado y confirmado la víspera."], ["Expertos en plataformas", "Aproximaciones con defensas a las plataformas de baño y ayuda de la mano a cada invitado."], ["Secos a toda velocidad", "Un casco offshore en V profunda mantiene secos a invitados y equipaje, incluso en el canal."], ["Discretos", "Nunca fotografiamos a los invitados. Acuerdos de confidencialidad firmados bajo petición."]], "formatsTitle": "Modalidades", "formats": [["Por día", "24 horas a su disposición"], ["Por semana", "Siete días junto a su yate"], ["Temporada festiva", "20 dic. – 5 ene."], ["A medida", "Evento, regata o estancia más larga"]], "asideTitle": "Presupuesto en 12 horas", "asideText": "La tarifa depende de la duración del alquiler y de la zona de navegación de su yate. Nuestra conserjería le responde con una propuesta en firme.", "asideNote": "Las fechas de la temporada festiva se reservan desde septiembre. Reservar con antelación garantiza la disponibilidad.", "howTitle": "Cómo funciona", "how": [["A su disposición, 24/7", "El capitán vive al ritmo de su yate, desde el primer café hasta el último traslado tras la cena."], ["Parte de su yate", "Durante todo el alquiler, SARE opera como el tender de su yate, bajo el seguro de su yate y junto a su tripulación."], ["Capitán todo incluido", "Una sola tarifa cubre el barco y un capitán profesional dedicado. Nada más que reservar, nada que añadir."], ["Gastos de operación aparte", "El combustible y todos los demás gastos, como tasas portuarias y despacho de aduanas (clearance), no están incluidos en la tarifa y se abonan por separado."]], "terms": [["Barco y capitán dedicado, 24/7", "incluido"], ["Combustible", "no incluido"], ["Tasas portuarias, clearance y otros gastos", "no incluido"], ["Seguro", "el de su yate"]], "seasonHint": "Toque un período para ver lo que ofrece", "seasonCta": "Solicitar este período", "seasonDetails": ["Los superyates llegan tras cruzar el Atlántico y ocupan su lugar en Simpson Bay y Gustavia. Las semanas más tranquilas para asegurar un tender durante toda la temporada.", "Los armadores y sus primeros invitados suben a bordo. Reservar ahora le garantiza su barco y su tripulación antes del ajetreo de las fiestas.", "La quincena más intensa del año: el puerto de Gustavia está lleno y los fuegos artificiales iluminan el cielo en Nochevieja. Nuestro tender suele estar comprometido desde septiembre.", "Alisios constantes, cielos despejados y la temporada de regatas, desde la Heineken Regatta a principios de marzo hasta el St. Barths Bucket a finales de mes.", "Les Voiles de Saint-Barth y los últimos días largos de la temporada, antes de que los yates pongan rumbo al norte."], "hook": "Muchos yates cruzan el Atlántico sin su tender: el coste y la logística rara vez compensan. Llegue a las islas y encuentre el suyo esperándole.", "facts": ["Hasta 14 invitados", "Capota desmontable contra los rociones", "Cabina amplia para el equipaje", "35 nudos de crucero, casco Deep-V seco", "El único Nor-Tech 450 Sport de las islas"], "handler": ["Sus contactos dedicados", "Un solo contacto, del primer mensaje al último regreso. Cédric y Rebecca responden directamente a capitanes, jefes de cabina, brokers e invitados.", "WhatsApp a {name}"]}, "voyages": {"eyebrow": "Travesías por el Caribe", "title": "De San Bartolomé a las Islas Vírgenes", "intro": "Recorridos de isla en isla a lo largo del arco caribeño. Navega de día a treinta y cinco nudos y duerme en tierra en las mejores villas y hoteles. Nosotros nos ocupamos de la ruta, el combustible, los despachos y cada reserva.", "howTitle": "Cómo funciona una travesía", "how": [["Navegar de día, dormir en tierra", "SARE tiene un solo camarote. Sus noches transcurren en villas y hoteles seleccionados y reservados por nosotros."], ["Una ruta revisada cada mañana", "Las etapas se planifican según el tiempo, con escalas de combustible y puertos alternativos previstos de antemano."], ["Despachos resueltos", "Cada nueva isla implica trámites. Su capitán los presenta con antelación para que usted simplemente baje a tierra."], ["Posicionamiento", "Para las travesías más lejanas, el barco se posiciona con antelación. El coste figura en su propuesta."]], "mapTitle": "El arco", "dreamNote": "Experiencias imaginadas para inspirar. Cada travesía se adapta a las fechas, al tiempo y a los deseos de sus invitados.", "list": [{"id": "north", "name": "Las islas del norte", "region": "San Bartolomé · Saba · Statia · Nevis", "nights": "2", "nm": "≈ 120", "season": "dic. – mayo", "teaser": "Tres días, cuatro banderas y las islas más secretas de Sotavento.", "days": [["Gustavia al mediodía", "Desayuno en Simpson Bay, almuerzo en Shell Beach y baño por la tarde con las tortugas de Colombier. Cena en Gustavia y una suite en la colina sobre el puerto."], ["Saba, la reina intacta", "Un volcán verde que surge del mar. Inmersión en los pináculos del parque marino y almuerzo en Windwardside. Por la tarde, Oranje Bay en Statia y el cráter de The Quill. Noche en una posada de plantación en Nevis."], ["Brimstone Hill y regreso", "Mañana en la gran fortaleza de San Cristóbal, un último baño en Cockleshell Bay con The Narrows extendiéndose hasta Nevis, y una larga travesía dorada de vuelta a San Martín."]]}, {"id": "virgin", "name": "La ruta de las Islas Vírgenes", "region": "Anegada · Virgin Gorda · Jost Van Dyke", "nights": "3", "nm": "≈ 200", "season": "dic. – junio", "teaser": "El paso de Anegada, donde un casco en V profunda demuestra para qué fue construido.", "days": [["A través del paso de Anegada", "Ochenta millas de mar de fondo atlántico, cruzadas a gran velocidad y con total confort. Llegada a las interminables llanuras de Anegada para una langosta asada en medio barril en Loblolly Bay."], ["The Baths", "Mañana entre los bloques de granito y las piscinas turquesa de Virgin Gorda, antes de que lleguen los excursionistas. Almuerzo en North Sound y atardecer sobre los arrecifes."], ["Jost Van Dyke", "White Bay en todo su esplendor: llegada a nado al bar que inventó el Painkiller, y una tarde sin prisa en Sandy Spit, un islote de arena con una sola palmera."], ["Norman Island y regreso", "Snorkel en las cuevas de Norman Island, donde se dice que se escondió un tesoro pirata, y vuelta veloz a través del paso."]]}, {"id": "antigua", "name": "Antigua y Barbuda", "region": "English Harbour · Barbuda · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "dic. – mayo", "teaser": "El puerto de Nelson, una playa rosa de diecisiete millas y el domingo en Shirley Heights.", "days": [["English Harbour", "Llegada al astillero georgiano donde se carenaba la flota de Nelson. Superyates en el muelle y cena a la luz de las velas en un antiguo cobertizo de piedra."], ["Las arenas rosas de Barbuda", "Una playa de arena rosada sin una sola huella, y las fragatas de Codrington Lagoon inflando sus gargantas escarlata."], ["Shirley Heights", "Una mañana tranquila en Carlisle Bay y, después, el atardecer sobre English Harbour mientras suena la steel band y toda la isla parece reunirse allí."], ["Regreso por Montserrat", "Paso bajo el volcán humeante de Montserrat y su capital sepultada, una imagen inolvidable, y regreso a casa."]]}, {"id": "south", "name": "De las Antillas francesas a las Granadinas", "region": "Guadalupe · Dominica · Martinica · Santa Lucía · Granadinas", "nights": "8", "nm": "≈ 480", "season": "ene. – mayo", "teaser": "Ocho noches a lo largo de la columna volcánica del Caribe, hasta las tortugas de los Tobago Cays.", "days": [["Les Saintes", "El pequeño archipiélago de Guadalupe, una de las bahías más bellas del mundo. Bicicletas, tejados rojos y el Fort Napoléon al atardecer."], ["Dominica, la isla natural", "Ríos a través de la selva, aguas termales y, mar adentro, cachalotes que viven aquí todo el año."], ["Martinica", "Les Anses d'Arlet, el Rocher du Diamant surgiendo del mar y una velada en una destilería de ron entre cañaverales."], ["Los Pitons", "Fondeo entre los dos picos gemelos de Santa Lucía, Patrimonio de la UNESCO. Cena bajo las estrellas contemplando el Gros Piton."], ["Bequia y Mustique", "Los carpinteros de ribera de Bequia y, después, almuerzo en un bar legendario de Mustique, la isla de las celebridades discretas."], ["Tobago Cays", "Baño con tortugas verdes en la laguna más perfecta de las Granadinas y, después, una barbacoa de langosta en la playa de Petit Bateau."]]}, {"id": "bahamas", "name": "Las Exumas, Bahamas", "region": "Nassau · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 en destino", "season": "mar. – junio", "teaser": "Trescientos sesenta y cinco cayos, bancos de arena que emergen con la marea baja y un agua de colores que usted no imaginaba.", "days": [["Rumbo a las Exumas", "De Nassau a Allan's Cay y sus iguanas prehistóricas. El agua pasa del zafiro al jade más pálido a medida que los bancos suben bajo el casco."], ["Thunderball Grotto", "Baño en la cueva abovedada donde se rodó una película de James Bond, con la luz cayendo desde el techo sobre los peces."], ["Los cerdos nadadores", "Los famosos cerdos de Big Major Cay nadan para recibirle y, después, almuerzo en el Staniel Cay Yacht Club."], ["Los bancos de arena", "Un banco de arena privado que solo existe con la marea baja: una mesa dispuesta en medio del mar, solo para usted."], ["Harbour Island", "Arena rosa, casitas en tonos pastel y carritos de golf. Cena en uno de los pequeños hoteles más elegantes del Caribe."]]}], "formTitle": "Diseñe su travesía", "formIntro": "Cuéntenos qué islas le hacen soñar, sus fechas y su grupo. Le responderemos con una ruta, un calendario de noches en tierra y una propuesta completa.", "further": {"title": "Más lejos, a petición", "intro": "Con l jería. Le pedimos la lista de invitados con 48 horas de antelación y presentamos todas las declaraciones. Las tasas portuarias y de despacho se refacturan al coste, con sus recibos."], ["¿Y si cambia el tiempo?", "Su capitán revisa el pronóstico y el estado del mar al amanecer. Si las condiciones no son las adecuadas, le proponemos una ruta más tranquila u otra fecha."], ["¿Pueden venir niños a bordo?", "Por supuesto. Hay chalecos salvavidas infantiles a bordo. Solo indíquenos sus edades al reservar."], ["¿Qué debemos llevar?", "Bañador, protector solar respetuoso con los arrecifes, un sombrero y los pasaportes. Toallas, equipo de snorkel y bebidas frías le esperan a bordo."], ["¿Cómo se paga?", "Cuando confirmamos la fecha, recibe un enlace de pago seguro. No se cobra nada antes."], ["¿Cómo funciona el servicio de tender?", "Solo para superyates: la embarcación y un capitán dedicado a disposición de su yate día y noche, bajo el seguro de su yate. El combustible y otros gastos no están incluidos."]], "more": "Todas las preguntas"}}, "ru": {"lang": {"code": "ru", "name": "Русский", "short": "RU"}, "nav": {"home": "Главная", "yacht": "Яхта", "charter": "Дневной чартер", "tender": "Тендер для яхты", "voyages": "Путешествия по Карибам", "crew": "Капитаны и экипаж", "clearance": "Полезно знать", "book": "Забронировать", "requests": "Заявки", "menu": "Меню", "close": "Закрыть"}, "common": {"from": "от", "included": "включено", "atCost": "по факту", "onQuote": "по запросу", "offered": "в подарок", "nm": "морских миль", "min": "мин", "h": "ч", "nights": "ночи", "days": "дни", "day": "День", "discover": "Подробнее", "reserve": "Забронировать", "requestQuote": "Запросить предложение", "viewGallery": "Смотреть галерею", "addToDay": "Добавить в мой день", "removeFromDay": "Убрать из моего дня", "homePort": "Порт приписки", "fromBase": "от {base}", "indicative": "Упрощённая проекция · расстояния ориентировочные", "copy": "Скопировать сводку", "copied": "Скопировано", "selected": та, кристальная вода и ни одной постройки.", "anchor": "Буи морского заповедника в бухте. Идеальная остановка по пути в Густавию.", "beaches": [["Бухта", "Небольшой пляж из гальки и песка в глубине бухты."]], "dining": [["На борту", "На острове нет инфраструктуры. Остановка для купания до или после Густавии."]], "sights": [["Лунный пейзаж", "Голые холмы и кактусы, тропа к гребням."]], "activities": [["Снорклинг", "Кораллы и тропические рыбы вдоль скал."], ["Купание", "Глубокая спокойная вода у буя."]]}, "anguilla": {"name": "Ангилья", "side": "Road Bay · Sandy Island · Prickly Pear", "blurb": "Самые белые пляжи региона в двадцати минутах от Сен-Мартена. Sandy Island и Prickly Pear доступны после оформления в Road Bay.", "anchor": "Перед посещением Sandy Island и Prickly Pear обязательно оформление в Road Bay.", "beaches": [["Sandy Island", "Песчаная отмель с несколькими пальмами напротив Road Bay."], ["Prickly Pear Cays", "Уединённые островки с кристальной водой."], ["Shoal Bay East", "Один из красивейших пляжей Карибского бассейна."], ["Meads Bay", "Песок, похожий на пудру, перед лучшими отелями."]], "dining": [["Пляжный бар Sandy Island", "Лобстер на гриле прямо на отмели."], ["Blanchards, Meads Bay", "Главный ресторан острова."], ["Elvis' Beach Bar, Sandy Ground", "Ромовый пунш в баре-лодке."], ["The Dune Preserve", "Бар из плавника в Rendezvous Bay."]], "sights": [["Музей Heritage Collection", "История и культура Ангильи."], ["Sandy Ground", "Деревня Road Bay и соляное озеро."], ["Wallblake House", "Старейший плантаторский дом острова."]], "activities": [["Снорклинг у Prickly Pear", "Неглубокие рифы вокруг островков."], ["Дайвинг на затонувших судах", "Морской парк Road Bay."], ["Прогулка по Shoal Bay", "Три километра белого песка."]]}}, "tender": {"eyebrow": "Тендер для яхты · Высокий сезон", "title": "Тендер Вашей яхты, круглосуточно", "intro": "На всё время Вашей аренды SARE и его капитан становятся тендером Вашей яхты. Днём и ночью любые перемещения по морю мы берём на себя: прогулки гостей, рейсы на берег, трансферы в аэропорт или на другой остров, снабжение и поручения.", "quote": "Одна лодка, один капитан рядом с Вашей яхтой двадцать четыре часа в сутки, семь дней в неделю.", "seasonTitle": "Сезон в общих чертах", "season": [["Нояб.", "Яхты прибывают и встают на позиции"], ["1–20 дек.", "Сезон набирает обороты"], ["20 дек. – 5 янв.", "Рождество и Новый год в Густавии"], ["Янв. – март", "Пик сезона и регаты"], ["Апрель", "Les Voiles de Saint-Barth и завершение сезона"]], "missionsTitle": "Любые перемещения по морю", "missions": [["Прогулки и экскурсии", "Обед на Anguilla, купание в Colombier, снорклинг у Tintamarre. Яхта остаётся на якоре, гости живут в своём ритме."], ["Рейсы на берег", "От яхты до причала Gustavia, бич-клубов, ресторанов и вилл, с завтрака до последнего возвращения."], ["Трансферы из аэропорта", "Мы встречаем Ваших гостей в аэропорту Princess Juliana (SXM), Сен-Бартелеми (SBH) или Ангильи (AXA), автомобиль с багажом доставляет их к ближайшему причалу, а дальше морем на яхту, на виллу или на соседний остров. Самый быстрый путь от дальнего перелёта до яхты."], ["Снабжение и поручения", "Продукты, цветы, вино, срочные запчасти: всё, что нужно яхте, доставим с Saint-Martin или Saint-Barth."], ["Логистика экипажа", "Смена экипажа, прачечная, закупки и встречи на берегу."], ["Днём и ночью", "На связи по VHF или WhatsApp в любое время, в ожидании рядом с яхтой."]], "whyTitle": "Почему капитаны яхт выбирают SARE", "why": [["Пунктуальность до минуты", "Каждый рейс записан и подтверждён накануне вечером."], ["Опыт работы с платформами", "Подход к купальной платформе на кранцах, гостей переводят на борт, держа за руку."], ["Сухо на скорости", "Offshore-корпус с глубоким V сохраняет гостей и багаж сухими даже в проливе."], ["Деликатность", "Никаких фотографий гостей, никогда. Соглашения о неразглашении по запросу."]], "formatsTitle": "Формат сотрудничества", "formats": [["Посуточно", "24 часа в Вашем распоряжении"], ["Понедельно", "Семь дней рядом с Вашей яхтой"], ["Праздничный сезон", "20 дек. – 5 янв."], ["Индивидуально", "Мероприятие, регата или длительное пребывание"]], "asideTitle": "Предложение в течение 12 часов", "asideText": "Стоимость зависит от срока аренды и района плавания Вашей яхты. Наш консьерж-сервис ответит Вам твёрдым предложением.", "asideNote": "Даты праздничного сезона бронируются уже с сентября. Раннее бронирование гарантирует доступность.", "howTitle": "Как это работает", "how": [["В Вашем распоряжении 24/7", "Капитан живёт в ритме Вашей яхты, от первой поездки за кофе до последнего рейса после ужина."], ["Часть Вашей яхты", "На всё время аренды SARE работает как тендер Вашей яхты, по страховке Вашей яхты и вместе с её экипажем."], ["Всё включено с капитаном", "Один тариф покрывает лодку и персонального профессионального капитана. Больше ничего бронировать и добавлять не нужно."], ["Эксплуатационные расходы отдельно", "Топливо и все прочие расходы, например портовые сборы и таможенное оформление, в тариф не входят и оплачиваются отдельно."]], "terms": [["Лодка и персональный капитан, 24/7", "включено"], ["Топливо", "не включено"], ["Портовые сборы, оформление и прочие расходы", "не включено"], ["Страховка", "по полису Вашей яхты"]], "seasonHint": "Нажмите на период, чтобы узнать подробности", "seasonCta": "Запросить эти даты", "seasonDetails": ["Суперяхты прибывают после перехода через Атлантику и встают на стоянку в Simpson Bay и Густавии. Самые спокойные недели, чтобы закрепить тендер на весь сезон.", "Владельцы и их первые гости поднимаются на борт. Забронировав сейчас, Вы закрепите за собой яхту и экипаж до праздничного ажиотажа.", "Самые оживлённые две недели года: гавань Густавии заполнена, а в новогоднюю ночь небо озаряют фейерверки. Наш тендер обычно занят уже с сентября.", "Устойчивые пассаты, ясное небо и сезон регат: от Heineken Regatta в начале марта до St. Barths Bucket в конце месяца.", "Les Voiles de Saint-Barth и последние долгие дни сезона, прежде чем яхты уйдут на север."], "hook": "Многие яхты пересекают Атлантику без своего тендера: расходы и логистика редко того стоят. Прибудьте на острова, и Ваш тендер уже ждёт Вас.", "facts": ["До 14 гостей", "Съёмный тент от брызг", "Просторная каюта для багажа", "35 узлов крейсерской скорости, сухой ход Deep-V", "Единственный Nor-Tech 450 Sport на островах"], "handler": ["Ваши персональные менеджеры", "Один контакт от первого сообщения до последней поездки. Седрик и Ребекка напрямую отвечают капитанам, старшим стюардам, брокерам и гостям.", "WhatsApp: {name}"]}, "voyages": {"eyebrow": "Путешествия по Карибам", "title": "От Сен-Бартелеми до Виргинских островов", "intro": "Путешествия с острова на остров вдоль дуги Карибских островов. Днём Вы идёте со скоростью тридцать пять узлов, а ночуете на берегу в лучших виллах и отелях; маршрут, заправки, таможенное оформление и все бронирования мы берём на себя.", "howTitle": "Как устроено путешествие", "how": [["Днём в море, ночью на берегу", "На SARE одна каюта. Ночи Вы проводите в тщательно отобранных виллах и отелях, которые бронируем мы."], ["Маршрут, выверенный каждое утро", "Этапы планируются с учётом погоды, заправки и запасные гавани подготовлены заранее."], ["Оформление под ключ", "Каждый новый остров означает формальности. Ваш капитан подаёт документы заранее, и Вам остаётся лишь сойти на берег."], ["Перегон", "Для самых дальних путешествий лодку перегоняют заранее. Стоимость указана в Вашем предложении."]], "mapTitle": "Дуга островов", "dreamNote": "Маршруты созданы для вдохновения; каждое путешествие подстраивается под даты, погоду и пожелания гостей.", "list": [{"id": "north", "name": "Северные острова", "region": "Сен-Барт · Саба · Синт-Эстатиус · Невис", "nights": "2", "nm": "≈ 120", "season": "Дек. – май", "teaser": "Три дня, четыре флага и самые потаённые из Подветренных островов.", "days": [["В Густавии к полудню", "Завтрак в Симпсон-Бей, обед на Shell Beach, дневное купание с черепахами Коломбье. Ужин в Густавии, сьют на холме над гаванью."], ["Саба, нетронутая королева", "Зелёный вулкан, поднимающийся из моря. Погружение к подводным пикам морского парка, затем обед в Уиндвардсайде. Днём Oranje Bay на Синт-Эстатиусе и кратер The Quill. Ночь в усадьбе-плантации на Невисе."], ["Бримстоун-Хилл и обратный путь", "Утро в великой крепости Сент-Китса, последнее купание в Cockleshell Bay с видом на пролив Нэрроус до Невиса, затем долгий золотой переход обратно на Сен-Мартен."]]}, {"id": "virgin", "name": "Маршрут по Виргинским островам", "region": "Анегада · Верджин-Горда · Йост-Ван-Дайк", "nights": "3", "nm": "≈ 200", "season": "Дек. – июнь", "teaser": "Пролив Анегада, где корпус с глубоким V показывает, ради чего он создан.", "days": [["Через пролив Анегада", "Восемьдесят миль открытой атлантической зыби, пройденные быстро и с комфортом. Высадка на бескрайние отмели Анегады и лобстер, запечённый в бочках-грилях на Loblolly Bay."], ["The Baths", "Утро среди гранитных валунов и бирюзовых купелей Верджин-Горды, пока не прибыли экскурсанты. Обед в North Sound, закат над рифами."], ["Йост-Ван-Дайк", "White Bay во всей красе: доплыть до бара, где изобрели коктейль Painkiller, а затем провести день на Sandy Spit, песчаном островке с единственной пальмой."], ["Норман-Айленд и обратно", "Снорклинг в пещерах Норман-Айленда, где, по преданию, хранились пиратские сокровища, затем стремительный путь домой через пролив."]]}, {"id": "antigua", "name": "Антигуа и Барбуда", "region": "English Harbour · Барбуда · Jolly Harbour", "nights": "3", "nm": "≈ 220", "season": "Дек. – май", "teaser": "Гавань Нельсона, розовый пляж длиной семнадцать миль и воскресенье на Ширли-Хайтс.", "days": [["English Harbour", "Прибытие на георгианскую верфь, где кренговали корабли флота Нельсона. Суперъяхты у причала, ужин при свечах в каменном лодочном сарае."], ["Розовые пески Барбуды", "Пляж розоватого песка без единого следа и фрегаты лагуны Кодрингтон, раздувающие свои алые горловые мешки."], ["Ширли-Хайтс", "Неспешное утро в Carlisle Bay, затем закат над English Harbour под звуки стил-бэнда, когда кажется, что собирается весь остров."], ["Возвращение мимо Монтсеррата", "Проход под дымящимся вулканом Монтсеррата и его погребённой столицей, незабываемое зрелище, а затем домой."]]}, {"id": "south", "name": "От Французских Антил до Гренадин", "region": "Гваделупа · Доминика · Мартиника · Сент-Люсия · Гренадины", "nights": "8", "nm": "≈ 480", "season": "Янв. – май", "teaser": "Восемь ночей вдоль вулканического хребта Карибов, до черепах Тобаго-Кейс.", "days": [["Ле-Сент", "Крошечный архипелаг Гваделупы с одной из красивейших бухт мира. Велосипеды, красные крыши и форт Наполеон на закате."], ["Доминика, остров природы", "Реки в тропическом лесу, горячие источники и, вдали от берега, кашалоты, живущие здесь круглый год."], ["Мартиника", "Anses d'Arlet, скала Диамант, поднимающаяся из моря, и вечер на ромовой винокурне среди сахарного тростника."], ["Питоны", "Стоянка между двумя пиками Сент-Люсии, объектом ЮНЕСКО. Ужин под звёздами с видом на Гро-Питон."], ["Бекия и Мюстик", "Корабелы Бекии, затем обед в легендарном баре на Мюстике, острове знаменитостей, ценящих приватность."], ["Тобаго-Кейс", "Купание с зелёными черепахами в самой совершенной лагуне Гренадин, затем барбекю из лобстеров на пляже Petit Bateau."]]}, {"id": "bahamas", "name": "Эксума, Багамы", "region": "Нассау · Allan's Cay · Staniel Cay · Harbour Island", "nights": "6", "nm": "≈ 260 на месте", "season": "Март – июнь", "teaser": "Триста шестьдесят пять островков, песчаные отмели, появляющиеся в отлив, и вода таких оттенков, о которых Вы и не подозревали.", "days": [["Вглубь Эксумы", "Из Нассау к Allan's Cay и его доисторическим игуанам. Вода меняется от сапфировой до нежнейшего нефритового оттенка, когда под корпусом поднимаются отмели."], ["Грот Thunderball", "Заплыв в куполообразную пещеру, где снимали фильм о Джеймсе Бонде, а свет падает сквозь свод прямо на рыб."], ["Плавающие свиньи", "Зн ожно ли взять детей?", "Конечно. На борту есть детские спасательные жилеты. Просто укажите их возраст при бронировании."], ["Что взять с собой?", "Купальники, безопасный для рифов солнцезащитный крем, шляпу и паспорта. Полотенца, снаряжение для снорклинга и холодные напитки ждут Вас на борту."], ["Как происходит оплата?", "Как только мы подтвердим дату, Вы получите ссылку для безопасной оплаты. До этого ничего не списывается."], ["Как работает услуга тендера?", "Только для суперяхт: лодка и персональный капитан в распоряжении Вашей яхты круглосуточно, под страховкой Вашей яхты. Топливо и прочие расходы не включены."]], "more": "Все вопросы"}}, "pt": {"lang": {"code": "pt", "name": "Português (Brasil)", "short": "PT"}, "nav": {"home": "Início", "yacht": "O Iate", "charter": "Day Charter", "tender": "Tender Yacht", "voyages": "Viagens pelo Caribe", "crew": "Capitães e tripulação", "clearance": "Bom saber", "book": "Reservar", "requests": "Solicitações", "menu": "Menu", "close": "Fechar"}, "common": {"from": "a partir de", "included": "incluído", "atCost": "a preço de custo", "onQuote": "sob consulta", "offered": "cortesia", "nm": "milhas náuticas", "min": "min", "h": "h", "nights": "noites", "days": "dias", "day": "Dia", "discover": "Descobrir", "reserve": "Reservar", "requestQuote": "Solicitar uma proposta", "viewGallery": "Ver a galeria", "addToDay": "Adicionar ao meu dia", "removeFromDay": "Remover do meu dia", "homePort": "Porto de origem", "fromBase": "saindo de {base}", "indicative": "Projeção simplificada · distâncias indicativas", "copy": "Copiar resumo", "copied": "Copiado", "selected": "Texto selecionado", "prev": "Anterior", "next": "Próximo", "season": "Melhor época", "distance": "Distância", "duration": "Duração", "onRequest": "sob consulta"}, "home": {"eyebrow": "Saint-Martin · Saint-Barthélemy · Anguilla", "tagline": "Where performance embraces elegance.", "lede": "Um Nor-Tech 450 Sport privativo, quatro Mercury Racing 400R e uma tripulação profissional. Day charters, serviço de tender para superiates e viagens por todo o arco do Caribe.", "ctaBook": "Reserve o seu dia", "ctaTender": "Serviço de tender", "statement": "Conforto refinado, um casco de puro-sangue e o mar como privilégio. O SARE nasceu para o canal entre Saint-Martin e St. Barth, onde os ventos alísios levantam um mar curto e cavado, e um grande barco faz toda a diferença.", "s1Title": "Day Charter", "s1Text": "Almoço em Gustavia, um mergulho em Colombier, retorno na hora dourada. As ilhas no seu próprio ritmo.", "s2Title": "Tender Yacht", "s2Text": "O transfer rápido, seco e discreto que o seu superiate merece na alta temporada.", "s3Title": "Viagens pelo Caribe", "s3Text": "Escapadas de ilha em ilha, de St. Barth às Ilhas Virgens, pensadas para você.", "crewTitle": "Um capitão, não um motorista", "crewText": "Habilitados, multilíngues e em casa nestas águas. Nossos capitães leem o tempo ao amanhecer, reservam a sua mesa e sabem qual baía estará calma ao meio-dia.", "crewCta": "Conheça a tripulação", "islands": "Três ilhas, três nações, um só dia", "figures": [["45", "pés de carbono e couro costurado à mão"], ["1.600", "hp · quatro Mercury Racing 400R"], ["≈ 30", "minutos de Saint-Martin a Gustavia"]], "unique": "O único Nor-Tech 450 Sport em Saint-Martin, Anguilla e St. Barth."}, "yacht": {"eyebrow": "O Iate", "title": "Nor-Tech 450 Sport", "intro": "Construído sob encomenda em Minnesota por um dos estaleiros offshore mais celebrados dos Estados Unidos, o 450 Sport une um casco de corrida em V profundo ao acabamento de um grand tourer: couro matelassê, deck com efeito teca, console em carbono e toldo solar elétrico.", "specs": [["Comprimento", "13,72 m", "45 pés"], ["Boca", "3,66 m", "12 pés"], ["Motores", "4 × 400R", "Mercury Racing"], ["Potência", "1.600", "hp"], ["Convidados", "14", "no máximo"], ["Cabine", "1", "com banheiro privativo"], ["Cruzeiro", "35", "nós, com conforto"], ["Casco", "V profundo", "offshore"]], "pillarsTitle": "Feito para tr
