<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#25252c">
<title>SARE · Back office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%2325252c%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-family=%22Georgia%22 font-size=%2234%22 fill=%22%23f1efea%22 text-anchor=%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--hull:#25252c;--hull-2:#2f2f37;--slate:#54677f;--mist:#c8ccdb;--paper:#f6f4f0;--paper-2:#efede8;--card:#fff;--ink:#25252c;--muted:#7a7d86;--line:#e3e0d9;--ok:#2f7a4b;--warn:#a26a00;--bad:#a33a3a;--opt:#7b6aa8;
--display:"Cormorant Garamond",Georgia,serif;--body:Montserrat,system-ui,sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;line-height:1.15}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid var(--hull);background:var(--hull);color:#f1efea;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.line{background:transparent;color:var(--hull)}.btn.ghost{border-color:transparent;background:transparent;color:var(--slate)}.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:10px}.btn:disabled{opacity:.5;cursor:default}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--hull);color:#e9e7e2;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.14em;color:#f1efea;padding:0 10px}
.brand small{display:block;font:500 9px var(--body);letter-spacing:.3em;color:var(--mist);margin-top:2px}
.side nav{margin-top:28px;display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;font-size:13px;color:#cfd2db;border-radius:2px}
.side nav a:hover{background:var(--hull-2);color:#fff}.side nav a.on{background:#3a3a44;color:#fff}
.side nav a .n{margin-left:auto;background:var(--mist);color:var(--hull);font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px}
.site-link{margin-top:14px;display:block;padding:10px 12px;font-size:12px;color:var(--mist);text-decoration:none;border:1px solid #3a3a44;text-align:center;letter-spacing:.06em}.site-link:hover{color:#fff;border-color:var(--mist)}
.side .who{margin-top:auto;padding:14px 12px;border-top:1px solid #3a3a44;font-size:12px;color:var(--mist)}
.side .who b{display:block;color:#fff;font-weight:500;font-size:13px}
.main{padding:32px 40px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}
  .main{padding:20px 16px calc(90px + var(--safe-b))}
  h1{font-size:28px}
  .mtop{display:flex!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--hull);z-index:40;padding:6px 4px calc(6px + var(--safe-b));justify-content:space-around}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#aeb2bd;text-decoration:none;font-size:10px;letter-spacing:.04em;padding:5px 2px}
  .tabbar a.on{color:#fff}.tabbar svg{width:20px;height:20px}
}
.mtop{display:none;align-items:center;justify-content:space-between;background:var(--hull);color:#f1efea;margin:-20px -16px 18px;padding:14px 16px}
.mtop .brand{font-size:24px;padding:0}
/* cards */
.card{background:var(--card);border:1px solid var(--line);padding:20px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);padding:16px 18px}
.kpi .v{font-family:var(--display);font-size:30px;margin-top:6px;line-height:1}
.kpi .s{font-size:11px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}.two>.grid{align-content:start}@media (max-width:1100px){.two{grid-template-columns:1fr}}
/* lists */
.list{background:var(--card);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:#faf9f6}
.row .d{font-size:12px;color:var(--muted)}.row .d b{display:block;font-size:15px;color:var(--ink);font-weight:500}
.row .t{min-width:0}.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12px;color:var(--muted)}
.row .r{text-align:right;font-size:12px}
@media (max-width:600px){.row{grid-template-columns:78px 1fr;}.row .r{grid-column:2;text-align:left}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:#eceae5;color:var(--slate)}
.b-request{background:#eef1f6;color:var(--slate)}.b-option{background:#efeaf7;color:var(--opt)}.b-confirmed{background:#e6f2ea;color:var(--ok)}.b-done{background:#ecebe8;color:#6b6b6b}.b-cancelled{background:#f6e7e7;color:var(--bad)}
.b-paid{background:#e6f2ea;color:var(--ok)}.b-due{background:#fbf1de;color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--card);padding:6px 12px;font-size:12px;cursor:pointer}
.pill.on{background:var(--hull);color:#fff;border-color:var(--hull)}
.search{border:1px solid var(--line);background:var(--card);padding:8px 12px;min-width:220px}
/* calendar */
.cal{background:var(--card);border:1px solid var(--line)}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-g .wd{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);text-align:center}
.cal-g .day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;min-width:0}
.cal-g .day:nth-child(7n){border-right:0}.cal-g .day.out{background:#faf9f6;color:#b5b3ad}
.cal-g .day.today .num{background:var(--hull);color:#fff;border-radius:50%}
.cal-g .day.blocked{background:repeating-linear-gradient(135deg,#f6f4f0 0 6px,#eeebe5 6px 12px)}
.cal-g .num{display:inline-grid;place-items:center;width:24px;height:24px;font-size:12px}
.ev{display:block;font-size:11px;padding:3px 6px;margin-top:3px;border-left:3px solid var(--slate);background:#f1f3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.option{border-color:var(--opt);background:#f3f0f9}.ev.confirmed{border-color:var(--ok);background:#ebf5ee}.ev.done{border-color:#999;background:#f0f0ee}.ev.block{border-color:#9a948a;background:transparent;color:var(--muted)}.ev.req{border:1px dashed var(--warn);border-left:3px solid var(--warn);background:#fffaf0;color:var(--warn)}
@media (max-width:700px){.cal-g .day{min-height:62px;padding:3px}.ev{font-size:0;height:6px;padding:0;margin-top:2px}.ev.block{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
/* forms / modal */
.ov{position:fixed;inset:0;background:rgba(20,22,28,.55);z-index:60;display:flex;justify-content:flex-end}
.panel{background:var(--paper);width:min(720px,100%);height:100%;overflow:auto;padding:0 0 40px;animation:sl .25s ease}
@keyframes sl{from{transform:translateX(30px);opacity:.6}}
.panel-h{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.panel-b{padding:20px 24px;display:grid;gap:18px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
legend{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate);font-weight:600;padding:0;margin-bottom:4px;border-bottom:1px solid var(--line);width:100%;padding-bottom:6px}
.f{display:grid;gap:5px}.f label{font-size:11px;color:var(--muted);letter-spacing:.04em}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:#fff;padding:10px 11px;border-radius:0;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--slate)}
.f textarea{min-height:76px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:600px){.cols,.cols.c3,.cols.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-b,.panel-h{padding-left:16px;padding-right:16px}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pay{display:grid;grid-template-columns:120px 110px 1fr 1fr 30px;gap:6px;align-items:center}
@media (max-width:600px){.pay{grid-template-columns:1fr 1fr}}
.x{border:0;background:none;cursor:pointer;color:var(--bad);font-size:18px}
.sum{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:12px 14px;font-size:12px}
.sum b{display:block;font-family:var(--display);font-size:22px;font-weight:300;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--hull);color:#fff;padding:11px 18px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (min-width:901px){.toast{bottom:28px}}
/* captain trip card */
.trip{background:#fff;border:1px solid var(--line);padding:20px;display:grid;gap:12px}
.trip .big{font-family:var(--display);font-size:26px;line-height:1.15}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;white-space:pre-wrap}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--hull);padding:20px}
.login .box{background:var(--paper);width:min(400px,100%);padding:36px 32px;display:grid;gap:16px}
.login .brand{color:var(--hull);padding:0;text-align:center}.login .brand small{color:var(--slate)}
.err{color:var(--bad);font-size:12px}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:13px}
table.t th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}table.t td.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:140px;padding:10px 0}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.bars i{display:block;width:100%}.bars .rv{background:var(--slate)}.bars .ex{background:#d9b7a0}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const eur=n=>n==null||n===""||isNaN(n)?"—":new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const today=()=>new Date().toISOString().slice(0,10);
const fd=(d,o)=>d?new Date(d+"T12:00:00").toLocaleDateString("fr-FR",o||{weekday:"short",day:"numeric",month:"short"}):"";
const fdl=d=>fd(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const ym=d=>d.slice(0,7);
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const paid=b=>sum((b.payments||[]).map(p=>p.amount));
const waLink=p=>"https://wa.me/"+String(p||"").replace(/\D/g,"");
function toast(m){const t=h("div",{class:"toast"},m);document.body.append(t);setTimeout(()=>t.remove(),2600)}
async function api(path,opts={}){const r=await fetch("/api/admin/"+path,{method:opts.method||(opts.body?"POST":"GET"),headers:{"Content-Type":"application/json"},body:opts.body?JSON.stringify(opts.body):undefined,credentials:"same-origin"});
  const j=await r.json().catch(()=>({}));if(r.status===401&&j.error==="auth"){S.data=null;render();throw new Error("auth")}if(!r.ok)throw new Error(j.error||"Erreur");return j}
const ICON={
 stats:'<path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/>',
 dash:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
 cal:'<path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 8h14v10H5V10z"/>',
 book:'<path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/>',
 inbox:'<path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 12h-4a3 3 0 0 1-6 0H5V5h14v10z"/>',
 users:'<path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/>',
 wrench:'<path d="M22.7 19l-9.1-9.1a6 6 0 0 0-7.9-7.9l3.9 3.9-2.8 2.8L2.9 4.8a6 6 0 0 0 7.9 7.9l9.1 9.1a1 1 0 0 0 1.4 0l1.4-1.4a1 1 0 0 0 0-1.4z"/>',
 euro:'<path d="M15 18.5A6.5 6.5 0 0 1 9.2 15H15v-2H8.6a6 6 0 0 1 0-2H15V9H9.2A6.5 6.5 0 0 1 15 5.5c1.6 0 3.1.6 4.2 1.6L21 5.3A9 9 0 0 0 6.7 9H3v2h3.1a8.3 8.3 0 0 0 0 2H3v2h3.7A9 9 0 0 0 21 18.7l-1.8-1.8a6.4 6.4 0 0 1-4.2 1.6z"/>',
 team:'<path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>',
 gear:'<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z"/>',
 me:'<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 4a3 3 0 1 1-3 3 3 3 0 0 1 3-3zm0 14.2a7.2 7.2 0 0 1-6-3.2c0-2 4-3.1 6-3.1s6 1.1 6 3.1a7.2 7.2 0 0 1-6 3.2z"/>'};
const svg=k=>{const e=document.createElementNS("http://www.w3.org/2000/svg","svg");e.setAttribute("viewBox","0 0 24 24");e.setAttribute("fill","currentColor");e.setAttribute("width","18");e.setAttribute("height","18");e.innerHTML=ICON[k];return e};
const STATUS={request:"Demande",option:"Option",confirmed:"Confirmée",done:"Effectuée",cancelled:"Annulée"};
const TYPE={charter:"Day charter",tender:"Tender",transfer:"Transfert",voyage:"Voyage",other:"Autre"};
const ROLE={owner:"Propriétaire",concierge:"Concierge",captain:"Capitaine"};
const MKIND={service:"Entretien",repair:"Réparation",inspection:"Contrôle",cleaning:"Nettoyage",issue:"Problème signalé",other:"Autre"};
const ECAT={fuel:"Carburant",maintenance:"Entretien / pièces",marina:"Marina / mouillage",insurance:"Assurance",crew:"Équipage",cleaning:"Nettoyage",provisions:"Avitaillement / boissons",fees:"Douane / taxes",marketing:"Marketing",other:"Autre"};
const badge=s=>h("span",{class:"badge b-"+s},STATUS[s]||s);

/* ---------- state ---------- */
const S={data:null,view:"dash",cal:today().slice(0,7),bfilter:"upcoming",q:"",rfilter:"new",efilter:today().slice(0,7)};
const role=()=>S.data?.me?.role;
const staffName=id=>(S.data.staff.find(s=>s.id===id)||{}).name||"";
const VIEWS=()=>role()==="captain"
  ?[["dash","Mes sorties","dash"],["cal","Planning","cal"],["maint","Maintenance","wrench"],["me","Compte","me"]]
  :[["dash","Tableau de bord","dash"],["cal","Calendrier","cal"],["book","Réservations","book"],["req","Demandes","inbox"],["clients","Clients","users"],["stats","Statistiques","stats"],
    ...(role()==="owner"?[["maint","Maintenance","wrench"],["exp","Frais & résultats","euro"],["team","Équipe","team"],["settings","Paramètres","gear"]]:[]),["me","Compte","me"]];
async function load(){try{S.data=await api("data")}catch(e){if(e.message!=="auth")toast(e.message)}render()}
function go(v){S.view=v;location.hash=v;render();window.scrollTo(0,0)}

/* ---------- login / invite ---------- */
function loginView(){
  const inv=(location.hash.match(/invite=([\w-]+)/)||[])[1];
  const box=h("div",{class:"box"},h("div",{class:"brand"},"SARE",h("small",{},"CARIBBEAN BREEZE · BACK OFFICE")));
  const err=h("div",{class:"err"});
  if(inv){
    const pw=h("input",{type:"password",minlength:8,required:true,autocomplete:"new-password"}),pw2=h("input",{type:"password",required:true,autocomplete:"new-password"});
    const title=h("h2",{style:"text-align:center"},"Bienvenue à bord");const sub=h("p",{class:"muted small",style:"text-align:center;margin:0"},"Chargement…");
    fetch("/api/admin/invite/"+inv).then(r=>r.json()).then(j=>{sub.textContent=j.error?j.error:`${j.name||j.email} · ${ROLE[j.role]||""}. Choisissez votre mot de passe.`});
    const f=h("form",{class:"grid",onsubmit:async e=>{e.preventDefault();err.textContent="";if(pw.value!==pw2.value){err.textContent="Les mots de passe ne correspondent pas.";return}
      const r=await fetch("/api/admin/invite/"+inv,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})});const j=await r.json();
      if(!r.ok){err.textContent=j.error;return}history.replaceState(null,"","/admin");load()}},
      h("div",{class:"f"},h("label",{},"Mot de passe (8 caractères min.)"),pw),h("div",{class:"f"},h("label",{},"Confirmer"),pw2),err,h("button",{class:"btn"},"Créer mon accès"));
